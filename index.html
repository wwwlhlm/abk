$('#coords').addEventListener('paste',ev=>setTimeout(()=>{ const el=ev.target, k=oParseCoord(el.value); if(k&&el.value.trim()!==`${k[0]}, ${k[1]}`){ el.value=`${k[0]}, ${k[1]}`; el.dispatchEvent(new Event('input')); } },0));
function coffeeHint(e){ const n=e.coffeeLocations.length, c=e.coffee, h=$('#coffeeHint');
  if(!c&&n===1&&e.coffeeLocations[0]==='Home'){ h.textContent=''; h.classList.remove('warn'); return; } // leere Vorlage
  h.textContent = !c&&!n ? '' : n===c ? `alle ${c} zugeordnet` : `${n} von ${c} zugeordnet`; h.classList.toggle('warn', n!==c); }

/* Details einklappbar */
function foldSummary(e){
  const bits=[e.places.length&&`${e.places.length} ${e.places.length>1?'Orte':'Ort'}`, e.people.length&&e.people.join(', '), e.tags.length&&e.tags.map(t=>'#'+t).join(' '), e.coords&&'📍'].filter(Boolean);
  $('#foldSum').textContent=bits.join(' · ')||'Orte, Personen, Tags, Koordinaten';
  oHints(e);
}
function setFold(open){ $('#details').classList.toggle('open',open); $('#foldBody').classList.toggle('open',open); $('#foldBtn').setAttribute('aria-expanded',open); try{ localStorage.setItem('abkFold',open?'1':''); }catch{} }
$('#foldBtn').onclick=()=>setFold(!$('#details').classList.contains('open'));

/* Eintrag: Desktop inline, Mobile im Schreibmodus über der Tastatur */
function autosize(t){ if(CSS.supports('field-sizing','content')) return; t.style.height='auto'; t.style.height=t.scrollHeight+'px'; }
const words=s=>(s.trim().match(/\S+/g)||[]).length;
function wordCount(){ const n=words(plain($('#entry').value)); $('#wordCount').textContent=n?n+' Wörter':''; }
$('#entry').addEventListener('input',e=>{ autosize(e.target); wordCount(); if(previewOn) renderPrev(); touch({...entryFor(cur),text:e.target.value}); });

/* Format wie bisher: Name = [[…]], Zitat = <span class="quote">…</span> */
const MARK={name:['[[',']]'],quote:['<span class="quote">','</span>']};
const plain=s=>s.replace(/<span class="quote">([\s\S]*?)<\/span>/g,'$1').replace(/\[\[([^\]]+)\]\]/g,'$1');
function renderRich(raw){
  return raw.replace(/<span class="quote">([\s\S]*?)<\/span>/g,'\x00Q\x00$1\x00q\x00').replace(/\[\[([^\]]+)\]\]/g,'\x00N\x00$1\x00n\x00')
    .replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')
    .replace(/\x00Q\x00([\s\S]*?)\x00q\x00/g,'<span class="rq">$1</span>').replace(/\x00N\x00(.*?)\x00n\x00/g,'<span class="rn">$1</span>');
}
function wrap(ta,type){
  const [L,R]=MARK[type], v=ta.value; let a=ta.selectionStart, b=ta.selectionEnd;
  if(v.slice(a-L.length,a)===L&&v.slice(b,b+R.length)===R){ // schon markiert → Markierung entfernen
    ta.setRangeText(v.slice(a,b),a-L.length,b+R.length,'select');
  } else {
    if(a===b&&type==='name'){ a-=v.slice(0,a).match(/[\p{L}\p{N}_-]*$/u)[0].length; b+=v.slice(b).match(/^[\p{L}\p{N}_-]*/u)[0].length; } // Wort unter dem Cursor
    const sel=v.slice(a,b); ta.setRangeText(L+sel+R,a,b,'end'); ta.setSelectionRange(a+L.length,a+L.length+sel.length);
  }
  ta.focus({preventScroll:true}); ta.dispatchEvent(new Event('input',{bubbles:true}));
}
document.querySelectorAll('.fmt-btn[data-fmt]').forEach(b=>{
  b.addEventListener('pointerdown',e=>e.preventDefault()); // Fokus und Auswahl im Textfeld behalten
  b.addEventListener('click',()=>{ const inWriter=!!b.closest('#v-write'); if(!inWriter&&previewOn) setPreview(false); wrap(inWriter?$('#writerTa'):$('#entry'), b.dataset.fmt); });
});
let previewOn=false; try{ previewOn=localStorage.getItem('previewMode')==='true'; }catch{}
function renderPrev(){ const v=$('#entry').value; $('#entryPrev').innerHTML=v.trim()?renderRich(v):'<span class="ph">—</span>'; }
function setPreview(on, animate=true){
  previewOn=on||TOUCH; try{ if(!TOUCH) localStorage.setItem('previewMode',on); }catch{}
  const ta=$('#entry'), pv=$('#entryPrev'); renderPrev();
  $('#prevBtn').classList.toggle('on',on); $('#prevBtn').setAttribute('aria-pressed',on);
  const show=previewOn?pv:ta; ta.hidden=previewOn; pv.hidden=!previewOn;
  if(animate&&!REDUCED&&show.animate) show.animate([{opacity:0,filter:'blur(3px)'},{opacity:1,filter:'blur(0)'}],{duration:300,easing:'ease-out'});
}
$('#prevBtn').onclick=()=>setPreview(!previewOn);
$('#entryPrev').addEventListener('click',()=>{ if(TOUCH) openWriter(); else { setPreview(false); $('#entry').focus(); } });

function writerCount(){ const n=words(plain($('#writerTa').value)); $('#writerCount').textContent=n?n+' Wörter':'Neuer Eintrag'; }
function openWriter(){
  const ta=$('#writerTa'); ta.value=$('#entry').value; $('#writerDate').textContent=fmtDay(cur); writerCount();
  scrollMem.write=0;
  go('write',()=>{ autosize(ta); ta.focus({preventScroll:true}); ta.setSelectionRange(ta.value.length,ta.value.length); }); // Fokus im selben Tipp → iOS öffnet Tastatur
}
function closeWriter(){ if(view!=='write') return; $('#writerTa').blur(); go('entry'); }
$('#writerTa').addEventListener('input',e=>{ autosize(e.target); writerCount(); $('#entry').value=e.target.value; wordCount(); renderPrev(); touch({...entryFor(cur),text:e.target.value}); });
$('#writerDone').onclick=closeWriter;
addEventListener('scroll',()=>{ if(view==='write') $('#wBar').classList.toggle('stuck',scrollY>4); },{passive:true});

/* ═══════════════════════════════════════════════════════════
   DATUMSWÄHLER – Tage → Monate → Jahre, wischen wechselt Monat
   ═══════════════════════════════════════════════════════════ */
let dpY, dpM, dpMode='days', DP_DASH=false, DP_OPEN=false;
const dpRef=()=>DP_DASH?anchor:cur;
function openDatePicker(forDash=false){
  DP_DASH=forDash; const d=parse(dpRef()); dpY=d.getFullYear(); dpM=d.getMonth();
  dpMode=!forDash||per==='week'?'days':per==='month'?'months':'years';
  openSheet(`<div class="sheet-head"><button class="dp-title" id="dpTitle"><span id="dpLabel"></span><svg class="ico" viewBox="0 0 24 24"><path d="m6 9 6 6 6-6"/></svg></button>
    <div class="dp-nav"><button class="icon-btn press" id="dpPrev" aria-label="Zurück"><svg class="ico" viewBox="0 0 24 24"><path d="M15 18l-6-6 6-6"/></svg></button>
    <button class="icon-btn press" id="dpNext" aria-label="Weiter"><svg class="ico" viewBox="0 0 24 24"><path d="M9 18l6-6-6-6"/></svg></button></div></div>
    <div class="dp-stage" id="dpStage"><div id="dpBody"></div></div>
    <div class="dp-foot"><button class="pill pill-accent press" id="dpToday">${forDash?{week:'Diese Woche',month:'Dieser Monat',year:'Dieses Jahr'}[per]:'Heute'}</button>${forDash?'':'<button class="pill press" style="background:var(--surface-2)" id="dpLast">Letzter Eintrag</button>'}</div>`);
  DP_OPEN=true; renderDp(0);
  $('#dpTitle').onclick=()=>{ dpMode=dpMode==='days'?'months':dpMode==='months'?'years':'days'; renderDp(0,true); };
  $('#dpPrev').onclick=()=>dpShift(-1); $('#dpNext').onclick=()=>dpShift(1);
  $('#dpToday').onclick=()=>forDash?pickPeriod(TODAY):pickDay(TODAY);
  if(!forDash) $('#dpLast').onclick=()=>{ const last=[...DATA.keys()].filter(d=>d<=TODAY).sort().pop(); if(last) pickDay(last); };
  $('#dpBody').onclick=e=>{ const b=e.target.closest('[data-pick]'); if(!b) return; const [kind,val]=b.dataset.pick.split(':');
    if(kind==='d') return forDash?pickPeriod(val):pickDay(val);
    if(kind==='m'){ dpM=+val; if(forDash&&per==='month') return pickPeriod(`${dpY}-${pad(dpM+1)}-01`); dpMode='days'; renderDp(0,true); }
    if(kind==='y'){ dpY=+val; if(forDash&&per==='year') return pickPeriod(`${dpY}-01-01`); dpMode='months'; renderDp(0,true); } };
  let x0=null; const st=$('#dpStage');
  st.onpointerdown=e=>{ x0=e.clientX; }; st.onpointerup=e=>{ if(x0===null) return; const dx=e.clientX-x0; x0=null; if(Math.abs(dx)>40) dpShift(dx<0?1:-1); };
}
function pickDay(d){ closeSheet(); setTimeout(()=>{ if(view!=='entry') go('entry'); setDay(d); }, 120); }
function pickPeriod(d){ const dir=d>anchor?1:d<anchor?-1:0; closeSheet(); anchor=d>TODAY?TODAY:d; setTimeout(()=>renderDash(true,dir),120); }
function dpShift(n){
  if(dpMode==='days'){ dpM+=n; if(dpM<0){dpM=11;dpY--;} if(dpM>11){dpM=0;dpY++;} }
  else if(dpMode==='months') dpY+=n; else dpY+=12*n;
  renderDp(n);
}
function renderDp(dir=0, zoom=false){
  const body=$('#dpBody');
  const draw=()=>{
    $('#dpTitle').classList.toggle('up',dpMode!=='days');
    if(dpMode==='days'){
      $('#dpLabel').textContent=`${MON[dpM]} ${dpY}`;
      const first=new Date(dpY,dpM,1), off=(first.getDay()+6)%7, n=new Date(dpY,dpM+1,0).getDate(); let h='';
      ['Mo','Di','Mi','Do','Fr','Sa','So'].forEach(w=>h+=`<div class="dp-wd">${w}</div>`);
      for(let i=0;i<off;i++) h+='<div class="dp-d out"></div>';
      for(let i=1;i<=n;i++){ const d=`${dpY}-${pad(dpM+1)}-${pad(i)}`, e=DATA.get(d);
        const R=DP_DASH&&per==='week'?range():null, inWk=R&&d>=R.from&&d<=R.to, wd=(parse(d).getDay()+6)%7;
        h+=`<button class="dp-d${!DP_DASH&&d===cur?' sel':''}${inWk?' wk':''}${inWk&&(wd===0||i===1)?' ws':''}${inWk&&(wd===6||i===n)?' we':''}${d===TODAY?' today':''}${d>TODAY?' fut':''}" data-pick="d:${d}">${i}<i style="background:${e?MOOD_COL[moodKey(e.mood)]:'transparent'}"></i></button>`; }
      body.innerHTML=`<div class="dp-grid">${h}</div>`;
    } else if(dpMode==='months'){
      $('#dpLabel').textContent=String(dpY);
      body.innerHTML=`<div class="dp-cells">${MON3.map((m,i)=>{ const pre=`${dpY}-${pad(i+1)}`; let c=0; DATA.forEach((_,d)=>{ if(d.startsWith(pre)) c++; });
        const days=new Date(dpY,i+1,0).getDate(), fut=`${pre}-01`>TODAY, sel=dpY===parse(dpRef()).getFullYear()&&i===parse(dpRef()).getMonth();
        return `<button class="dp-c${sel?' sel':''}${fut?' fut':''}" data-pick="m:${i}">${m}<span class="bar"><b style="width:${c/days*100}%"></b></span></button>`; }).join('')}</div>`;
    } else {
      const start=Math.floor(dpY/12)*12, ty=+TODAY.slice(0,4);
      $('#dpLabel').textContent=`${start}–${start+11}`;
      body.innerHTML=`<div class="dp-cells">${Array.from({length:12},(_,i)=>{ const y=start+i; let c=0; DATA.forEach((_,d)=>{ if(d.startsWith(y+'-')) c++; });
        return `<button class="dp-c${y===parse(dpRef()).getFullYear()?' sel':''}${y>ty?' fut':''}" data-pick="y:${y}">${y}<span class="bar"><b style="width:${Math.min(100,c/365*100)}%"></b></span></button>`; }).join('')}</div>`;
    }
  };
  if(zoom&&!REDUCED&&body.animate){ draw(); body.animate([{opacity:0,transform:'scale(.94)'},{opacity:1,transform:'none'}],{duration:420,easing:SPRING}); }
  else slideSwap(body, dir, draw, 40);
}

/* ═══════════════════════════════════════════════════════════
   DASHBOARD
   ═══════════════════════════════════════════════════════════ */
let per='month', anchor=TODAY, meterKind='sport', dashDirty=true;
function kw(d){ const t=new Date(Date.UTC(d.getFullYear(),d.getMonth(),d.getDate())); const n=t.getUTCDay()||7; t.setUTCDate(t.getUTCDate()+4-n); const y=new Date(Date.UTC(t.getUTCFullYear(),0,1)); return Math.ceil(((t-y)/864e5+1)/7); }
function range(){
  const d=parse(anchor);
  if(per==='week'){ const s=addDays(anchor,-((d.getDay()+6)%7)), e=addDays(s,6), S=parse(s), E=parse(e);
    const span=S.getMonth()===E.getMonth()?`${S.getDate()}.–${E.getDate()}. ${MON3[E.getMonth()]}`:`${S.getDate()}. ${MON3[S.getMonth()]} – ${E.getDate()}. ${MON3[E.getMonth()]}`;
    return {from:s,to:e,label:`KW ${kw(S)} · ${span}`}; }
  if(per==='month') return {from:iso(new Date(d.getFullYear(),d.getMonth(),1)),to:iso(new Date(d.getFullYear(),d.getMonth()+1,0)),label:`${MON[d.getMonth()]} ${d.getFullYear()}`};
  return {from:`${d.getFullYear()}-01-01`,to:`${d.getFullYear()}-12-31`,label:String(d.getFullYear())};
}
function entriesIn(from,to){ const out=[]; for(let d=from; d<=to&&d<=TODAY; d=addDays(d,1)){ const e=DATA.get(d); if(e) out.push(e); } return out; }
const sum=(E,k)=>E.reduce((s,e)=>s+(+e[k]||0),0);
const daysElapsed=(from,to)=>Math.max(1,Math.round((parse(to<TODAY?to:TODAY)-parse(from))/864e5)+1);
function shiftPeriod(n){ const d=parse(anchor);
  if(per==='week') d.setDate(d.getDate()+7*n); if(per==='month') d.setMonth(d.getMonth()+n,1); if(per==='year') d.setFullYear(d.getFullYear()+n,0,1);
  anchor=iso(d); renderDash(true,n); }
$('#prevPer').onclick=()=>shiftPeriod(-1); $('#nextPer').onclick=()=>shiftPeriod(1);
(function periodGestures(){   // Tippen = Picker, Wischen = Zeitraum wechseln
  const el=$('#periodBtn'), t=$('#periodLabel'); let x0=null,y0=0,dx=0,lock=null;
  el.addEventListener('pointerdown',e=>{ x0=e.clientX; y0=e.clientY; dx=0; lock=null; });
  el.addEventListener('pointermove',e=>{ if(x0===null) return; dx=e.clientX-x0; const dy=e.clientY-y0;
    if(lock===null&&Math.hypot(dx,dy)>6) lock=Math.abs(dx)>Math.abs(dy)?'x':'y';
    if(lock==='x'){ el.setPointerCapture(e.pointerId); t.style.transition='none'; t.style.transform=`translateX(${dx*.6}px)`; t.style.opacity=1-Math.min(.6,Math.abs(dx)/300); } });
  el.addEventListener('pointerup',()=>{ if(x0===null) return; x0=null; t.style.transition='transform .5s var(--spring), opacity .3s'; t.style.transform=''; t.style.opacity='';
    if(lock==='x'&&Math.abs(dx)>50){ const n=dx<0?1:-1; if(!(n>0&&$('#nextPer').disabled)) setTimeout(()=>shiftPeriod(n)); }
    else if(lock===null) openDatePicker(true); });
  el.addEventListener('pointercancel',()=>{ x0=null; t.style.transform=''; t.style.opacity=''; });
  el.addEventListener('keydown',e=>{ if(e.key==='Enter'||e.key===' '){ e.preventDefault(); openDatePicker(true); } });
})();
const setPerSeg=segInit($('#perSeg'),per,v=>{ per=v; renderDash(true); });   // Zeitraum bleibt, nur die Auflösung wechselt
segInit($('#meterSeg'),meterKind,v=>{ meterKind=v; renderMeter(); });

let COLS=[];
function renderDash(regrow=false,dir=0){
  dashDirty=false;
  const R=range(), E=entriesIn(R.from,R.to), n=daysElapsed(R.from,R.to);
  slideSwap($('#periodLabel'),dir,()=>$('#periodLabel').textContent=R.label); fnavPeriod(dir);
  $('#nextPer').style.opacity=R.to>=TODAY?.35:1; $('#nextPer').disabled=R.to>=TODAY;
  const S=[['coffee','Kaffee','var(--c-coffee)'],['apples','Äpfel','var(--c-apple)'],['bananas','Bananen','var(--c-banana)'],['cycling_km','Velo km','var(--c-km)']];
  if(!$('#stats').children.length) $('#stats').innerHTML=S.map(([k,l,c])=>`<div class="stat"><div class="cl"><i class="sw" style="background:${c}"></i>${l}</div><div class="big" id="st-${k}"><span class="roll"></span></div><div class="avg" id="av-${k}"></div></div>`).join('');
  S.forEach(([k])=>{ const t=sum(E,k); roll($('#st-'+k),fmt0(t)); $('#av-'+k).textContent=`⌀ ${fmt1(t/n)} pro Tag`; });

  if(per==='year'){
    const y=R.from.slice(0,4);
    COLS=MON3.map((m,i)=>{ const f=`${y}-${pad(i+1)}-01`, Es=entriesIn(f,iso(new Date(+y,i+1,0)));
      return {key:f,label:m,title:`${MON[i]} ${y}`,coffee:sum(Es,'coffee'),apples:sum(Es,'apples'),bananas:sum(Es,'bananas'),mood:Es.length?sum(Es,'mood')/Es.length:null,future:f>TODAY}; });
    $('#chartSub').textContent='Summe pro Monat · antippen öffnet den Monat';
  } else {
    COLS=[]; for(let d=R.from; d<=R.to; d=addDays(d,1)){ const e=DATA.get(d), dt=parse(d);
      COLS.push({key:d,label:per==='week'?WD2[dt.getDay()]:String(dt.getDate()),title:`${WD[dt.getDay()]}, ${dt.getDate()}. ${MON[dt.getMonth()]}`,
        coffee:e?.coffee||0,apples:e?.apples||0,bananas:e?.bananas||0,mood:e?e.mood:null,future:d>TODAY}); }
    $('#chartSub').textContent='pro Tag · antippen öffnet den Tag';
  }
  const max=Math.max(1,...COLS.map(c=>c.coffee+c.apples+c.bananas));
  $('#chartCols').style.setProperty('--gap',(COLS.length>20?1.5:COLS.length>10?3:6)+'px');
  $('#chartCols').innerHTML=COLS.map((c,i)=>`<div class="ccol" style="opacity:${c.future?.25:1}">
      <div class="up">${[['coffee','coffee'],['apples','apple'],['bananas','banana']].filter(([k])=>c[k]>0).map(([k,v])=>`<div class="seg-b" data-h="${c[k]/max*100}" style="background:var(--c-${v});transition-delay:${i*14}ms"></div>`).join('')}</div>
      <div class="dn">${c.mood?`<div class="seg-b" data-h="${Math.abs(c.mood)/2*100}" style="background:${c.mood>0?'var(--good)':'var(--bad)'};opacity:.85;transition-delay:${i*14+120}ms"></div>`:''}</div></div>`).join('');
  const f=COLS[0], l=COLS[COLS.length-1];
  $('#chartFoot').innerHTML=`<span>${per==='year'?f.label:f.title.split(', ')[1]}</span><span>${per==='year'?l.label:l.title.split(', ')[1]}</span>`;
  if(view==='dash') requestAnimationFrame(()=>requestAnimationFrame(growBars));

  METER_E=E; renderMeter();
  const avg=E.length?sum(E,'mood')/E.length:0;
  roll($('#moodAvg'),(avg>0?'+':avg<0?'−':'')+fmt1(Math.abs(avg))); $('#moodAvg').style.color=MOOD_COL[moodKey(avg)];
  $('#moodSub').textContent=`⌀ über ${E.length} Einträge`;
  const fd=[]; for(let d=R.from; d<=R.to; d=addDays(d,1)) fd.push(d);
  $('#field').innerHTML=fd.map(d=>{ const e=DATA.get(d), fut=d>TODAY;
    return `<i class="${e?'':'empty'}" data-d="${e?d:''}" title="${parse(d).getDate()}. ${MON3[parse(d).getMonth()]}${e?' · '+(e.mood>0?'+':'')+e.mood:''}" style="background:${e?MOOD_COL[moodKey(e.mood)]:'var(--surface-3)'};opacity:${fut?.12:e?1:.35}"></i>`; }).join('');
}
/* Höhe relativ zur Fläche ohne die zwei Abstände (2 × 2 px): gleicher Wert = gleiche Höhe, unabhängig von den anderen Segmenten */
function growBars(){ document.querySelectorAll('#chartCols .seg-b').forEach(b=>b.style.height=b.closest('.up')?`calc((100% - 4px) * ${b.dataset.h/100})`:b.dataset.h+'%'); }

(function scrub(){
  const ch=$('#chart'), ring=$('#ring'), tip=$('#tip'); let act=-1, downX=null, moved=false;
  const idxAt=x=>{ const r=ch.getBoundingClientRect(); return Math.max(0,Math.min(COLS.length-1,Math.floor((x-r.left)/r.width*COLS.length))); };
  function show(i){
    if(i===act) return; act=i; const c=COLS[i]; if(!c) return; const w=ch.clientWidth/COLS.length, rw=Math.max(14,w);
    ring.style.width=rw+'px'; ring.style.transform=`translateX(${i*w+w/2-rw/2}px)`;
    ch.querySelectorAll('.ccol').forEach((el,j)=>el.classList.toggle('act',j===i));
    const row=(col,l,v)=>`<div class="r"><i class="sw" style="background:${col}"></i>${l}<span>${v}</span></div>`;
    tip.innerHTML=`<b>${c.title}</b>${row('var(--c-coffee)','Kaffee',c.coffee)}${row('var(--c-apple)','Äpfel',c.apples)}${row('var(--c-banana)','Bananen',c.bananas)}${row(c.mood===null?'#555':MOOD_COL[moodKey(c.mood)],'Stimmung',c.mood===null?'–':(c.mood>0?'+':'')+fmt1(c.mood))}`;
    const tw=tip.offsetWidth, x=Math.max(tw/2-4,Math.min(ch.clientWidth-tw/2+4,i*w+w/2));
    if(!ch.classList.contains('dim')){ tip.style.transition='opacity .2s'; tip.style.left=x+'px'; tip.offsetWidth; tip.style.transition=''; }
    tip.style.left=x+'px'; ch.classList.add('dim');
  }
  const hide=()=>{ act=-1; ch.classList.remove('dim'); ch.querySelectorAll('.ccol.act').forEach(el=>el.classList.remove('act')); };
  ch.addEventListener('pointerdown',e=>{ downX=e.clientX; moved=false; show(idxAt(e.clientX)); });
  ch.addEventListener('pointermove',e=>{ if(downX!==null&&Math.abs(e.clientX-downX)>8) moved=true; if(e.pointerType==='mouse'||downX!==null) show(idxAt(e.clientX)); });
  ch.addEventListener('pointerleave',e=>{ if(e.pointerType==='mouse') hide(); });
  ch.addEventListener('pointercancel',()=>{ downX=null; hide(); });
  ch.addEventListener('pointerup',e=>{ const c=COLS[idxAt(e.clientX)], tap=!moved; downX=null;
    if(e.pointerType!=='mouse') setTimeout(hide,900);
    if(!tap||!c||c.future) return;

/* ═══════════════════════════════════════════════════════════
   SUCHE – eigene Seite. Freitext, Filter-Chips (UND), Präfixe wie bisher,
   Vorschläge passen sich den aktuellen Treffern an.
   ═══════════════════════════════════════════════════════════ */
const PREFIX={tag:['tags','Tag'],ort:['locations','Ort'],land:['countries','Land'],kaffee:['coffeeLocations','Kaffee'],sport:['sport','Sport'],place:['places','Spez. Ort'],person:['people','Person']};
const ALIAS={tags:'tag',location:'ort',country:'land',kaffeeort:'kaffee',ort2:'place',people:'person'};
let filters=[], TERMS=[], searchDirty=true, sortNew=true, shown=80, HITS=[];
const parsePrefix=q=>{ const m=q.match(/^([a-zA-Z0-9]+)[=:]\s*(.*)$/); if(!m) return null; const p=ALIAS[m[1].toLowerCase()]||m[1].toLowerCase(); return PREFIX[p]?{p,v:m[2].trim()}:null; };
const pLabel=p=>PREFIX[p]?.[1]||(p==='jahr'?'Jahr':p==='monat'?'Monat':p);
function countTerms(entries){
  const c=new Map(), add=(p,v)=>{ const k=p+'\u0000'+v; c.set(k,(c.get(k)||0)+1); };
  entries.forEach(e=>{ Object.entries(PREFIX).forEach(([p,[f]])=>new Set((e[f]||[]).map(v=>oRes(f,v))).forEach(v=>add(p,v))); add('jahr',e.date.slice(0,4)); add('monat',MON[+e.date.slice(5,7)-1]); });
  return [...c].map(([k,n])=>{ const [p,v]=k.split('\u0000'); return {p,v,n}; }).sort((a,b)=>b.n-a.n);
}
function openSearch(){ go('search', ()=>$('#q').focus({preventScroll:true})); }
$('#q').addEventListener('input',()=>{ shown=80; renderSearch(); });
$('#q').addEventListener('keydown',e=>{
  if(e.key==='Enter'){ const pp=parsePrefix(e.target.value); if(pp&&pp.v) addFilter(pp.p,pp.v); else e.target.blur(); }
  if(e.key==='Backspace'&&!e.target.value&&filters.length){ filters.pop(); renderSearch(); }
});
$('#qClear').onclick=e=>{ e.preventDefault(); $('#q').value=''; filters=[]; renderSearch(); $('#q').focus(); };
function addFilter(p,v){ if(!filters.some(f=>f.p===p&&f.v.toLowerCase()===v.toLowerCase())) filters.push({p,v}); $('#q').value=''; shown=80; renderSearch(); if(!TOUCH) $('#q').focus({preventScroll:true}); scrollTo({top:0,behavior:'smooth'}); }
$('#sugg').addEventListener('pointerdown',e=>{ if(document.activeElement===$('#q')) e.preventDefault(); }); // Tastatur bleibt offen
$('#sugg').addEventListener('click',e=>{ const b=e.target.closest('.sg'); if(b) addFilter(b.dataset.p,b.dataset.v); });
$('#filters').addEventListener('click',e=>{ const b=e.target.closest('[data-rm]'); if(b){ filters.splice(+b.dataset.rm,1); renderSearch(); } });
$('#hits').addEventListener('click',e=>{ const b=e.target.closest('.hit'); if(b) openDay(b.dataset.d); if(e.target.closest('.more')){ shown+=80; drawHits(); } });
segInit($('#sortSeg'),'new',v=>{ sortNew=v==='new'; drawHits(); });
let lastY=0;
addEventListener('scroll',()=>{ if(view!=='search') return;
  $('#sBar').classList.toggle('stuck',scrollY>4);
  if(TOUCH&&document.activeElement===$('#q')&&Math.abs(scrollY-lastY)>12) $('#q').blur(); // beim Scrollen Tastatur weg
  lastY=scrollY; },{passive:true});

function matchFilter(e,f){
  if(f.p==='jahr') return e.date.startsWith(f.v+'-');
  if(f.p==='monat') return +e.date.slice(5,7)===MON.indexOf(f.v)+1;
  const k=PREFIX[f.p][0], fv=oRes(k,f.v).toLowerCase();
  return (e[k]||[]).some(x=>oRes(k,x).toLowerCase()===fv);
}
const ago=t=>{ if(!t) return ''; const m=Math.round((Date.now()-new Date(t))/6e4); return m<2?'gerade eben':m<60?`vor ${m} Min.`:m<1440?`vor ${Math.round(m/60)} Std.`:`vor ${Math.round(m/1440)} Tagen`; };
let HQ='', HPP=null;
function renderSearch(){
  searchDirty=false;
  const q=$('#q').value.trim(), ql=q.toLowerCase(), pp=parsePrefix(q);
  $('#qClear').hidden=!q&&!filters.length;
  $('#filters').innerHTML=filters.map((f,i)=>`<span class="fchip"><span class="pt">${pLabel(f.p)}</span>${esc(f.v)}<button data-rm="${i}" aria-label="Filter entfernen">✕</button></span>`).join('');
  $('#indexInfo').innerHTML=`<span class="dot" style="background:${SOURCE==='demo'?'var(--good)':'var(--c-km)'}"></span>${fmt0(DATA.size)} Einträge indexiert · ${SOURCE==='demo'?'Demo-Daten':'Stand '+ago(INDEX_BUILT)}`;

  // Treffer
  const all=[...DATA.values()], base=all.filter(e=>filters.every(f=>matchFilter(e,f)));
  HITS=base.filter(e=>{
    if(pp&&pp.v) return (e[PREFIX[pp.p][0]]||[]).some(v=>v.toLowerCase().includes(pp.v.toLowerCase()));
    if(!pp&&q.length>=2) return [plain(e.text),...LIST_KEYS.flatMap(k=>e[k]||[])].join(' ').toLowerCase().includes(ql);
    return true;
  });
  HQ=pp?pp.v:(q.length>=2?q:''); HPP=pp;

  // Vorschläge: beim Tippen passende Begriffe, sonst Begriffe aus den aktuellen Treffern
  let sg=[];
  const taken=t=>filters.some(f=>f.p===t.p&&f.v===t.v);
  if(pp) sg=countTerms(all).filter(t=>t.p===pp.p&&(!pp.v||t.v.toLowerCase().includes(pp.v.toLowerCase())));
  else if(ql) sg=countTerms(all).filter(t=>t.v.toLowerCase().includes(ql));
  else if(filters.length){
    const T=countTerms(HITS).filter(t=>!taken(t)&&t.n<HITS.length);   // nur was weiter eingrenzt
    const hasY=filters.some(f=>f.p==='jahr'), hasM=filters.some(f=>f.p==='monat');
    const months=hasY&&!hasM?T.filter(t=>t.p==='monat').sort((a,b)=>MON.indexOf(a.v)-MON.indexOf(b.v)).map(t=>({...t,ctx:1})):[];
    const years=hasM&&!hasY?T.filter(t=>t.p==='jahr').sort((a,b)=>b.v-a.v).map(t=>({...t,ctx:1})):[];
    sg=[...months,...years,...T.filter(t=>t.p!=='jahr'&&t.p!=='monat').slice(0,16)];
  } else {
    const T=countTerms(all); sg=[...T.filter(t=>t.p==='jahr').sort((a,b)=>b.v-a.v), ...T.filter(t=>t.p==='tag'||t.p==='person').slice(0,12)];
  }
  sg=sg.filter(t=>!taken(t)).slice(0,28);
  const hlS=s=>{ const h=pp?pp.v:q; return h?esc(s).replace(new RegExp(reEsc(esc(h)),'ig'),m=>`<mark>${m}</mark>`):esc(s); };
  $('#sugg').innerHTML=sg.map((t,i)=>`<button class="sg press${t.ctx?' ctx':''}" style="animation-delay:${Math.min(i,12)*18}ms" data-p="${t.p}" data-v="${esc(t.v)}"><span class="pt">${pLabel(t.p)}</span>${hlS(t.v)}${t.n?`<span class="c">${t.n}</span>`:''}</button>`).join('');
  drawHits();
}
function drawHits(){
  const q=$('#q').value.trim(), idle=!filters.length&&q.length<2&&!(HPP&&HPP.v);
  $('#sMeta').style.display=idle?'none':'';
  if(idle){ $('#hits').innerHTML=`<div class="syntax">Text eingeben oder Vorschlag antippen. Filter lassen sich kombinieren, ein Jahr zeigt danach seine Monate.<br>
      <code>tag:</code> <code>ort:</code> <code>land:</code> <code>kaffee:</code> <code>sport:</code> <code>person:</code> <code>place:</code></div>`; return; }
  $('#qCount').textContent=HITS.length?`${fmt0(HITS.length)} Treffer`:'';
  const list=[...HITS].sort((a,b)=>sortNew?b.date.localeCompare(a.date):a.date.localeCompare(b.date));
  const hlH=html=>HQ?html.replace(new RegExp(`(<[^>]+>)|(${reEsc(esc(HQ))})`,'ig'),(m,tag,hit)=>tag||`<mark>${hit}</mark>`):html;
  const excerpt=t=>{ if(!t) return ''; const P=plain(t); if(!HQ||HPP) return t.length>220?renderRich(t.slice(0,220))+' …':renderRich(t);
    const i=P.toLowerCase().indexOf(HQ.toLowerCase()); if(i<0) return renderRich(t.slice(0,220));
    const a=Math.max(0,i-70), part=P.slice(a,i+150); return (a?'… ':'')+esc(part)+(i+150<P.length?' …':''); };
  const dl=s=>{ const x=parse(s); return `${WD2[x.getDay()]} ${x.getDate()}. ${MON[x.getMonth()]} ${x.getFullYear()}`; };
  $('#hits').innerHTML=list.length?list.slice(0,shown).map((e,i)=>{
    const meta=[...e.locations,...e.people,...e.tags.map(t=>'#'+t),...e.sport].join(' · ');
    return `<button class="hit" data-d="${e.date}" style="animation-delay:${Math.min(i,10)*25}ms"><div class="hd">${dl(e.date)}</div>${e.text?`<div class="ht">${hlH(excerpt(e.text))}</div>`:''}<div class="hm">${hlH(esc(meta))}</div></button>`; }).join('')
    +(list.length>shown?`<button class="more press">${fmt0(list.length-shown)} weitere anzeigen</button>`:'')
    :'<p class="muted">Keine Treffer.</p>';
}

/* ═══════════════════════════════════════════════════════════
   SYNCHRONISIEREN – veröffentlicht Jahres-JSON + stats.md
   Format 1:1 wie der bisherige Export (geprüft gegen data/ im öffentlichen Repo).
   Ablauf: Prüfen (nur lesen, Vergleich mit dem Repo) → Veröffentlichen (nur geänderte Dateien).
   ═══════════════════════════════════════════════════════════ */
const PUB_DIR='data', PUB_BRANCH='main';
const pubRepo=()=>ghConfig()?.publicRepo||'wwwlhlm/wwwlhlm.github.io';
let SY={years:[],a:0,b:0,plan:null,busy:false};
const b64u=s=>btoa(unescape(encodeURIComponent(s))), u64=s=>decodeURIComponent(escape(atob(s.replace(/\n/g,''))));
function exportSource(){
  if(SOURCE==='github'&&RAW_INDEX) return RAW_INDEX;
  return [...DATA.values()].map(e=>({...e,weekday_index:parse(e.date).getDay()}));
}
function exportEntries(year,src=exportSource()){
  return src.filter(e=>e.date.startsWith(year)&&e.date<=TODAY&&e.text!==undefined&&e.text!==null).sort((a,b)=>a.date.localeCompare(b.date)).map(e=>{
    const o={date:e.date,apples:e.apples||0,bananas:e.bananas||0,coffee:e.coffee||0,mood:e.mood||0,cycling_km:e.cycling_km||0,text:e.text};
    if(e.weekday_index!==undefined) o.weekday_index=e.weekday_index; return o; });
}
const exportJson=(year,src)=>JSON.stringify({entries:exportEntries(year,src)},null,2);
function statsContent(first,last,src=exportSource()){
  let d=0,a=0,b=0,c=0; for(let y=+first;y<=+last;y++) exportEntries(String(y),src).forEach(e=>{d++;a+=e.apples;b+=e.bananas;c+=e.coffee;});
  return ['---',`year_first: ${first}`,`year_last: ${last}`,`total_days: ${d}`,`total_apples: ${Math.round(a)}`,`total_bananas: ${Math.round(b)}`,`total_coffee: ${Math.round(c)}`,'---',''].join('\n');
}
async function pubGet(file){
  const c=ghConfig(); const r=await fetch(`https://api.github.com/repos/${pubRepo()}/contents/${PUB_DIR}/${file}?ref=${PUB_BRANCH}&_=${Date.now()}`,{headers:{Authorization:`token ${c.token}`,Accept:'application/vnd.github.v3+json'},cache:'no-store'});
  if(r.status===404) return null; if(!r.ok) throw new Error(`GitHub ${r.status}`); const j=await r.json(); return {sha:j.sha,text:u64(j.content)};
}
async function pubPut(file,content,sha){
  const c=ghConfig(); const body={message:`Sync ${file}`,content:b64u(content),branch:PUB_BRANCH}; if(sha) body.sha=sha;
  const r=await fetch(`https://api.github.com/repos/${pubRepo()}/contents/${PUB_DIR}/${file}`,{method:'PUT',headers:{Authorization:`token ${c.token}`,Accept:'application/vnd.github.v3+json','Content-Type':'application/json'},body:JSON.stringify(body)});
  if(!r.ok){ let m=r.status; try{ m=(await r.json()).message||m; }catch{} throw new Error(m); }
}

async function syncCheck(){

    if(!live) slog('Probelauf mit Demo-Daten, ohne Verbindung zum Repo.');
    // stats.md umfasst alle veröffentlichten Jahre, nicht nur die Auswahl
    let first=sel[0], last=sel[sel.length-1], oldStats=null;
    if(live){ oldStats=await pubGet('stats.md'); const m1=oldStats?.text.match(/year_first:\s*(\d{4})/), m2=oldStats?.text.match(/year_last:\s*(\d{4})/);
      if(m1&&+m1[1]<+first) first=m1[1]; if(m2&&+m2[1]>+last) last=m2[1]; }
    for(let i=0;i<sel.length;i++){
      const y=sel[i], f=y+'.json', json=exportJson(y,src); sbar(i/(sel.length+1));
      if(!live){ files.push({file:f,content:json,put:true,cls:'new',label:'würde geschrieben'}); continue; }
      const cur=await pubGet(f);
      if(!cur){ files.push({file:f,content:json,put:true,cls:'new',label:'neu'}); slog(`${f}: noch nicht veröffentlicht`); }
      else if(cur.text===json){ files.push({file:f,put:false,cls:'ok',label:'aktuell'}); }
      else { let n=0; try{ const A=Object.fromEntries(JSON.parse(cur.text).entries.map(e=>[e.date,JSON.stringify(e)])); JSON.parse(json).entries.forEach(e=>{ if(A[e.date]!==JSON.stringify(e)) n++; }); }catch{}
        files.push({file:f,content:json,sha:cur.sha,put:true,cls:'chg',label:n?`${n} ${n>1?'Tage':'Tag'} geändert`:'geändert'}); slog(`${f}: ${n||'einige'} ${n===1?'Tag':'Tage'} geändert`); }
    }
    const stats=statsContent(first,last,src);
    if(!live) files.push({file:'stats.md',content:stats,put:true,cls:'new',label:'würde geschrieben'});
    else if(oldStats&&oldStats.text===stats) files.push({file:'stats.md',put:false,cls:'ok',label:'aktuell'});
    else { files.push({file:'stats.md',content:stats,sha:oldStats?.sha,put:true,cls:oldStats?'chg':'new',label:oldStats?'geändert':'neu'}); slog(`stats.md: Jahre ${first}–${last}`); }
    SY.plan={files}; const todo=files.filter(f=>f.put).length;
    slog(live?(todo?`${todo} ${todo>1?'Dateien müssen':'Datei muss'} aktualisiert werden.`:'Alles ist aktuell.'):'Probelauf fertig.', 'ok');
  }catch(e){ slog('Fehler: '+e.message,'err'); }
  SY.busy=false; sbar(null); syncRender();
}
async function syncRun(){
  if(SOURCE!=='github'||!SY.plan) return;
  const todo=SY.plan.files.filter(f=>f.put); SY.busy=true; syncRender(); let ok=0;
  for(let i=0;i<todo.length;i++){ const f=todo[i]; sbar(i/todo.length);
    try{ const cur=await pubGet(f.file); await pubPut(f.file,f.content,cur?.sha); f.put=false; f.cls='ok'; f.label='veröffentlicht'; ok++; slog(`${f.file} → GitHub ✓`,'ok'); }
    catch(e){ f.cls='err'; f.label='Fehler'; slog(`${f.file}: ${e.message}`,'err'); }
    syncRender(); }
  sbar(1); setTimeout(()=>sbar(null),600); SY.busy=false; syncRender();
  island(ok===todo.length?`${ok} ${ok>1?'Dateien':'Datei'} veröffentlicht`:'Teilweise fehlgeschlagen', ok===todo.length?'var(--good)':'var(--bad)');
}

/* Zwei-Griff-Regler: Griffe folgen dem Finger, rasten federnd auf Jahren ein */
function rangeSlider(el,n,a,b,onChange){
  el.innerHTML='<div class="tr"><i class="fill"></i></div><span class="kn" tabindex="0" aria-label="Von"></span><span class="kn" tabindex="0" aria-label="Bis"></span>';
  const tr=el.querySelector('.tr'), fill=el.querySelector('.fill'), [ka,kb]=el.querySelectorAll('.kn'); let drag=null;
  const P=i=>n>1?i/(n-1):.5, pos=(k,p)=>k.style.left=`calc(13px + ${p} * (100% - 26px))`;
  const draw=(pa=P(a),pb=P(b))=>{ pos(ka,pa); pos(kb,pb); fill.style.left=Math.min(pa,pb)*100+'%'; fill.style.right=(1-Math.max(pa,pb))*100+'%'; };
  const pAt=x=>{ const r=tr.getBoundingClientRect(); return Math.max(0,Math.min(1,(x-r.left)/r.width)); };
  const move=e=>{ if(!drag) return; let p=pAt(e.clientX); const i=Math.round(p*(n-1));
    if(drag==='a'){ p=Math.min(p,P(b)); const na=Math.min(i,b); if(na!==a){ a=na; onChange(a,b); navigator.vibrate?.(4); } draw(p,P(b)); }
    else { p=Math.max(p,P(a)); const nb=Math.max(i,a); if(nb!==b){ b=nb; onChange(a,b); navigator.vibrate?.(4); } draw(P(a),p); } };
  el.addEventListener('pointerdown',e=>{ const p=pAt(e.clientX); drag=Math.abs(p-P(a))<Math.abs(p-P(b))||(a===b&&p<P(a))?'a':'b';
    el.setPointerCapture(e.pointerId); el.classList.add('drag'); (drag==='a'?ka:kb).classList.add('act'); move(e); });
  el.addEventListener('pointermove',move);
  const up=()=>{ if(!drag) return; drag=null; el.classList.remove('drag'); ka.classList.remove('act'); kb.classList.remove('act'); draw(); };
  el.addEventListener('pointerup',up); el.addEventListener('pointercancel',up);
  [ka,kb].forEach((k,ki)=>k.addEventListener('keydown',e=>{ const d=e.key==='ArrowRight'||e.key==='ArrowUp'?1:e.key==='ArrowLeft'||e.key==='ArrowDown'?-1:0; if(!d) return; e.preventDefault();
    if(ki===0) a=Math.max(0,Math.min(b,a+d)); else b=Math.min(n-1,Math.max(a,b+d)); draw(); onChange(a,b); }));
  draw();
}

/* ─── Doppelte erkennen ───────────────────────────────── */
function oLev1(a,b){ if(a===b||Math.abs(a.length-b.length)>1) return false; let i=0,j=0,d=0;
  while(i<a.length&&j<b.length){ if(a[i]===b[j]){i++;j++;continue;} if(++d>1) return false; if(a.length>b.length) i++; else if(b.length>a.length) j++; else {i++;j++;} }
  return d+(a.length-i)+(b.length-j)===1; }
function oDuplicates(list=oAll()){
  const out=[], ign=new Set(OREG.ignoriert.map(p=>[...p].sort().join('|')));
  const L=list.map(p=>({p,n:oNorm(p.name)}));
  for(let i=0;i<L.length;i++) for(let j=i+1;j<L.length;j++){
    const a=L[i].p.name, b=L[j].p.name, na=L[i].n, nb=L[j].n;
    if(/_div$/.test(a)&&/_div$/.test(b)) continue;
    if(ign.has([a,b].sort().join('|'))) continue;
    let why=null;
    if(na===nb) why=a.toLowerCase()===b.toLowerCase()?'Gross-/Kleinschreibung':/[̀-ͯ]/.test((a+b).normalize('NFD'))?'Akzent':'Unterstrich';
    else if(Math.min(na.length,nb.length)>=5&&oLev1(na,nb)) why='ein Buchstabe anders';
    if(why) out.push({a:L[i].p,b:L[j].p,why});
  }
  return out;
}

  $('#oErr').innerHTML=OREG_STATE==='error'?`<div class="card o-err">orte.json konnte nicht geladen werden${OREG_ERR?': '+esc(OREG_ERR):''}. Bearbeiten ist gesperrt, damit nichts überschrieben wird.<button class="pill pill-accent press" id="oRetry">Erneut laden</button></div>`
    :OREG_STATE==='demo'?`<p class="muted" style="padding:0 4px">Demo-Daten: Änderungen bleiben nur bis zum Neuladen.</p>`:'';
  $('#oRetry')?.addEventListener('click',()=>oLoadReg());
  $('#oSum').innerHTML=`<b>${fmt0(all.length)}</b> Orte · ${fmt0(cnt(p=>oKoord(p.r)))} mit Koordinaten · ${fmt0(cnt(p=>!p.r.typ))} ohne Typ`+(list.length!==all.length?` · <b>${fmt0(list.length)}</b> angezeigt`:'');
  const d=OF.q||OF.flag||OF.typ||OF.src?[]:oDuplicates(all);
  $('#dupWrap').innerHTML=d.length?`<div class="card dup-card"><div class="card-head"><span class="card-title">Mögliche Doppelte</span><span class="card-sub">${d.length}</span></div>
    ${d.map((x,i)=>{ const [hi,lo]=x.a.total>=x.b.total?[x.a,x.b]:[x.b,x.a];
      return `<div class="dup"><div class="pair">${esc(lo.name)} <span class="c">${lo.total}</span> &nbsp;·&nbsp; ${esc(hi.name)} <span class="c">${hi.total}</span><span class="why">${x.why}</span></div>
      <div class="acts"><button class="pill pill-accent press" data-merge="${esc(lo.name)}" data-into="${esc(hi.name)}">Zusammenführen</button><button class="pill pill-ghost press" data-ign="${i}">Kein Duplikat</button></div></div>`; }).join('')}</div>`:'';
  $('#dupWrap').querySelectorAll('[data-ign]').forEach(b=>b.onclick=()=>{ if(!oCanEdit()) return; const x=d[+b.dataset.ign]; OREG.ignoriert.push([x.a.name,x.b.name].sort()); oScheduleSave(); island('Wird nicht mehr vorgeschlagen'); oRenderList(false); });
  $('#dupWrap').querySelectorAll('[data-merge]').forEach(b=>b.onclick=()=>oOpenOrt(b.dataset.merge,{merge:b.dataset.into}));
  const N=Math.min(list.length,O_SHOWN);
  $('#olist').innerHTML=list.slice(0,N).map((p,i)=>`<button class="orow" data-o="${esc(p.name)}" style="${anim&&i<24&&!REDUCED?`animation-delay:${i*18}ms`:'animation:none'}">
      <div class="nm"><div class="t1">${esc(p.name)}</div><div class="t2">${oSub(p)}</div></div>${oSrcIcons(p)}${oPosDot(p.r)}<span class="days">${fmt0(p.total)}</span></button>`).join('')
    +(list.length>N?`<button class="more press" id="oMore">${fmt0(list.length-N)} weitere anzeigen</button>`:'')
    ||'<p class="muted" style="text-align:center;padding:24px">Keine Orte gefunden.</p>';
  $('#oMore')?.addEventListener('click',()=>{ O_SHOWN+=150; oRenderList(false); });
}
let O_SHOWN=150;
function oSrcIcons(p){ return `<span class="src" title="${p.coffee&&p.place?'Kaffeeort und spezifischer Ort':p.coffee?'Kaffeeort':p.place?'Spezifischer Ort':'nicht mehr verwendet'}"><span class="${p.coffee?'':'off'}">${O_ICO.cup}</span><span class="${p.place?'':'off'}">${O_ICO.pin}</span></span>`; }
function oPosDot(r){
  if(r.typ==='privat') return `<span class="pos lock" title="privat, keine Koordinaten">${O_ICO.lock}</span>`;
  if(r.genau==='land') return `<span class="pos na" title="irgendwo im Land, keine Koordinaten nötig"></span>`;
  const k=oKoord(r); return `<span class="pos${k?' has':''}" title="${k?(r.genau==='ortschaft'?'Position der Ortschaft':'Koordinaten vorhanden'):'keine Koordinaten'}"></span>`; }
function oSub(p){
  const r=p.r, b=[r.typ?esc(O_TYPE_LABEL[r.typ])+(r.art?' · '+esc(r.art):''):'<span class="none">kein Typ</span>'];
  const ld=oLand(r);
  if(r.genau==='ortschaft') b.push('irgendwo in '+(r.ortschaft?esc(r.ortschaft)+(ld?', '+esc(ld):''):'…'));
  else if(r.genau==='land') b.push('irgendwo in '+(ld?esc(ld):'…'));
  else if(r.ortschaft) b.push(esc(r.ortschaft)+(ld?', '+esc(ld):''));
  if(p.aliases.length) b.push(`<span class="al">+ ${p.aliases.map(esc).join(', ')}</span>`);
  return b.join(' · ');
}
$('#oFilters').addEventListener('click',e=>{ const b=e.target.closest('[data-f]'); if(!b) return; const k=b.dataset.f, v=b.dataset.val; OF[k]=OF[k]===v?null:v; O_SHOWN=150; oRenderList(); });
$('#oq').addEventListener('input',e=>{ OF.q=e.target.value; $('#oqClear').hidden=!OF.q; O_SHOWN=150; oRenderList(false); });
$('#oqClear').onclick=e=>{ e.preventDefault(); $('#oq').value=''; OF.q=''; $('#oqClear').hidden=true; oRenderList(false); };
$('#olist').addEventListener('click',e=>{ const r=e.target.closest('[data-o]'); if(r) oOpenOrt(r.dataset.o); });

/* ═══════════════════════════════════════════════════════════
   Ort bearbeiten
   ═══════════════════════════════════════════════════════════ */
let O_PANEL=null, O_MT=null, O_MQ='', O_MODE='alias', O_RN='', O_RUN=null;
function oSet(n,patch){
  if(!oCanEdit()) return false;
  const r={...(OREG.orte[n]||{}),...patch};
  Object.keys(r).forEach(k=>{ if(r[k]===undefined||r[k]===null||r[k]==='') delete r[k]; });
  if(Object.keys(r).length) OREG.orte[n]=r; else delete OREG.orte[n];
  oScheduleSave(); return true;
}
const oOrigin=p=>p.coffee&&p.place?'Kaffeeort und spezifischer Ort':p.coffee?'Kaffeeort':p.place?'Spezifischer Ort':'Nicht mehr verwendet';
const oDShort=s=>{ if(!s) return '–'; const d=parse(s); return `${d.getDate()}. ${MON3[d.getMonth()]} ${d.getFullYear()}`; };
function oAllArten(){ return [...new Set([...O_ARTEN,...Object.values(OREG.orte).map(r=>r.art).filter(Boolean)])]; }

function oRenderOrt(){
  if(!O_CUR) return; oUse=null;
  const p=oInfo(O_CUR), r=p.r, pub=oIsPublic(r), pubType=O_PUBLIC.includes(r.typ);
  $('#dName').textContent=O_CUR;
  $('#dSub').textContent=`${oOrigin(p)} · ${fmt0(p.total)} ${p.total===1?'Tag':'Tage'}`;
  // Position: Typ „bei Freund*innen“ hat nur eine Ortschaft, nie Koordinaten.
  // „Irgendwo in Ortschaft“ nutzt die Position der Ortschaft (gilt für alle Orte dort).
  const os=r.ortschaft?oOs(r.ortschaft):{}, nIn=r.ortschaft?oInOrtschaft(r.ortschaft).filter(n=>OREG.orte[n].genau==='ortschaft').length:0;
  let pos='';
  if(r.typ==='privat'){
    pos=oOrtPicker(r)+`<div class="sec-hint">${O_ICO.lock}<span>Orte bei Freund*innen bekommen keine eigenen Koordinaten und erscheinen nie auf der Karte. Die Ortschaft zählt für Auswertungen.</span></div>`;
  } else {
    pos=`<div class="o-types" style="margin-bottom:4px">${O_GENAU.map(([g,l])=>`<button class="chip${(r.genau||'')===g?' on':''}" data-genau="${g}"><span class="cd"></span>${l}</button>`).join('')}</div>`;
    if(r.genau==='land'){
      pos+=oLandPicker(r.land)+`<div class="sec-hint">${O_ICO.info}<span>Irgendwo in einem Land: keine Koordinaten nötig. Zählt in Auswertungen normal mit, erscheint aber nicht auf der Karte.</span></div>`;
    } else if(r.genau==='ortschaft'){
      pos+=oOrtPicker(r);
      pos+=r.ortschaft?`<div class="field-row"><span class="label">Position von ${esc(r.ortschaft)} <span class="hint">gilt für ${nIn===1?'diesen Ort':`alle ${nIn} Orte in ${esc(r.ortschaft)}`}</span></span>${oKoordBlock(os.koord,'os',12)}</div>
        <div class="sec-hint">${O_ICO.info}<span>Auf der Karte erscheint eine Markierung für die Ortschaft statt eines Punkts.</span></div>`
        :`<div class="sec-hint">${O_ICO.info}<span>Zuerst die Ortschaft wählen. Ihre Position setzt du einmal, sie gilt dann für alle Orte dort.</span></div>`;
    } else {
      pos+=`<div class="field-row"><span class="label">Position</span>${oKoordBlock(r.koord,'ort',17)}</div>`+oOrtPicker(r,true);
    }
    if(r.typ==='zuhause') pos+=`<div class="sec-hint">${O_ICO.lock}<span>Zuhause-Orte dürfen Koordinaten haben, landen aber nie auf der Webseite.</span></div>`;
    if(pubType){ const k=oKoord(r); pos+=`<button class="tgl press" id="oPub" role="switch" aria-checked="${r.oeffentlich!==false}" ${k?'':'disabled'}><div>Auf der Karte zeigen<p>${k?(pub?'Erscheint auf der Karte, sobald es sie gibt.':'Bleibt privat, obwohl der Typ öffentlich wäre.'):'Braucht zuerst eine Position.'}</p></div><span class="sw2"></span></button>`; }
  }
  const al=p.aliases.length?`<div style="margin-top:14px"><span class="label">Verweise auf diesen Ort</span><div style="margin-top:4px">${p.aliases.map(a=>`<div class="alias-row">${esc(a)} <span class="c">${fmt0(oDaysOf(a))} Tage</span>
      <button class="pill pill-ghost press" data-unalias="${esc(a)}">Aufheben</button><button class="pill pill-ghost press" data-replace="${esc(a)}">Überall ersetzen</button></div>`).join('')}</div></div>`:'';
  $('#dBody').innerHTML=`
    <div class="o-stats">
      <div class="stat"><div class="cl">Tage</div><div class="big">${fmt0(p.total)}</div><div class="avg">${p.coffee&&p.place?`${p.coffee} Kaffee · ${p.place} Ort`:'&nbsp;'}</div></div>
      <div class="stat"><div class="cl">Zuerst</div><div class="big d">${oDShort(p.first)}</div></div>
      <div class="stat"><div class="cl">Zuletzt</div><div class="big d">${oDShort(p.last)}</div></div>
    </div>
    <div class="card"><div class="card-head"><span class="card-title">Typ</span><span class="card-sub">${r.typ?'':'noch keiner'}</span></div>
      <div class="o-types">${O_TYPES.map(([t,l])=>`<button class="chip${r.typ===t?' on':''}" data-typ="${t}"><span class="cd"></span>${esc(l)}</button>`).join('')}</div>
      ${r.typ==='ort'?`<div class="field-row"><span class="label">Art <span class="hint">optional</span></span><div class="o-types">${oAllArten().map(a=>`<button class="chip${r.art===a?' on':''}" data-art="${esc(a)}"><span class="cd"></span>${esc(a)}</button>`).join('')}<input class="chip-add" id="oArt" placeholder="+ Art" enterkeyhint="done" autocomplete="off"></div></div>`:''}
    </div>
    <div class="card"><div class="card-head"><span class="card-title">Position</span></div>${pos}</div>
    <div class="card"><div class="card-head"><span class="card-title">Name</span></div>
      <div class="name-acts">
        <button class="pill pill-dark press${O_PANEL==='rename'?' on':''}" data-panel="rename">Umbenennen …</button>
        <button class="pill pill-dark press${O_PANEL==='merge'?' on':''}" data-panel="merge">Zusammenführen mit …</button>
      </div>
      <div class="expand${O_PANEL?' open':''}"><div><div class="o-panel" id="oPanel">${O_PANEL==='rename'?oRenamePanel():O_PANEL==='merge'?oMergePanel():''}</div></div></div>
      ${al}
    </div>`;
  oBindOrt();
}
function oBindOrt(){
  const B=$('#dBody'), rerender=()=>{ oRenderOrt(); };
  B.querySelectorAll('[data-typ]').forEach(b=>b.onclick=()=>{ const t=b.dataset.typ, r=oReg(O_CUR)||{}, nt=r.typ===t?undefined:t;
    if(nt==='privat'&&r.koord) island('Eigene Koordinaten entfernt (privat)','var(--accent)');
    oSet(O_CUR,{typ:nt,...(nt!=='ort'?{art:undefined}:{}),...(nt==='privat'?{koord:undefined,oeffentlich:undefined,genau:undefined,land:undefined}:{})}); rerender(); });
  B.querySelectorAll('[data-art]').forEach(b=>b.onclick=()=>{ const a=b.dataset.art; oSet(O_CUR,{art:(oReg(O_CUR)||{}).art===a?undefined:a}); rerender(); });
  $('#oArt')?.addEventListener('keydown',e=>{ if(e.key!=='Enter') return; const v=e.target.value.trim(); if(!v) return; oSet(O_CUR,{art:v[0].toUpperCase()+v.slice(1)}); rerender(); });
  B.querySelectorAll('[data-genau]').forEach(b=>b.onclick=()=>{ const g=b.dataset.genau||undefined, r=oReg(O_CUR)||{};
    if(g&&r.koord) island(g==='land'?'Eigene Koordinaten entfernt (irgendwo im Land)':'Eigene Koordinaten entfernt, es gilt die Ortschaft','var(--accent)');
    oSet(O_CUR,{genau:g,...(g?{koord:undefined}:{}),...(g!=='land'?{land:undefined}:{})}); rerender(); });
  // Koordinaten (eigene oder der Ortschaft)
  B.querySelectorAll('[data-kin]').forEach(inp=>{ const sc=inp.dataset.kin, err=B.querySelector(`[data-kerr="${sc}"]`);
    const set=()=>{ const k=oParseCoord(inp.value); if(!k){ err.textContent='Keine gültigen Koordinaten erkannt. Beispiel: 47.3769, 8.5417'; return; } oKSetter(sc)(k); island(sc==='os'?'Position der Ortschaft gesetzt':'Position gesetzt'); rerender(); };
    B.querySelector(`[data-kset="${sc}"]`).onclick=set; inp.onkeydown=e=>{ if(e.key==='Enter') set(); }; inp.oninput=()=>err.textContent='';
    inp.onpaste=()=>setTimeout(()=>{ if(oParseCoord(inp.value)) set(); },0); });
  B.querySelectorAll('[data-khere]').forEach(b=>b.onclick=()=>oHere(oKSetter(b.dataset.khere)));
  B.querySelectorAll('[data-kdel]').forEach(b=>b.onclick=()=>{ oKSetter(b.dataset.kdel)(undefined); rerender(); });
  // Ortschaft wählen
  const osIn=$('#oOsIn'), osAc=$('#oOsAc');
  if(osIn){ let sel=-1;
    const draw=()=>{ const m=osIn.value.trim()?oOsMatches(osIn.value.trim()):[]; sel=-1;
      osAc.innerHTML=m.map(([v,n],i)=>`<button class="acs" data-os="${esc(v)}" style="animation-delay:${i*22}ms"><span>${esc(v)}</span>${n?`<span class="c">${n}</span>`:''}${LOC_CC[v]?`<span class="c">${esc(LOC_CC[v])}</span>`:''}</button>`).join('');
      osAc.classList.toggle('open',m.length>0); };
    osIn.oninput=draw;
    osIn.onkeydown=e=>{ const it=[...osAc.querySelectorAll('.acs')];
      if((e.key==='ArrowDown'||e.key==='ArrowUp')&&it.length){ e.preventDefault(); sel=(sel+(e.key==='ArrowDown'?1:-1)+it.length+1)%(it.length+1)-1; it.forEach((b,i)=>b.classList.toggle('hl',i===sel)); return; }
      if(e.key==='Escape'){ osIn.value=''; draw(); return; }
      if(e.key==='Enter'){ e.preventDefault(); const q=osIn.value.trim().toLowerCase(), first=it[0]?.dataset.os;
        oChooseOs(sel>=0&&it[sel]?it[sel].dataset.os:first&&first.toLowerCase().startsWith(q)?first:osIn.value); } };
    osAc.onpointerdown=e=>{ if(e.target.closest('.acs')) e.preventDefault(); };
  }
  B.querySelectorAll('[data-os]').forEach(b=>b.onclick=()=>oChooseOs(b.dataset.os));
  B.querySelector('[data-os-chip]')?.addEventListener('click',e=>{ if(e.target.closest('[data-os-clear]')){ O_LANDOPEN=false; oSet(O_CUR,{ortschaft:undefined}); } else O_LANDOPEN=!O_LANDOPEN; rerender(); });
  // Land wählen (für „irgendwo im Land“ oder für die Ortschaft)
  const setLand=(sc,c)=>{ c=c.trim().toUpperCase(); const r=oReg(O_CUR)||{};
    if(sc==='os'){ const cur=oOs(r.ortschaft).land; oSetOs(r.ortschaft,{land:cur===c?undefined:c}); O_LANDOPEN=false; }
    else oSet(O_CUR,{land:r.land===c?undefined:c}); rerender(); };
  B.querySelectorAll('[data-land]').forEach(b=>b.onclick=()=>setLand(b.dataset.lscope,b.dataset.land));
  B.querySelectorAll('[data-landin]').forEach(i=>i.onkeydown=e=>{ if(e.key==='Enter'&&i.value.trim()){ e.preventDefault(); setLand(i.dataset.landin,i.value); } });
  $('#oPub')?.addEventListener('click',()=>{ const r=oReg(O_CUR)||{}; oSet(O_CUR,{oeffentlich:r.oeffentlich===false?undefined:false}); rerender(); });
  B.querySelectorAll('[data-panel]').forEach(b=>b.onclick=()=>{ if(O_RUN) return; O_PANEL=O_PANEL===b.dataset.panel?null:b.dataset.panel; O_MT=null; O_MQ=''; O_RN=''; O_MODE='alias'; rerender();
    setTimeout(()=>{ const i=$('#oPanel input'); if(i&&!TOUCH) i.focus({preventScroll:true}); },60); });
  B.querySelectorAll('[data-unalias]').forEach(b=>b.onclick=()=>{ const a=b.dataset.unalias; delete OREG.orte[a]; oScheduleSave(); oUse=null; buildDatalists(); island('Verweis aufgehoben'); rerender(); });
  B.querySelectorAll('[data-replace]').forEach(b=>b.onclick=()=>{ const a=b.dataset.replace, t=O_CUR; O_CUR=a; O_PANEL='merge'; O_MT=t; O_MODE='replace'; O_MQ=''; rerender(); });
  oBindPanel();
}

/* ─── Koordinaten ─────────────────────────────────────── */
function oParseCoord(s){
  s=String(s).trim(); let m;
  m=s.match(/@(-?\d+\.\d+),(-?\d+\.\d+)/)
   ||s.match(/[?&](?:m?lat|q|ll|query)=(-?\d+\.\d+)(?:&m?lon=|,|%2C)(-?\d+\.\d+)/i)
   ||s.match(/#map=\d+\/(-?\d+\.\d+)\/(-?\d+\.\d+)/)
   ||s.match(/(-?\d{1,2}\.\d+)\s*[,;]\s*(-?\d{1,3}\.\d+)/)
   ||s.match(/(-?\d{1,2}\.\d+)\s+(-?\d{1,3}\.\d+)/);
  if(!m) return null; const a=+m[1], b=+m[2]; if(Math.abs(a)>90||Math.abs(b)>180) return null;
  return [Math.round(a*1e4)/1e4, Math.round(b*1e4)/1e4];
}
function oHere(setter){
  if(!navigator.geolocation){ island('Standort nicht verfügbar','var(--bad)'); return; }
  const n=O_CUR; island('Standort wird bestimmt …','var(--c-km)',0);
  navigator.geolocation.getCurrentPosition(
    p=>{ setter([Math.round(p.coords.latitude*1e4)/1e4,Math.round(p.coords.longitude*1e4)/1e4]); island(`Standort übernommen (± ${Math.round(p.coords.accuracy)} m)`); if(O_CUR===n) oRenderOrt(); },
    e=>island('Standort nicht verfügbar: '+(e.code===1?'keine Berechtigung':e.message),'var(--bad)',3500),
    {enableHighAccuracy:true,timeout:10000,maximumAge:60000});
}

/* ─── Bausteine: Koordinaten, Ortschaft, Land ──────────── */
function oKoordBlock(k,scope,zoom){
  return `<div class="pos-now">${k?`<span class="k">${k[0].toFixed(4)}, ${k[1].toFixed(4)}</span>
      <a href="https://www.openstreetmap.org/?mlat=${k[0]}&mlon=${k[1]}#map=${zoom}/${k[0]}/${k[1]}" target="_blank" rel="noopener">Karte ↗</a>
      <button class="x press" data-kdel="${scope}" aria-label="Koordinaten entfernen">✕</button>`:`<span class="k none">Keine Koordinaten</span>`}</div>
    <div class="pos-row"><button class="pill pill-dark press" data-khere="${scope}">${O_ICO.loc}Aktueller Standort</button></div>
    <div class="pos-row" style="margin-top:8px"><input class="text-in" data-kin="${scope}" placeholder="Koordinaten oder Karten-Link einfügen" autocomplete="off" autocapitalize="off" spellcheck="false" enterkeyhint="done">
      <button class="pill pill-accent press" data-kset="${scope}">Setzen</button></div>
    <div class="pos-err" data-kerr="${scope}"></div>`;
}
const oKSetter=scope=>scope==='os'?(k=>oSetOs(oReg(O_CUR)?.ortschaft,{koord:k})):(k=>oSet(O_CUR,{koord:k}));
let O_LANDOPEN=false;
function oOrtPicker(r,optional=false){   // wie „Ort“ im Erfassen: Chip mit Land-Kürzel, Vorschläge aus den Tagen
  const o=r.ortschaft, land=o?(oOs(o).land||LOC_CC[o]||null):null;
  const top=o?[]:(SUGG.locations||[]).slice(0,6).map(x=>x[0]);
  const chips=o?`<button class="chip on" data-os-chip><span class="cd"></span>${esc(o)}<span class="cc${land?'':' miss'}">${land?esc(land):'?'}</span><span class="x" data-os-clear aria-label="entfernen">✕</span></button>`
    :top.map(v=>`<button class="chip" data-os="${esc(v)}"><span class="cd"></span>${esc(v)}</button>`).join('');
  const landRow=o&&(O_LANDOPEN||!land)?`<div class="cc-row" style="padding-top:10px"><span class="label">Land von ${esc(o)} <span class="hint">gilt überall</span></span>${oLandPicker(land,'os')}</div>`:'';
  return `<div class="field-row"><span class="label">Ortschaft${optional?' <span class="hint">optional</span>':''}</span>
    <div class="chips">${chips}${o?'':`<input class="chip-add" id="oOsIn" placeholder="+ Ortschaft" enterkeyhint="done" autocomplete="off" autocorrect="off" spellcheck="false">`}</div>
    <div class="ac" id="oOsAc" role="listbox"></div>${landRow}</div>`;
}
function oLandPicker(cur,scope='ort'){
  const list=[...new Set([...(cur?[cur]:[]),...(SUGG.countries||[]).slice(0,8).map(x=>x[0])])];
  return `<div class="chips" style="margin-top:${scope==='ort'?'12px':'0'}">${list.map(c=>`<button class="chip${c===cur?' on':''}" data-land="${esc(c)}" data-lscope="${scope}"><span class="cd"></span>${esc(c)}</button>`).join('')}
    <input class="chip-add" data-landin="${scope}" placeholder="+ Land" style="width:90px" enterkeyhint="done" autocomplete="off" autocapitalize="characters" spellcheck="false"></div>`;
}
function oOsMatches(q){ const ql=q.toLowerCase().replace(/\s+/g,'_');
  return (SUGG.locations||[]).filter(([v])=>v.toLowerCase().includes(ql)).sort((a,b)=>(b[0].toLowerCase().startsWith(ql)-a[0].toLowerCase().startsWith(ql))||(b[1]-a[1])).slice(0,8); }
function oChooseOs(v){
  v=String(v).trim().replace(/\s+/g,'_'); if(!v) return;
  const known=(SUGG.locations||[]).find(([x])=>x.toLowerCase()===v.toLowerCase()); if(known) v=known[0];
  O_LANDOPEN=false; oSet(O_CUR,{ortschaft:v}); oRenderOrt();
}

/* ─── Umbenennen ──────────────────────────────────────── */
function oRenameCheck(v){
  if(!v) return {ok:false};
  if(/\s/.test(v)) return {err:'Keine Leerzeichen – im Suchindex trennen Leerzeichen die Namen. Unterstrich verwenden.'};
  if(/[:#\[\]{},"']|^[-?!&*|>%@`]/.test(v)) return {err:'Bitte keine Sonderzeichen wie : # [ ] { } , " oder ein Zeichen wie - am Anfang (YAML).'};
  if(v===O_CUR) return {err:'Das ist der aktuelle Name.'};
  if(oUsage()[v]||OREG.orte[v]) return {err:'exists'};
  return {ok:true};
}
function oRenamePanel(){
  const u=oUsage()[O_CUR]||{coffee:0,place:0,days:0}, n=u.days, chk=oRenameCheck(O_RN);
  return `<input class="text-in" id="oRn" placeholder="Neuer Name" value="${esc(O_RN)}" autocomplete="off" autocapitalize="off" autocorrect="off" spellcheck="false" enterkeyhint="done">
    <div class="o-prev">${chk.err==='exists'
      ?`<span class="err">„${esc(O_RN)}“ gibt es schon.</span> <button class="pill pill-accent press" data-to-merge="${esc(O_RN)}" style="margin-left:6px">Stattdessen zusammenführen</button>`
      :chk.err?`<span class="err">${chk.err}</span>`
      :chk.ok?`<div class="big">${esc(O_CUR)} <span class="ar">→</span> ${esc(O_RN)}</div>
        <ul><li>${n?`${fmt0(n)} ${n===1?'Tag wird':'Tage werden'} geändert${u.coffee&&u.place?` (${u.coffee} in <i>Kaffee</i>, ${u.place} in <i>Spezifische Orte</i>)`:''}`:'Kommt in keinem Tag vor, nur das Register ändert sich'}</li>
        <li>Typ, Position und Verweise ziehen mit um</li>${n&&SOURCE==='github'?'<li>Danach wird der Suchindex aktualisiert</li>':''}</ul>`
      :`<span style="color:var(--text-3)">Neuer Name ohne Leerzeichen, z. B. <i>${esc(O_CUR)}_Kafi</i></span>`}</div>
    <div class="run-actions"><button class="pill pill-accent press" id="oGo" ${chk.ok?'':'disabled'}>${n?`${fmt0(n)} ${n===1?'Tag':'Tage'} ändern`:'Umbenennen'}</button></div>
    <div class="pbar" id="oBar2"><b></b></div><div class="slog" id="oLog"></div>`;
}

/* ─── Zusammenführen ─────────────────────────────────── */
function oMergePanel(){
  const cand=oAll().filter(x=>x.name!==O_CUR&&(!O_MQ||oNorm(x.name).includes(oNorm(O_MQ)))).slice(0,O_MQ?24:10);
  if(O_MT&&!cand.some(x=>x.name===O_MT)) cand.unshift(oInfo(O_MT));
  const u=oUsage()[O_CUR]||{days:0,coffee:0,place:0}, n=u.days, t=O_MT;
  let both=0, bothPl=0; if(t){ DATA.forEach(e=>{ O_KEYS.forEach(k=>{ const v=e[k]||[]; if(v.includes(O_CUR)&&v.includes(t)){ both++; if(k==='places') bothPl++; } }); }); }
  return `<input class="text-in" id="oMq" placeholder="Zielort suchen" value="${esc(O_MQ)}" autocomplete="off" autocapitalize="off" autocorrect="off" spellcheck="false">
    <div class="o-pick">${cand.map(x=>`<button class="acs${x.name===t?' on':''}" data-target="${esc(x.name)}">${esc(x.name)}<span class="c">${fmt0(x.total)}</span></button>`).join('')||'<span class="muted">Kein Ort gefunden</span>'}</div>
    ${t?`<div class="o-prev"><div class="big">${esc(O_CUR)} <span class="c">${fmt0(n)} Tage</span> <span class="ar">→</span> ${esc(t)} <span class="c">${fmt0(oInfo(t).total)} Tage</span></div></div>
    <div class="o-mode">
      <div class="opt" role="radio" tabindex="0" data-mode="alias" aria-checked="${O_MODE==='alias'}"><span class="rd"></span><div><strong>Als Verweis</strong><p>Beide Namen gelten als ein Ort, vorgeschlagen wird nur noch ${esc(t)}. Die Tage bleiben unverändert, jederzeit rückgängig.</p></div></div>
      <div class="opt" role="radio" tabindex="0" data-mode="replace" aria-checked="${O_MODE==='replace'}"><span class="rd"></span><div><strong>Überall ersetzen</strong><p>${esc(O_CUR)} wird in ${fmt0(n)} ${n===1?'Tag':'Tagen'} durch ${esc(t)} ersetzt, damit es auch in Obsidian sauber ist.${bothPl?` Bei den spezifischen Orten bleibt ${esc(t)} an ${bothPl} ${bothPl===1?'Tag':'Tagen'} nur einmal stehen.`:''}${both-bothPl?` Bei Kaffee bleibt jeder Eintrag erhalten, weil er einen Kaffee zählt.`:''}</p></div></div>
    </div>
    ${oConflictNote(t)}
    <div class="run-actions"><button class="pill pill-accent press" id="oGo">${O_MODE==='alias'?'Verweis setzen':`${fmt0(n)} ${n===1?'Tag':'Tage'} ändern`}</button></div>
    <div class="pbar" id="oBar2"><b></b></div><div class="slog" id="oLog"></div>`:''}`;
}
function oConflictNote(t){
  const a=oReg(O_CUR)||{}, b=oReg(t)||{}, notes=[];
  if(a.typ&&b.typ&&a.typ!==b.typ) notes.push(`Typ: ${O_TYPE_LABEL[b.typ]} von ${esc(t)} gilt (${esc(O_CUR)} war ${O_TYPE_LABEL[a.typ]}).`);
  else if(a.typ&&!b.typ) notes.push(`${esc(t)} übernimmt den Typ ${O_TYPE_LABEL[a.typ]}.`);
  if(a.koord&&b.koord) notes.push(`Position von ${esc(t)} gilt.`); else if(a.koord&&!b.koord) notes.push(`${esc(t)} übernimmt die Position.`);
  if(a.ortschaft&&b.ortschaft&&a.ortschaft!==b.ortschaft) notes.push(`Ortschaft ${esc(b.ortschaft)} gilt.`);
  return notes.length?`<div class="sec-hint">${O_ICO.info}<span>${notes.join(' ')}</span></div>`:'';
}
function oBindPanel(){
  const P=$('#oPanel'); if(!P) return;
  const redraw=(html,id)=>{ const el=$('#'+id), pos=el?.selectionStart; P.innerHTML=html(); const n=$('#'+id); if(n&&document.activeElement!==n&&id){ n.focus({preventScroll:true}); if(pos!=null) n.setSelectionRange(pos,pos); } oBindPanel(); };
  const rn=$('#oRn');
  if(rn){
    rn.oninput=()=>{ O_RN=rn.value.trim(); redraw(oRenamePanel,'oRn'); };
    rn.onkeydown=e=>{ if(e.key==='Enter'&&oRenameCheck(O_RN).ok) $('#oGo').click(); };
    $('#oGo').onclick=()=>oReplace(O_CUR,O_RN,{rename:true});
    P.querySelector('[data-to-merge]')?.addEventListener('click',e=>{ O_PANEL='merge'; O_MT=e.target.dataset.toMerge; O_MQ=''; oRenderOrt(); });
  }
  const mq=$('#oMq');
  if(mq){
    mq.oninput=()=>{ O_MQ=mq.value; redraw(oMergePanel,'oMq'); };
    P.querySelectorAll('[data-target]').forEach(b=>b.onclick=()=>{ O_MT=b.dataset.target===O_MT?null:b.dataset.target; P.innerHTML=oMergePanel(); oBindPanel(); });
    P.querySelectorAll('[data-mode]').forEach(o=>o.onclick=o.onkeydown=e=>{ if(e.type==='keydown'&&e.key!==' '&&e.key!=='Enter') return; e.preventDefault(); O_MODE=o.dataset.mode; P.innerHTML=oMergePanel(); oBindPanel(); });
    $('#oGo')?.addEventListener('click',()=>{
      if(O_MODE==='alias'){
        const from=O_CUR, to=O_MT; oMergeData(from,to); OREG.orte[from]={alias:to}; oAliasesTo(from).forEach(a=>OREG.orte[a]={alias:to});
        oScheduleSave(); oUse=null; buildDatalists(); island(`${from} verweist jetzt auf ${to}`);
        O_CUR=to; O_PANEL=null; oRenderOrt();
      } else oReplace(O_CUR,O_MT,{});
    });
  }
}
function oMergeData(from,to){ const a=oReg(from)||{}, b=oReg(to)||{}, add={};
  ['typ','art','genau','koord','ortschaft','land','oeffentlich'].forEach(k=>{ if(a[k]!==undefined&&a[k]!==null&&b[k]===undefined) add[k]=a[k]; });
  if(Object.keys(add).length) OREG.orte[to]={...b,...add}; }

/* ─── Ersetzen in den Tagesdateien ────────────────────────
   1. Register: alter Name wird sofort Verweis auf den neuen (gespeichert, bevor ein Tag geändert wird)
   2. Tage nacheinander: frische Datei holen, nur die Listenzeilen in coffee_locations/places ersetzen, schreiben
   3. Am Schluss: Suchindex schreiben, Verweis entfernen, Register speichern
   Abbruch oder Fehler: Verweis bleibt stehen → stimmig, später einfach nochmals ausführen.          */
function oReplaceText(raw,from,to){
  const t=raw.replace(/\r\n/g,'\n'), m=t.match(/^---\n([\s\S]*?)\n---/); if(!m) return raw;
  let key=null, seen=null, changed=false; const out=[];
  for(const l of m[1].split('\n')){
    const k=l.match(/^([A-Za-z_][\w-]*):/); if(k){ key=k[1]; seen=new Set(); out.push(l); continue; }
    const it=l.match(/^(\s+-\s+)(.*?)\s*$/);
    if(it&&(key==='coffee_locations'||key==='places')){
      let v=it[2].replace(/^['"]|['"]$/g,'');
      if(v===from){ v=to; changed=true; }
      if(key==='places'){ if(seen.has(v)) continue; seen.add(v); }   // spezifische Orte: einmal pro Tag
      out.push(it[1]+v); continue;                                     // Kaffee: jede Zeile ist ein Kaffee, bleibt
    }
    out.push(l);
  }
  if(!changed) return raw;
  const n=new Date(), ts=`${n.getFullYear()}-${pad(n.getMonth()+1)}-${pad(n.getDate())}T${pad(n.getHours())}:${pad(n.getMinutes())}:${pad(n.getSeconds())}`;
  const yaml=out.join('\n').replace(/^updated:.*$/m,`updated: ${ts}`);
  return '---\n'+yaml+'\n---'+t.slice(m[0].length);
}
async function oReplace(from,to,{rename=false}={}){
  if(O_RUN||!oCanEdit()) return;
  const live=SOURCE==='github';
  if(live&&OFFLINE){ island('Keine Verbindung zu GitHub','var(--bad)'); return; }
  const P=$('#oPanel'), btn0=$('#oGo'), btn=btn0.cloneNode(true); btn0.replaceWith(btn); btn.disabled=false;
  const bar=$('#oBar2'), log=$('#oLog');
  P.querySelectorAll('input,[data-target],[data-mode],[data-to-merge]').forEach(x=>x.style.pointerEvents='none');
  $('#dBody').querySelectorAll('[data-panel],[data-typ],[data-genau],[data-unalias],[data-replace]').forEach(x=>x.style.pointerEvents='none');
  const L=(m,c='')=>{ log.insertAdjacentHTML('beforeend',`<div class="${c}">${esc(m)}</div>`); log.scrollTop=log.scrollHeight; };
  const done=(label,ok)=>{ O_RUN=null; btn.textContent=label; btn.className='pill press '+(ok?'pill-accent':'pill-dark'); btn.onclick=()=>{ O_CUR=to; O_PANEL=null; oRenderOrt(); }; };
  const run=O_RUN={stop:false}; btn.textContent='Abbrechen'; btn.className='pill pill-dark press'; btn.onclick=()=>{ run.stop=true; btn.disabled=true; btn.textContent='Wird abgebrochen …'; };
  bar.classList.add('on');
  try{
    await flushSaves(); if(PENDING.size) throw new Error('ungespeicherte Änderungen an einem Tag');
    // 1. Register
    if(rename){ if(OREG.orte[from]&&!OREG.orte[from].alias) OREG.orte[to]={...OREG.orte[from]}; } else oMergeData(from,to);
    oAliasesTo(from).forEach(a=>OREG.orte[a]={alias:to}); OREG.orte[from]={alias:to};
    await oSaveNow(); oUse=null; buildDatalists();
    L(`Register: ${from} → ${to} (Verweis gesetzt)`);
    // 2. Tage
    const dates=[...DATA.values()].filter(e=>O_KEYS.some(k=>(e[k]||[]).includes(from))).map(e=>e.date).sort();
    let i=0, w=0;
    for(const d of dates){
      if(run.stop){ L(`Abgebrochen nach ${i} von ${dates.length} Tagen. ${from} bleibt als Verweis auf ${to} stehen. Nochmals ausführen setzt fort.`,'err'); done('Fertig',false); return; }
      if(live){
        const path=dayPath(d), f=await ghGetFile(path);
        if(f&&f.text!=null){ const nt=oReplaceText(f.text,from,to);
          if(nt!==f.text){ const res=await ghPutFile(path,nt,`Ort ${from} → ${to}`,f.sha); w++;
            const old=DATA.get(d); delete FILES[d];
            if(old?._file){ const P2=parseDay(nt,d); P2._file.sha=res.content?.sha||null; P2._file.exists=true; DATA.set(d,P2); }
            else if(old){ old.coffeeLocations=old.coffeeLocations.map(x=>x===from?to:x); old.places=[...new Set(old.places.map(x=>x===from?to:x))]; }
            const ie=indexEntry(d,nt,byteSize(nt)); if(ie&&RAW_INDEX){ const j=RAW_INDEX.findIndex(x=>x.date===d); if(j>=0) RAW_INDEX[j]=ie; else RAW_INDEX.push(ie); } } }
      } else {
        const e=DATA.get(d); if(e){ e.coffeeLocations=e.coffeeLocations.map(x=>x===from?to:x); e.places=[...new Set(e.places.map(x=>x===from?to:x))]; w++; }
        await new Promise(r=>setTimeout(r,dates.length>100?8:40));
      }
      i++; bar.firstChild.style.width=(i/dates.length*100)+'%';
      if(i<=3||i===dates.length||i%Math.max(1,Math.round(dates.length/8))===0) L(`${d}  ✓`);
    }
    // 3. Abschluss
    if(live&&w){ L('Suchindex wird geschrieben …');
      const tags=new Set(JSON.parse(localStorage.getItem('knownTags')||'[]')); INDEX_BUILT=new Date().toISOString();
      const cur0=await ghGetFile('search-index.json');
      await ghPutFile('search-index.json',JSON.stringify({v:10,built:INDEX_BUILT,index:RAW_INDEX,tags:[...tags]}),'Update search index',cur0?.sha); }
    delete OREG.orte[from]; await oSaveNow();
    ['coffeeLocations','places'].forEach(k=>{ if(TOP[k]) TOP[k]=[...new Set(TOP[k].map(x=>x===from?to:x))]; });
    oUse=null; buildDatalists(); renderStrip(); dashDirty=true; searchDirty=true;
    bar.firstChild.style.width='100%';
    L(`${fmt0(w)} ${w===1?'Tag':'Tage'} geändert${live&&w?' · Suchindex aktualisiert':''} · Verweis entfernt`,'ok');
    island(rename?`Umbenannt in ${to}`:`${from} überall durch ${to} ersetzt`);
    done('Fertig',true);
  }catch(e){
    console.error(e); L('Fehler: '+e.message+(OREG.orte[from]?.alias===to?` · ${from} bleibt als Verweis auf ${to}, nochmals ausführen setzt fort.`:''),'err');
    oUse=null; buildDatalists(); done('Schliessen',false);
  }
}

/* ─── Ansicht der Datei / Vorschau Karten-Export ──────── */
$('#oShowJson').onclick=()=>{
  openSheet(`<div class="sheet-head"><h2>orte.json</h2>${closeBtn}</div><div class="sheet-body"><pre class="o-json">${esc(oRegJson())}</pre>
    <p class="o-json-note">${OREG_STATE==='ok'?'Liegt im privaten Diary-Repo neben <i>search-index.json</i>.':OREG_STATE==='demo'?'Demo-Daten, wird nicht gespeichert.':'Nicht geladen.'} Nur Namen mit Angaben stehen drin, alle anderen funktionieren wie bisher.</p></div>`);
};
function oExport(){
  const out={}, skip={zuhause:0,privat:0,land:0,ohne:0,aus:0};
  oAll().forEach(p=>{ const r=p.r;
    if(r.typ==='zuhause'||r.typ==='privat'){ skip[r.typ]++; return; }
    if(r.genau==='land'){ skip.land++; return; }
    const k=oKoord(r); if(!k||!O_PUBLIC.includes(r.typ)){ skip.ohne++; return; }
    if(r.oeffentlich===false){ skip.aus++; return; }
    out[p.name]={typ:r.typ,...(r.art?{art:r.art}:{}),...(r.genau?{genau:r.genau}:{}),koord:k,...(r.ortschaft?{ortschaft:r.ortschaft}:{}),...(oLand(r)?{land:oLand(r)}:{}),besuche:p.total,erster:p.first,letzter:p.last};
  });
  return {out,skip};
}
$('#oShowExport').onclick=()=>{
  const {out,skip}=oExport();
  openSheet(`<div class="sheet-head"><h2>Karten-Export</h2>${closeBtn}</div><div class="sheet-body"><pre class="o-json">${esc(`{\n  "v": 1,\n  "orte": {\n${Object.entries(out).map(([k,v])=>`    ${JSON.stringify(k)}: ${oOne(v)}`).join(',\n')}\n  }\n}`)}</pre>
    <p class="o-json-note">Vorschau, noch nicht veröffentlicht. Später als <i>data/orte.json</i> im öffentlichen Repo über Synchronisieren. Nicht enthalten: ${skip.zuhause} Zuhause, ${skip.privat} privat, ${skip.land} irgendwo im Land, ${skip.aus} ausgeblendet, ${skip.ohne} ohne Koordinaten oder Typ. Orte mit <i>genau: ortschaft</i> erscheinen als Markierung der Ortschaft. Keine Tagestexte, keine Personen.</p></div>`);
};

buildCounters();
setPreview(previewOn,false);

setSource(ghConfig()?.token&&startSrc!=='demo'?'github':'demo');
