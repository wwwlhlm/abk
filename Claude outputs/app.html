<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content">
<meta name="theme-color" content="#1a1a1a">
<meta name="robots" content="noindex">
<title>Tagebuch</title>
<style>
/* ─────────────────────────────────────────────────────────────
   Tokens – Basis DESIGN.md, Bewegung/Radien angelehnt an bencho
   ───────────────────────────────────────────────────────────── */
:root{
  --bg:#1a1a1a; --surface:#262626; --surface-2:#2f2f2f; --surface-3:#383838;
  --border:#333; --border-2:#444;
  --text:#ececec; --text-2:#a0a0a0; --text-3:#6b6b6b;
  --accent:#FD939F; --accent-bg:rgba(253,147,159,.12);
  --c-coffee:#FD939F; --c-apple:#81c784; --c-banana:#ffd54f; --c-km:#64b5f6;
  --good:#81c784; --bad:#e57373;
  --r-card:20px;
  --font:"Inter",ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;
  --ease-out:cubic-bezier(.32,.72,0,1);
  --spring:cubic-bezier(.32,.72,0,1);
  --spring-pop:cubic-bezier(.34,1.56,.64,1);
  --dock-h:64px;
  --vvh:100dvh; --vvt:0px;
}
@supports (transition-timing-function: linear(0, 1)){
  :root{
    --spring:linear(0,.013 .6%,.05 1.2%,.2 2.6%,.4 4.3%,.6 6.4%,.75 8.4%,.87 10.9%,.95 13.6%,1.006 17.3%,1.03 21.4%,1.035 25.9%,1.025 33%,1.008 43%,.999 55%,1);
    --spring-pop:linear(0,.009,.035 2.1%,.141,.281 6.7%,.723 12.9%,.938 16.7%,1.017,1.077,1.121,1.149 24.3%,1.159,1.163,1.161,1.154 29.9%,1.129 32.8%,1.051 39.6%,1.017 43.1%,.991,.977 51%,.974 53.8%,.975 57.1%,.997 69.8%,1.003 76.9%,1);
  }
}
@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{transition-duration:.01ms!important;animation-duration:.01ms!important}
}

*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{background:var(--bg);color-scheme:dark}
body{margin:0;font:15px/1.5 var(--font);color:var(--text);background:var(--bg);-webkit-font-smoothing:antialiased;overscroll-behavior-y:none}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer}
input,textarea{font:inherit;color:inherit}
svg{display:block}
.ico{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.press{transition:transform .35s var(--spring),background-color .2s,color .2s,opacity .2s}
.press:active{transform:scale(.94);transition-duration:.08s}

/* ─── Layout ─────────────────────────────────────────────── */
.view{max-width:640px;margin:0 auto;
  padding:calc(env(safe-area-inset-top) + 20px) 16px calc(var(--dock-h) + env(safe-area-inset-bottom) + 48px);
  display:flex;flex-direction:column;gap:12px}
.view[hidden]{display:none}
@media (min-width:1056px){
  .view{max-width:1120px;padding-left:28px;padding-right:28px}
  .grid-2{display:grid;grid-template-columns:1fr 1fr;gap:12px;align-items:start}
  .col{display:flex;flex-direction:column;gap:12px}
}
@media (max-width:1055px){ .grid-2,.col{display:contents} }

.card{background:var(--surface);border-radius:var(--r-card);padding:18px;position:relative}
.card-head{display:flex;align-items:center;gap:10px;margin-bottom:14px;min-height:32px;flex-wrap:wrap}
.card-title{font-size:15px;font-weight:500}
.card-sub{font-size:13px;color:var(--text-2)}
.label{font-size:12px;font-weight:500;letter-spacing:.4px;text-transform:uppercase;color:var(--text-3)}
.sw{width:8px;height:8px;border-radius:3px;flex-shrink:0;display:inline-block}

.seg{position:relative;display:inline-flex;padding:3px;border-radius:999px;background:var(--bg);margin-left:auto;flex-shrink:0}
.seg button{position:relative;z-index:1;height:30px;padding:0 12px;border-radius:999px;font-size:13px;color:var(--text-2);transition:color .25s}
.seg button[aria-selected="true"]{color:var(--text)}
.seg .thumb{position:absolute;top:3px;bottom:3px;left:0;border-radius:999px;background:var(--surface-3);transition:transform .5s var(--spring),width .5s var(--spring)}

.icon-btn{width:36px;height:36px;border-radius:50%;display:grid;place-items:center;background:var(--surface);color:var(--text-2);flex-shrink:0}
.icon-btn:hover{color:var(--text);background:var(--surface-2)}
.icon-btn .ico{width:18px;height:18px}
.pill{height:30px;padding:0 13px;border-radius:999px;font-size:13px;font-weight:500;display:inline-flex;align-items:center;gap:6px;flex-shrink:0}
.pill-white{background:#fff;color:#111}
.pill-accent{background:var(--accent-bg);color:var(--accent)}
.muted{color:var(--text-3);font-size:13px;padding:8px 2px;margin:0}

/* ─── Rolling Numbers ────────────────────────────────────── */
.roll{display:inline-flex;overflow:hidden;line-height:1;height:1em;vertical-align:baseline;font-variant-numeric:tabular-nums}
.roll .d{display:inline-block;height:1em;overflow:hidden}
.roll .d>span{display:flex;flex-direction:column;transition:transform .7s var(--spring)}
.roll .d>span>i{font-style:normal;height:1em;line-height:1;display:block}
.roll .s{display:inline-block;line-height:1}

/* ─── Status-Insel ───────────────────────────────────────── */
.island{position:fixed;left:50%;top:calc(env(safe-area-inset-top) + 10px);z-index:75;transform:translate(-50%,-160%);
  display:flex;align-items:center;gap:8px;height:34px;padding:0 14px 0 10px;border-radius:999px;background:#000;color:var(--text);font-size:13px;
  box-shadow:0 8px 30px rgba(0,0,0,.4);transition:transform .55s var(--spring-pop);white-space:nowrap}
.island.show{transform:translate(-50%,0)}
.island .dot{width:8px;height:8px;border-radius:50%;background:var(--good)}

/* ─── Dock ───────────────────────────────────────────────── */
.dock-wrap{position:fixed;left:0;right:0;bottom:calc(env(safe-area-inset-bottom) + 14px - 40px);padding:40px 0;display:flex;justify-content:center;z-index:50;pointer-events:none;
  transition:transform .45s var(--spring),opacity .25s}
.kb .dock-wrap{transform:translateY(160%);opacity:0}
.dock{pointer-events:auto;position:relative;display:flex;align-items:flex-end;gap:4px;padding:8px 10px;border-radius:24px;
  background:rgba(38,38,38,.78);backdrop-filter:blur(20px) saturate(1.4);-webkit-backdrop-filter:blur(20px) saturate(1.4);
  box-shadow:0 0 0 1px rgba(255,255,255,.06)}
/* weicher Hof, gehört zum Dock selbst und läuft nach aussen aus */
.dock::before{content:"";position:absolute;inset:-26px -30px -22px;z-index:-1;border-radius:50px;pointer-events:none;
  background:radial-gradient(closest-side,rgba(10,10,10,.55),rgba(10,10,10,.28) 55%,transparent);filter:blur(4px)}
.dock-item{position:relative;width:48px;height:48px;display:grid;place-items:center;color:var(--text-3);transform-origin:50% 100%;will-change:transform}
.dock-item .ico{width:22px;height:22px}
.dock-item:hover,.dock-item[aria-current="page"]{color:var(--text)}
.dock-item::after{content:"";position:absolute;bottom:2px;left:50%;width:4px;height:4px;margin-left:-2px;border-radius:50%;background:var(--text-2);transform:scale(0);transition:transform .45s var(--spring-pop)}
.dock-item[aria-current="page"]::after{transform:scale(1)}
.dock-sep{width:1px;align-self:stretch;margin:8px 4px;background:var(--border-2)}
.dock-tip{position:absolute;bottom:calc(100% + 10px);left:0;padding:6px 12px;border-radius:999px;background:#fff;color:#111;font-size:13px;white-space:nowrap;
  pointer-events:none;opacity:0;transition:opacity .2s,left .45s var(--spring)}
.dock-tip.show{opacity:1}
@media (hover:none){ .dock-tip{display:none} }

/* ─── Erfassen: Tageskopf ────────────────────────────────── */
.day-head{display:flex;align-items:flex-end;gap:10px;padding:4px 4px 2px;touch-action:pan-y;user-select:none;-webkit-user-select:none}
.day-title{flex:1;min-width:0;overflow:hidden;cursor:pointer;text-align:left}
.day-wd{font-size:13px;color:var(--text-2)}
.day-date{font-size:28px;font-weight:500;letter-spacing:-.4px;line-height:1.15;white-space:nowrap;display:flex;align-items:center;gap:6px}
.day-date .ico{width:18px;height:18px;color:var(--text-3);margin-top:4px;transition:transform .3s var(--spring)}
.day-title:hover .day-date .ico{color:var(--text-2);transform:translateY(2px)}
.day-nav{display:flex;gap:6px;align-items:center}
.today-pill{transition:opacity .25s,transform .45s var(--spring-pop)}
.today-pill[hidden]{display:inline-flex;opacity:0;transform:scale(.6);pointer-events:none}

.strip{display:flex;gap:4px;overflow-x:auto;scroll-snap-type:x mandatory;scrollbar-width:none;margin:0 -16px;padding:6px 16px 2px;
  -webkit-mask-image:linear-gradient(90deg,transparent,#000 16px,#000 calc(100% - 16px),transparent);mask-image:linear-gradient(90deg,transparent,#000 16px,#000 calc(100% - 16px),transparent)}
.strip::-webkit-scrollbar{display:none}
.sd{flex:0 0 44px;scroll-snap-align:center;display:flex;flex-direction:column;align-items:center;gap:3px;padding:8px 0 7px;border-radius:14px;color:var(--text-2)}
.sd .w{font-size:11px;color:var(--text-3);text-transform:uppercase;letter-spacing:.4px}
.sd .n{font-size:15px;font-weight:500}
.sd .mini{display:flex;flex-direction:column-reverse;gap:1px;height:18px;width:6px}
.sd .mini i{display:block;width:6px;border-radius:2px}
.sd.sel{background:var(--surface);color:var(--text)}
.sd.today .n{color:var(--accent)}
.sd.future{opacity:.35}
.sd.weekstart{margin-left:8px}

/* Zähler */
.counters{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.counter{background:var(--bg);border-radius:16px;padding:12px 8px 8px;display:flex;flex-direction:column;align-items:center;gap:8px}
.counter .cl{display:flex;align-items:center;gap:6px}
.counter .val{font-size:30px;font-weight:500;height:30px;display:flex;align-items:center}
.counter .ctrl{display:flex;gap:6px;width:100%}
.counter .ctrl button{flex:1;height:36px;border-radius:11px;background:var(--surface);color:var(--text-2);font-size:20px;line-height:1}
.counter .ctrl button:hover{color:var(--text);background:var(--surface-2)}

/* Stimmung */
.mood-top{display:flex;align-items:baseline;gap:10px;margin-bottom:14px}
.mood-val{font-size:30px;font-weight:500;transition:color .3s}
.mood-word{font-size:13px;color:var(--text-2)}
.slider{position:relative;height:44px;touch-action:none;cursor:grab;outline:none}
.slider .track{position:absolute;left:0;right:0;top:50%;height:6px;margin-top:-3px;border-radius:3px;background:linear-gradient(90deg,#e57373,#ffcc80 30%,#555 50%,#a5d6a7 70%,#43a047)}
.slider .tick{position:absolute;top:50%;width:2px;height:2px;margin:-1px 0 0 -1px;border-radius:50%;background:rgba(0,0,0,.5)}
.slider .knob{position:absolute;top:50%;left:0;width:26px;height:26px;margin:-13px 0 0 -13px;border-radius:50%;background:#fff;box-shadow:0 2px 10px rgba(0,0,0,.5);transition:transform .25s var(--spring)}
.slider.snap .knob{transition:left .55s var(--spring),transform .25s var(--spring)}
.slider.drag .knob{transform:scale(1.18)}
.slider:focus-visible .knob{box-shadow:0 0 0 3px var(--accent),0 2px 10px rgba(0,0,0,.5)}
.ticks{display:flex;justify-content:space-between;font-size:11px;color:var(--text-3);margin-top:2px;padding:0 6px}

/* Chips */
.chip-group+.chip-group{margin-top:16px}
.chip-group>.label{display:flex;align-items:center;gap:8px;margin-bottom:8px}
.hint{font-size:12px;text-transform:none;letter-spacing:0;font-weight:400;color:var(--text-3);transition:color .2s}
.hint.warn{color:var(--accent)}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{height:34px;padding:0 13px;border-radius:999px;background:var(--bg);color:var(--text-2);font-size:14px;display:inline-flex;align-items:center;gap:7px;
  transition:background-color .2s,color .2s,transform .4s var(--spring)}
.chip:hover{color:var(--text)}
.chip .cd{width:6px;height:6px;border-radius:50%;background:currentColor;transform:scale(0);margin-left:-13px;transition:transform .4s var(--spring-pop),margin .4s var(--spring)}
.chip.on{background:var(--accent-bg);color:var(--accent)}
.chip.on .cd{transform:scale(1);margin-left:0}
.chip:active{transform:scale(.93);transition-duration:.08s}
.chip .badge{font-size:12px;opacity:.75;font-variant-numeric:tabular-nums}
.chip .x{font-size:11px;opacity:.55;margin-right:-3px;padding:6px 0 6px 2px}
.chip .x:hover{opacity:1}
.chip-add{width:110px;height:34px;padding:0 13px;border-radius:999px;border:1px dashed var(--border-2);background:transparent;font-size:16px;outline:none;transition:border-color .2s,width .4s var(--spring)}
.chip-add::placeholder{color:var(--text-3);font-size:14px}
.chip-add:focus{border-style:solid;border-color:var(--accent);width:170px}
.expand{display:grid;grid-template-rows:0fr;transition:grid-template-rows .45s var(--spring),opacity .3s;opacity:0}
.expand.open{grid-template-rows:1fr;opacity:1}
.expand>div{overflow:hidden;min-height:0}
.km-row{display:flex;align-items:center;gap:10px;padding-top:12px}
.text-in{height:38px;border-radius:12px;border:0;background:var(--bg);padding:0 12px;font-size:16px;outline:none;width:100%}
.text-in:focus{box-shadow:0 0 0 1.5px var(--accent)}
.km-row .text-in{width:90px}

/* Eintrag */
.entry{width:100%;min-height:150px;resize:none;border:0;outline:none;background:transparent;font-size:16px;line-height:1.7;color:var(--text);padding:0;field-sizing:content;display:block}
.entry::placeholder{color:var(--text-3)}
.entry[readonly]{cursor:text}

/* Details (einklappbar) */
.fold-head{display:flex;align-items:center;gap:10px;width:100%;text-align:left;min-height:32px}
.fold-head .card-sub{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.fold-head .ico{width:18px;height:18px;color:var(--text-3);transition:transform .45s var(--spring)}
.fold.open .fold-head .ico{transform:rotate(180deg)}
.fold-body{padding-top:16px}

/* ─── Dashboard ──────────────────────────────────────────── */
.dash-head{display:flex;align-items:center;gap:10px;flex-wrap:wrap;padding:4px 4px 2px}
.period{flex:1;min-width:0}
@media (max-width:699px){.period{flex-basis:100%;margin-bottom:6px}.dash-head .seg{margin-left:auto}}
.period-label{font-size:28px;font-weight:500;letter-spacing:-.4px;line-height:1.15;white-space:nowrap;overflow:hidden}
.period-label>span{display:inline-block}
.stats{display:grid;grid-template-columns:repeat(2,1fr);gap:8px}
@media (min-width:700px){.stats{grid-template-columns:repeat(4,1fr)}}
.stat{background:var(--surface);border-radius:var(--r-card);padding:16px}
.stat .cl{display:flex;align-items:center;gap:7px;font-size:13px;color:var(--text-2)}
.stat .big{font-size:32px;font-weight:500;letter-spacing:-.5px;margin:10px 0 2px;height:34px;display:flex;align-items:center}
.stat .avg{font-size:12px;color:var(--text-3)}

.chart{position:relative;height:200px;touch-action:pan-y;user-select:none;-webkit-user-select:none;cursor:crosshair}
.chart-cols{position:absolute;inset:0;display:flex;align-items:stretch}
.ccol{flex:1;display:flex;flex-direction:column;align-items:center;min-width:0}
.ccol .up{flex:0 0 74%;display:flex;flex-direction:column-reverse;align-items:center;gap:2px;width:100%;padding:0 var(--gap,3px)}
.ccol .dn{flex:1;display:flex;align-items:flex-start;justify-content:center;width:100%;padding:3px var(--gap,3px) 0}
.seg-b{width:100%;max-width:18px;border-radius:4px;height:0;transition:height .6s var(--spring),opacity .25s}
.chart.dim .ccol:not(.act) .seg-b{opacity:.35}
.axis{position:absolute;left:0;right:0;top:74%;height:1px;background:var(--border)}
.ring{position:absolute;top:-6px;bottom:-6px;left:0;border-radius:10px;border:1.5px solid rgba(255,255,255,.55);opacity:0;pointer-events:none;transition:transform .4s var(--spring),width .4s var(--spring),opacity .2s}
.chart.dim .ring{opacity:1}
.tip{position:absolute;top:-8px;left:0;z-index:3;transform:translate(-50%,-100%);pointer-events:none;opacity:0;background:#fff;color:#111;border-radius:12px;padding:8px 10px;font-size:12px;line-height:1.45;min-width:120px;box-shadow:0 8px 24px rgba(0,0,0,.35);transition:opacity .2s,left .4s var(--spring)}
.chart.dim .tip{opacity:1}
.tip b{display:block;font-weight:600;margin-bottom:2px}
.tip .r{display:flex;align-items:center;gap:6px}
.tip .r span:last-child{margin-left:auto;font-variant-numeric:tabular-nums;padding-left:10px}
.chart-foot{display:flex;justify-content:space-between;font-size:12px;color:var(--text-3);margin-top:12px}
.legend{display:flex;gap:12px;flex-wrap:wrap;font-size:12px;color:var(--text-2);margin-top:12px}
.legend span{display:inline-flex;align-items:center;gap:6px}

.meter-num{display:flex;align-items:baseline;gap:8px;margin-bottom:14px}
.meter-num .big{font-size:30px;font-weight:500;height:32px;display:flex;align-items:center}
.meter-num .of{font-size:13px;color:var(--text-2)}
.meter-bar{display:flex;gap:3px;height:44px}
.meter-bar i{display:block;height:100%;border-radius:8px;flex:0 0 0;min-width:0;transition:flex-basis .7s var(--spring),opacity .25s}
.meter-bar.dim i:not(.hl){opacity:.25}
.meter-legend{display:flex;flex-wrap:wrap;gap:6px;margin-top:14px}
.ml{height:32px;padding:0 12px;border-radius:999px;background:var(--bg);font-size:13px;color:var(--text-2);display:inline-flex;align-items:center;gap:8px}
.ml .c{color:var(--text-3);font-variant-numeric:tabular-nums}
.ml.hl{background:var(--surface-3);color:var(--text)}

.field{display:grid;grid-template-columns:repeat(auto-fill,minmax(14px,1fr));gap:4px}
.field i{aspect-ratio:1;border-radius:4px;background:var(--surface-3);transition:transform .35s var(--spring-pop);cursor:pointer}
.field i:hover{transform:scale(1.35)}
.field i.empty{cursor:default}
.field i.empty:hover{transform:none}

/* ─── Sheet (Datum, Einstellungen): keine Tastatur, darf von unten kommen ─── */
.scrim{position:fixed;inset:0;background:rgba(0,0,0,.5);opacity:0;pointer-events:none;transition:opacity .35s;z-index:70}
.scrim.open{opacity:1;pointer-events:auto}
.sheet{position:fixed;left:50%;bottom:0;z-index:71;width:min(480px,100%);max-height:88vh;display:flex;flex-direction:column;
  background:var(--surface);border-radius:24px 24px 0 0;padding:0 18px calc(env(safe-area-inset-bottom) + 18px);
  transform:translate(-50%,105%);visibility:hidden;transition:transform .5s var(--ease-out),visibility 0s .5s;box-shadow:0 -10px 40px rgba(0,0,0,.4)}
.sheet.open{transform:translate(-50%,0);visibility:visible;transition:transform .5s var(--ease-out),visibility 0s}
.sheet.dragging{transition:none}
@media (min-width:700px){
  .sheet{bottom:auto;top:12vh;border-radius:24px;transform:translate(-50%,8px) scale(.97);opacity:0;padding-bottom:18px;transition:transform .45s var(--spring),opacity .25s,visibility 0s .45s}
  .sheet.open{transform:translate(-50%,0) scale(1);opacity:1;transition:transform .45s var(--spring),opacity .25s,visibility 0s}
  .grab{display:none}
}
.grab{padding:10px 0 6px;touch-action:none;cursor:grab}
.grab::before{content:"";display:block;width:40px;height:5px;margin:0 auto;border-radius:3px;background:var(--border-2)}
.sheet-head{display:flex;align-items:center;gap:6px;margin:10px 0 14px;min-height:36px}
.sheet-head h2{font-size:17px;font-weight:500;margin:0}
.sheet-head .close{margin-left:auto;width:32px;height:32px;background:var(--surface-2)}
.sheet-body{overflow-y:auto;margin:0 -18px;padding:0 18px}
.opt{display:flex;align-items:center;gap:12px;padding:14px;border-radius:16px;background:var(--bg);margin-bottom:8px;width:100%;text-align:left}
.opt p{margin:0;font-size:13px;color:var(--text-2)}
.opt strong{font-weight:500;display:block}

/* Datumswähler */
.dp-title{font-size:17px;font-weight:500;display:inline-flex;align-items:center;gap:4px;height:36px;padding:0 10px;margin-left:-10px;border-radius:999px}
.dp-title:hover{background:var(--surface-2)}
.dp-title .ico{width:16px;height:16px;color:var(--text-3);transition:transform .4s var(--spring)}
.dp-title.up .ico{transform:rotate(180deg)}
.dp-nav{display:flex;gap:4px;margin-left:auto}
.dp-nav .icon-btn{width:32px;height:32px;background:var(--surface-2)}
.dp-stage{position:relative;touch-action:pan-y;min-height:300px}
.dp-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:3px}
.dp-wd{font-size:11px;color:var(--text-3);text-align:center;padding-bottom:6px;text-transform:uppercase;letter-spacing:.4px}
.dp-d{aspect-ratio:1;max-height:52px;border-radius:13px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;font-size:15px;font-variant-numeric:tabular-nums}
.dp-d:hover{background:var(--surface-2)}
.dp-d i{width:5px;height:5px;border-radius:50%;background:transparent}
.dp-d.today{color:var(--accent);font-weight:600}
.dp-d.sel{background:#fff;color:#111}
.dp-d.fut{opacity:.28;pointer-events:none}
.dp-d.out{visibility:hidden}
.dp-cells{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.dp-c{height:68px;border-radius:16px;background:var(--bg);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;font-size:15px}
.dp-c:hover{background:var(--surface-2)}
.dp-c.sel{background:#fff;color:#111}
.dp-c.fut{opacity:.28;pointer-events:none}
.dp-c .bar{width:36px;height:3px;border-radius:2px;background:var(--surface-3);overflow:hidden}
.dp-c .bar b{display:block;height:100%;background:var(--accent)}
.dp-c.sel .bar{background:#ddd}
.dp-foot{display:flex;gap:8px;margin-top:14px}

/* ─── Vollfläche Schreibmodus: an sichtbaren Bereich gebunden ─── */
.fs{position:fixed;left:0;right:0;top:var(--vvt);height:var(--vvh)}

/* ─── Suche als eigene Seite ─────────────────────────────── */
.view{--px:16px}
@media (min-width:1056px){ .view{--px:28px} }
#v-search{max-width:760px;padding-top:0}
.s-bar{position:sticky;top:0;z-index:5;background:var(--bg);margin:0 calc(-1*var(--px));padding:calc(env(safe-area-inset-top) + 16px) var(--px) 10px;transition:box-shadow .2s}
.s-bar.stuck{box-shadow:0 1px 0 var(--border)}
.s-title{font-size:28px;font-weight:500;letter-spacing:-.4px;line-height:1.15;margin:4px 4px 12px}
.search-box{display:flex;align-items:center;gap:10px;height:48px;padding:0 8px 0 14px;border-radius:16px;background:var(--surface);transition:box-shadow .2s}
.search-box:focus-within{box-shadow:0 0 0 1.5px var(--accent)}
.search-box .ico{width:18px;height:18px;color:var(--text-3);flex-shrink:0}
.search-box input{flex:1;min-width:0;border:0;outline:0;background:transparent;font-size:16px}
.search-box .clr{width:30px;height:30px;border-radius:50%;display:grid;place-items:center;color:var(--text-3);background:var(--surface-2);font-size:12px;transition:opacity .2s,transform .35s var(--spring-pop)}
.search-box .clr[hidden]{display:grid;opacity:0;transform:scale(.5);pointer-events:none}
.filters{display:flex;flex-wrap:wrap;gap:6px}
.filters:not(:empty){padding-top:10px}
.fchip{height:30px;padding:0 6px 0 12px;border-radius:999px;background:var(--accent-bg);color:var(--accent);font-size:13px;display:inline-flex;align-items:center;gap:6px;animation:pop .45s var(--spring-pop)}
.fchip .pt{opacity:.65}
.fchip button{width:22px;height:22px;border-radius:50%;display:grid;place-items:center;font-size:11px}
.fchip button:hover{background:rgba(253,147,159,.18)}
@keyframes pop{from{transform:scale(.6);opacity:0}}
.sugg{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;margin:0 calc(-1*var(--px));padding:10px var(--px) 0}
.sugg::-webkit-scrollbar{display:none}
.sugg:empty{display:none}
@media (min-width:700px){.sugg{flex-wrap:wrap;margin:0;padding:10px 0 0}}
.sg{flex-shrink:0;height:32px;padding:0 12px;border-radius:999px;background:var(--surface);font-size:14px;color:var(--text-2);display:inline-flex;align-items:center;gap:6px;animation:pop .35s var(--spring-pop) backwards}
.sg:hover{color:var(--text);background:var(--surface-2)}
.sg .pt{font-size:11px;color:var(--text-3);text-transform:uppercase;letter-spacing:.4px}
.sg .c{font-size:12px;color:var(--text-3);font-variant-numeric:tabular-nums}
.sg.ctx{background:var(--surface-2);color:var(--text)}
mark{background:var(--accent-bg);color:var(--accent);border-radius:3px;padding:0 1px}
.s-meta{display:flex;align-items:center;gap:10px;font-size:13px;color:var(--text-2);padding:2px 4px;min-height:36px}
.s-meta .seg{background:var(--surface)}
.hits{display:flex;flex-direction:column;gap:6px}
.hit{display:block;width:100%;text-align:left;padding:13px 15px;border-radius:16px;background:var(--surface);animation:rise .45s var(--spring) backwards}
.hit:hover{background:var(--surface-2)}
@keyframes rise{from{opacity:0;transform:translateY(8px)}}
.hit .hd{font-size:12px;font-weight:600;color:var(--accent);letter-spacing:.3px}
.hit .ht{font-size:15px;color:var(--text);margin-top:3px;line-height:1.55}
.hit .hm{font-size:13px;color:var(--text-3);margin-top:4px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.more{height:44px;border-radius:14px;background:var(--surface);color:var(--text-2);font-size:14px;margin-top:4px}
.syntax{font-size:13px;color:var(--text-3);line-height:1.9;padding:6px 4px}
.syntax code{font-family:ui-monospace,monospace;font-size:12px;background:var(--surface);padding:2px 6px;border-radius:6px;color:var(--text-2)}
.s-foot{display:flex;align-items:center;justify-content:center;gap:8px;font-size:12px;color:var(--text-3);padding:18px 0 4px}
.s-foot .dot{width:6px;height:6px;border-radius:50%;background:var(--good)}

/* ─── Eintrag: Namen, Zitate, Vorschau ───────────────────── */
.fmt{display:flex;gap:2px;margin-left:auto;align-items:center}
.fmt-btn{width:34px;height:34px;border-radius:10px;display:grid;place-items:center;color:var(--text-3)}
.fmt-btn:hover{background:var(--surface-2);color:var(--text)}
.fmt-btn .ico{width:17px;height:17px}
.fmt-btn.on{color:var(--accent);background:var(--accent-bg)}
.fmt-sep{width:1px;height:18px;background:var(--border-2);margin:0 6px}
.entry-prev{font-size:16px;line-height:1.7;white-space:pre-wrap;overflow-wrap:break-word;hyphens:auto;min-height:150px;cursor:text}
.entry-prev .ph{color:var(--text-3)}
.entry[hidden],.entry-prev[hidden]{display:none}
input[type=search]::-webkit-search-cancel-button{display:none}
input[type=search]{-webkit-appearance:none;appearance:none}
.rn{text-transform:uppercase;font-size:.84em;letter-spacing:.05em}
.rq{font-style:italic;color:var(--text-2)}
.hit .rq{color:inherit}
@media (hover:none) and (pointer:coarse){ #entryCard .fmt{display:none} }

/* ─── Schreiben als eigene Seite (Mobile) ───────────────── */
#v-write{padding-top:0;max-width:720px;gap:0}
.w-bar{position:sticky;top:0;z-index:5;background:var(--bg);margin:0 calc(-1*var(--px));padding:calc(env(safe-area-inset-top) + 10px) var(--px) 10px;display:flex;align-items:center;gap:8px;transition:box-shadow .2s}
.w-bar.stuck{box-shadow:0 1px 0 var(--border)}
.w-bar .t{font-size:17px;font-weight:500;line-height:1.25}
.w-bar .card-sub{font-size:12px}
.w-bar .fmt{margin-left:auto}
.w-ta{width:100%;min-height:50vh;border:0;outline:0;background:transparent;resize:none;font-size:17px;line-height:1.7;color:var(--text);padding:10px 2px 45vh;display:block;overflow:hidden;field-sizing:content}
.w-ta::placeholder{color:var(--text-3)}
</style>
</head>
<body>

<div class="island" id="island" role="status" aria-live="polite"><span class="dot"></span><span id="islandText">Demo-Daten</span></div>

<main>
  <!-- ═══════════════ ERFASSEN ═══════════════ -->
  <section class="view" id="v-entry" aria-label="Erfassen">
    <header class="day-head" id="dayHead">
      <div class="day-title" id="dayTitle" role="button" tabindex="0" aria-label="Datum wählen"><div id="dayTitleInner">
        <div class="day-wd" id="dayWd"></div>
        <div class="day-date"><span id="dayDate"></span><svg class="ico" viewBox="0 0 24 24"><path d="m6 9 6 6 6-6"/></svg></div>
      </div></div>
      <div class="day-nav">
        <button class="pill pill-accent press today-pill" id="todayBtn" hidden>Heute</button>
        <button class="icon-btn press" id="prevDay" aria-label="Vorheriger Tag"><svg class="ico" viewBox="0 0 24 24"><path d="M15 18l-6-6 6-6"/></svg></button>
        <button class="icon-btn press" id="nextDay" aria-label="Nächster Tag"><svg class="ico" viewBox="0 0 24 24"><path d="M9 18l6-6-6-6"/></svg></button>
      </div>
    </header>
    <div class="strip" id="strip" aria-label="Tage"></div>

    <div class="grid-2">
      <div class="col">
        <div class="card">
          <div class="card-head"><span class="card-title">Konsum</span></div>
          <div class="counters" id="counters"></div>
        </div>
        <div class="card">
          <div class="mood-top"><span class="mood-val" id="moodVal"><span class="roll"></span></span><span class="mood-word" id="moodWord"></span>
            <span class="label" style="margin-left:auto">Stimmung</span></div>
          <div class="slider" id="mood" role="slider" tabindex="0" aria-label="Stimmung" aria-valuemin="-2" aria-valuemax="2"><div class="track"></div><div class="knob"></div></div>
          <div class="ticks"><span>−2</span><span>−1</span><span>0</span><span>+1</span><span>+2</span></div>
        </div>
        <div class="card">
          <div class="chip-group"><span class="label">Ort</span><div data-g="locations"></div></div>
          <div class="chip-group"><span class="label">Land <span class="hint">mehrfach tippen für Reihenfolge</span></span><div data-g="countries"></div></div>
          <div class="chip-group"><span class="label">Kaffee <span class="hint" id="coffeeHint"></span></span><div data-g="coffeeLocations"></div></div>
        </div>
        <div class="card">
          <div class="chip-group"><span class="label">Sport</span><div data-g="sport"></div>
            <div class="expand" id="kmWrap"><div><div class="km-row"><span class="label">Velo</span>
              <input class="text-in" id="km" type="number" inputmode="numeric" min="0" placeholder="km" enterkeyhint="done"><span class="card-sub">km</span></div></div></div>
          </div>
        </div>
      </div>
      <div class="col">
        <div class="card" id="entryCard">
          <div class="card-head"><span class="card-title">Eintrag</span><span class="card-sub" id="wordCount"></span>
            <div class="fmt">
            <button class="fmt-btn" data-fmt="name" title="Name markieren [[…]]" aria-label="Name markieren"><svg class="ico" viewBox="0 0 24 24"><circle cx="12" cy="8" r="4"/><path d="M4 21c0-4 4-6 8-6s8 2 8 6"/></svg></button>
            <button class="fmt-btn" data-fmt="quote" title="Zitat markieren" aria-label="Zitat markieren"><svg class="ico" viewBox="0 0 24 24"><path d="M7 7h4v4c0 3-1.5 5-4 6M15 7h4v4c0 3-1.5 5-4 6"/></svg></button>
            <span class="fmt-sep"></span><button class="fmt-btn" id="prevBtn" title="Vorschau" aria-label="Vorschau" aria-pressed="false"><svg class="ico" viewBox="0 0 24 24"><path d="M1 12s4-7 11-7 11 7 11 7-4 7-11 7S1 12 1 12z"/><circle cx="12" cy="12" r="3"/></svg></button></div></div>
          <textarea class="entry" id="entry" placeholder="Was war heute?" rows="6"></textarea>
          <div class="entry-prev" id="entryPrev" hidden></div>
        </div>
        <div class="card fold" id="details">
          <button class="fold-head" id="foldBtn" aria-expanded="false"><span class="card-title">Details</span><span class="card-sub" id="foldSum"></span>
            <svg class="ico" viewBox="0 0 24 24"><path d="m6 9 6 6 6-6"/></svg></button>
          <div class="expand" id="foldBody"><div><div class="fold-body">
            <div class="chip-group"><span class="label">Spezifische Orte</span><div data-g="places"></div></div>
            <div class="chip-group"><span class="label">Personen</span><div data-g="people"></div></div>
            <div class="chip-group"><span class="label">Tags</span><div data-g="tags"></div></div>
            <div class="chip-group"><span class="label">Koordinaten</span><input class="text-in" id="coords" placeholder="47.3769, 8.5417" inputmode="decimal" enterkeyhint="done"></div>
          </div></div></div>
        </div>
      </div>
    </div>
    <div id="datalists" hidden></div>
  </section>

  <!-- ═══════════════ DASHBOARD ═══════════════ -->
  <section class="view" id="v-dash" aria-label="Dashboard" hidden>
    <header class="dash-head">
      <div class="period"><div class="period-label"><span id="periodLabel"></span></div></div>
      <button class="icon-btn press" id="prevPer" aria-label="Zurück"><svg class="ico" viewBox="0 0 24 24"><path d="M15 18l-6-6 6-6"/></svg></button>
      <button class="icon-btn press" id="nextPer" aria-label="Weiter"><svg class="ico" viewBox="0 0 24 24"><path d="M9 18l6-6-6-6"/></svg></button>
      <div class="seg" id="perSeg" role="tablist"><span class="thumb"></span>
        <button role="tab" data-v="week">Woche</button><button role="tab" data-v="month">Monat</button><button role="tab" data-v="year">Jahr</button></div>
    </header>
    <div class="stats" id="stats"></div>
    <div class="grid-2">
      <div class="col">
        <div class="card">
          <div class="card-head"><div><div class="card-title">Konsum</div><div class="card-sub" id="chartSub"></div></div></div>
          <div class="chart" id="chart"><div class="axis"></div><div class="ring" id="ring"></div><div class="tip" id="tip"></div><div class="chart-cols" id="chartCols"></div></div>
          <div class="chart-foot" id="chartFoot"></div>
          <div class="legend">
            <span><i class="sw" style="background:var(--c-coffee)"></i>Kaffee</span><span><i class="sw" style="background:var(--c-apple)"></i>Äpfel</span>
            <span><i class="sw" style="background:var(--c-banana)"></i>Bananen</span><span><i class="sw" style="background:#888"></i>Stimmung</span>
          </div>
        </div>
      </div>
      <div class="col">
        <div class="card">
          <div class="card-head"><span class="card-title">Verteilung</span>
            <div class="seg" id="meterSeg" role="tablist"><span class="thumb"></span>
              <button role="tab" data-v="sport">Sport</button><button role="tab" data-v="locations">Orte</button><button role="tab" data-v="coffeeLocations">Kaffee</button><button role="tab" data-v="people">Leute</button></div>
          </div>
          <div class="meter-num"><span class="big" id="meterBig"><span class="roll"></span></span><span class="of" id="meterOf"></span></div>
          <div class="meter-bar" id="meterBar"></div>
          <div class="meter-legend" id="meterLegend"></div>
        </div>
        <div class="card">
          <div class="card-head"><div><div class="card-title">Stimmung</div><div class="card-sub" id="moodSub"></div></div>
            <span style="margin-left:auto;font-size:24px;font-weight:500" id="moodAvg"><span class="roll"></span></span></div>
          <div class="field" id="field"></div>
        </div>
      </div>
    </div>
  </section>
  <!-- ═══════════════ SUCHE ═══════════════ -->
  <section class="view" id="v-search" aria-label="Suche" hidden>
    <div class="s-bar" id="sBar">
      <div class="s-title">Suche</div>
      <label class="search-box"><svg class="ico" viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
        <input id="q" type="search" placeholder="Suchen oder tag:, ort:, person: …" autocomplete="off" autocapitalize="off" spellcheck="false" enterkeyhint="search">
        <button class="clr" id="qClear" aria-label="Leeren" hidden>✕</button></label>
      <div class="filters" id="filters"></div>
      <div class="sugg" id="sugg"></div>
    </div>
    <div class="s-meta" id="sMeta"><span id="qCount"></span>
      <div class="seg" id="sortSeg" role="tablist"><span class="thumb"></span><button role="tab" data-v="new">Neueste</button><button role="tab" data-v="old">Älteste</button></div></div>
    <div class="hits" id="hits"></div>
    <div class="s-foot" id="indexInfo"></div>
  </section>
  <!-- ═══════════════ SCHREIBEN (Mobile, eigene Seite) ═══════════════ -->
  <section class="view" id="v-write" aria-label="Eintrag schreiben" hidden>
    <div class="w-bar" id="wBar">
      <div><div class="t" id="writerDate"></div><div class="card-sub" id="writerCount"></div></div>
      <div class="fmt">
            <button class="fmt-btn" data-fmt="name" title="Name markieren [[…]]" aria-label="Name markieren"><svg class="ico" viewBox="0 0 24 24"><circle cx="12" cy="8" r="4"/><path d="M4 21c0-4 4-6 8-6s8 2 8 6"/></svg></button>
            <button class="fmt-btn" data-fmt="quote" title="Zitat markieren" aria-label="Zitat markieren"><svg class="ico" viewBox="0 0 24 24"><path d="M7 7h4v4c0 3-1.5 5-4 6M15 7h4v4c0 3-1.5 5-4 6"/></svg></button>
            </div>

    <textarea class="w-ta" id="writerTa" placeholder="Was war heute?"></textarea>

</main>

<!-- ═══════════════ DOCK ═══════════════ -->

  <nav class="dock" id="dock" aria-label="Navigation">
    <div class="dock-tip" id="dockTip"></div>
    <button class="dock-item" data-go="entry" data-tip="Erfassen" aria-label="Erfassen" aria-current="page"><svg class="ico" viewBox="0 0 24 24"><path d="M12 20h9"/><path d="M16.5 3.5a2.1 2.1 0 0 1 3 3L7 19l-4 1 1-4Z"/></svg></button>
    <button class="dock-item" data-go="dash" data-tip="Dashboard" aria-label="Dashboard"><svg class="ico" viewBox="0 0 24 24"><path d="M4 20V10M10 20V4M16 20v-7M22 20H2"/></svg></button>

    <button class="dock-item" data-act="settings" data-tip="Einstellungen" aria-label="Einstellungen"><svg class="ico" viewBox="0 0 24 24"><path d="M4 7h10M18 7h2M4 17h4M12 17h8"/><circle cx="16" cy="7" r="2"/><circle cx="10" cy="17" r="2"/></svg></button>
  </nav>
</div>

<!-- ═══════════════ SHEET ═══════════════ -->
<div class="scrim" id="scrim"></div>
<div class="sheet" id="sheet" role="dialog" aria-modal="true"><div class="grab" id="grab"></div><div id="sheetContent"></div></div>



<script>
/* ═══════════════════════════════════════════════════════════
   Hilfsfunktionen
   ═══════════════════════════════════════════════════════════ */
const $ = s => document.querySelector(s);
const root = document.documentElement;
const pad = n => String(n).padStart(2,'0');
const iso = d => `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
const parse = s => new Date(s+'T12:00:00');
const addDays = (s,n) => { const d=parse(s); d.setDate(d.getDate()+n); return iso(d); };
const TODAY = iso(new Date());
const WD = ['Sonntag','Montag','Dienstag','Mittwoch','Donnerstag','Freitag','Samstag'];
const WD2 = ['So','Mo','Di','Mi','Do','Fr','Sa'];
const MON = ['Januar','Februar','März','April','Mai','Juni','Juli','August','September','Oktober','November','Dezember'];
const MON3 = ['Jan','Feb','Mär','Apr','Mai','Jun','Jul','Aug','Sep','Okt','Nov','Dez'];
const fmt1 = n => (Math.round(n*10)/10).toLocaleString('de-CH',{minimumFractionDigits:1,maximumFractionDigits:1});
const fmt0 = n => Math.round(n).toLocaleString('de-CH');
const esc = s => String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const reEsc = s => s.replace(/[.*+?^${}()|[\]\\]/g,'\\$&');
const SPRING = CSS.supports('transition-timing-function','linear(0, 1)') ? getComputedStyle(root).getPropertyValue('--spring').trim() : 'cubic-bezier(.32,.72,0,1)';
const REDUCED = matchMedia('(prefers-reduced-motion: reduce)').matches;
const FINE = matchMedia('(hover:hover) and (pointer:fine)').matches;
const TOUCH = matchMedia('(hover:none) and (pointer:coarse)').matches;

const MOOD_COL = {'-2':'#e57373','-1.5':'#ef9a9a','-1':'#ffcc80','-0.5':'#9aa0a6','0':'#a0a0a0','0.5':'#a5d6a7','1':'#81c784','1.5':'#66bb6a','2':'#43a047'};
const MOOD_WORD = {'-2':'schwer','-1.5':'zäh','-1':'durchzogen','-0.5':'etwas flau','0':'neutral','0.5':'ok','1':'gut','1.5':'sehr gut','2':'grossartig'};
const moodKey = v => String(Math.round(v*2)/2).replace(/^-0$/,'0');

function roll(el, text){
  text = String(text);
  let r = el.classList.contains('roll') ? el : el.querySelector('.roll');
  if(!r){ r = document.createElement('span'); r.className='roll'; el.appendChild(r); }
  const shape = text.replace(/\d/g,'0');
  if(r.dataset.shape !== shape){
    r.dataset.shape = shape;
    r.innerHTML = [...text].map(ch => /\d/.test(ch)
      ? `<span class="d"><span>${'0123456789'.split('').map(x=>`<i>${x}</i>`).join('')}</span></span>`
      : `<span class="s">${ch===' '?'&nbsp;':esc(ch)}</span>`).join('');
    r.offsetWidth;
  }
  r.setAttribute('aria-label', text);
  const cols = r.querySelectorAll('.d>span'); let k = 0;
  [...text].forEach(ch => { if(/\d/.test(ch)){ const c = cols[k]; c.style.transitionDelay=(k*35)+'ms'; c.style.transform=`translateY(${-ch}em)`; k++; } });
}

function segInit(seg, value, onChange){
  const thumb = seg.querySelector('.thumb');
  const place = (animate=true) => {
    const b = seg.querySelector('[aria-selected="true"]'); if(!b || !b.offsetWidth) return;
    if(!animate) thumb.style.transition='none';
    thumb.style.width = b.offsetWidth+'px'; thumb.style.transform = `translateX(${b.offsetLeft}px)`;
    if(!animate){ thumb.offsetWidth; thumb.style.transition=''; }
  };
  const set = (v, animate=true) => { seg.querySelectorAll('button').forEach(b=>b.setAttribute('aria-selected', b.dataset.v===v)); place(animate); };
  seg.addEventListener('click', e => { const b=e.target.closest('button'); if(!b) return; set(b.dataset.v); onChange(b.dataset.v); });
  set(value,false); new ResizeObserver(()=>place(false)).observe(seg);
  return set;
}

function go(v, onShown){
  if(v===view){ if(v==='search') $('#q').focus(); else scrollTo({top:0,behavior:'smooth'}); return; }
  const from=$('#v-'+view), to=$('#v-'+v), dir=ORDER.indexOf(v)>ORDER.indexOf(view)?1:-1;
  scrollMem[view]=scrollY; view=v; document.activeElement?.blur();
  if(v==='search'&&searchDirty) renderSearch();
  const nav=v==='write'?'entry':v; document.querySelectorAll('[data-go]').forEach(b=>b.dataset.go===nav?b.setAttribute('aria-current','page'):b.removeAttribute('aria-current'));
  if(v==='dash' && dashDirty) renderDash(true);
  const swap=()=>{ from.hidden=true; to.hidden=false; scrollTo(0,scrollMem[v]); if(v==='dash') requestAnimationFrame(growBars); onShown&&onShown(); };
  if(REDUCED||!to.animate){ swap(); return; }
  if(onShown&&TOUCH){ // sofort tauschen, damit der Fokus im selben Tipp passiert und iOS die Tastatur öffnet
    swap(); to.animate([{opacity:0,transform:`translateX(${dir*40}px)`},{opacity:1,transform:'none'}],{duration:520,easing:SPRING}); return; }
  from.animate([{opacity:1,transform:'none',filter:'blur(0)'},{opacity:0,transform:`translateX(${-dir*40}px)`,filter:'blur(4px)'}],{duration:160,easing:'ease-in'})
    .onfinish=()=>{ swap(); to.animate([{opacity:0,transform:`translateX(${dir*60}px)`,filter:'blur(4px)'},{opacity:1,transform:'none',filter:'blur(0)'}],{duration:620,easing:SPRING}); };
}
(function dock(){
  const dockEl=$('#dock'), items=[...dockEl.querySelectorAll('.dock-item')], tip=$('#dockTip');
  const MAG=1.32, LIFT=8, REACH=2; let mx=null, cur=items.map(()=>1), raf=null;
  function frame(){
    let moving=false;
    items.forEach((it,i)=>{ let target=1;
      if(mx!==null){ const r=it.getBoundingClientRect(), d=Math.abs(mx-(r.left+r.width/2))/r.width; target=1+(MAG-1)*Math.max(0,1-d/REACH)**1.6; }
      cur[i]+=(target-cur[i])*.22; if(Math.abs(target-cur[i])>.001) moving=true;
      it.style.transform=`translateY(${-(cur[i]-1)/(MAG-1)*LIFT}px) scale(${cur[i].toFixed(4)})`; });
    raf=moving?requestAnimationFrame(frame):null;
  }
  const kick=()=>{ if(!raf) raf=requestAnimationFrame(frame); };
  if(FINE&&!REDUCED){ dockEl.addEventListener('pointermove',e=>{mx=e.clientX;kick();}); dockEl.addEventListener('pointerleave',()=>{mx=null;kick();tip.classList.remove('show');}); }
  items.forEach(it=>{
    it.addEventListener('pointerenter',()=>{ if(!FINE) return; tip.textContent=it.dataset.tip;
      const left=it.offsetLeft+it.offsetWidth/2-tip.offsetWidth/2;
      if(!tip.classList.contains('show')){ tip.style.transition='none'; tip.style.left=left+'px'; tip.offsetWidth; tip.style.transition=''; }
      tip.style.left=left+'px'; tip.classList.add('show'); });
    it.addEventListener('click',()=>{
      if(it.dataset.go==='search') openSearch(); else if(it.dataset.go) go(it.dataset.go);
      if(it.dataset.act==='settings') openSettings();
      if(it.animate&&!REDUCED) it.animate([{translate:'0 0'},{translate:'0 -6px'},{translate:'0 0'}],{duration:420,easing:'cubic-bezier(.3,1.6,.5,1)'});
    });
  });
})();

function foldSummary(e){
  const bits=[e.places.length&&`${e.places.length} ${e.places.length>1?'Orte':'Ort'}`, e.people.length&&e.people.join(', '), e.tags.length&&e.tags.map(t=>'#'+t).join(' '), e.coords&&'📍'].filter(Boolean);
  $('#foldSum').textContent=bits.join(' · ')||'Orte, Personen, Tags, Koordinaten';
}
function setFold(open){ $('#details').classList.toggle('open',open); $('#foldBody').classList.toggle('open',open); $('#foldBtn').setAttribute('aria-expanded',open); try{ localStorage.setItem('abkFold',open?'1':''); }catch{} }
$('#foldBtn').onclick=()=>setFold(!$('#details').classList.contains('open'));

/* Eintrag: Desktop inline, Mobile im Schreibmodus über der Tastatur */
function autosize(t){ if(CSS.supports('field-sizing','content')) return; t.style.height='auto'; t.style.height=t.scrollHeight+'px'; }
const words=s=>(s.trim().match(/\S+/g)||[]).length;
function wordCount(){ const n=words(plain($('#entry').value)); $('#wordCount').textContent=n?n+' Wörter':''; }
$('#entry').addEventListener('input',e=>{ autosize(e.target); wordCount(); if(previewOn) renderPrev(); touch({...entryFor(cur),text:e.target.value}); });

/* Format wie bisher: Name = [[…]], Zitat = <span class="quote">…</span> */
const MARK={name:['[[',']]'],quote:['<span class="quote">','</span>']};
const plain=s=>s.replace(/<span class="quote">([\s\S]*?)<\/span>/g,'$1').replace(/\[\[([^\]]+)\]\]/g,'$1');
function renderRich(raw){
  return raw.replace(/<span class="quote">([\s\S]*?)<\/span>/g,'\x00Q\x00$1\x00q\x00').replace(/\[\[([^\]]+)\]\]/g,'\x00N\x00$1\x00n\x00')
    .replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')
    .replace(/\x00Q\x00([\s\S]*?)\x00q\x00/g,'<span class="rq">$1</span>').replace(/\x00N\x00(.*?)\x00n\x00/g,'<span class="rn">$1</span>');
}
function wrap(ta,type){
  const [L,R]=MARK[type], v=ta.value; let a=ta.selectionStart, b=ta.selectionEnd;
  if(v.slice(a-L.length,a)===L&&v.slice(b,b+R.length)===R){ // schon markiert → Markierung entfernen
    ta.setRangeText(v.slice(a,b),a-L.length,b+R.length,'select');
  } else {
    if(a===b&&type==='name'){ a-=v.slice(0,a).match(/[\p{L}\p{N}_-]*$/u)[0].length; b+=v.slice(b).match(/^[\p{L}\p{N}_-]*/u)[0].length; } // Wort unter dem Cursor
    const sel=v.slice(a,b); ta.setRangeText(L+sel+R,a,b,'end'); ta.setSelectionRange(a+L.length,a+L.length+sel.length);
  }
  ta.focus({preventScroll:true}); ta.dispatchEvent(new Event('input',{bubbles:true}));
}
document.querySelectorAll('.fmt-btn[data-fmt]').forEach(b=>{
  b.addEventListener('pointerdown',e=>e.preventDefault()); // Fokus und Auswahl im Textfeld behalten
  b.addEventListener('click',()=>{ const inWriter=!!b.closest('#v-write'); if(!inWriter&&previewOn) setPreview(false); wrap(inWriter?$('#writerTa'):$('#entry'), b.dataset.fmt); });
});
let previewOn=false; try{ previewOn=localStorage.getItem('previewMode')==='true'; }catch{}
function renderPrev(){ const v=$('#entry').value; $('#entryPrev').innerHTML=v.trim()?renderRich(v):'<span class="ph">Was war heute?</span>'; }
function setPreview(on, animate=true){
  previewOn=on||TOUCH; try{ if(!TOUCH) localStorage.setItem('previewMode',on); }catch{}
  const ta=$('#entry'), pv=$('#entryPrev'); renderPrev();
  $('#prevBtn').classList.toggle('on',on); $('#prevBtn').setAttribute('aria-pressed',on);
  const show=previewOn?pv:ta; ta.hidden=previewOn; pv.hidden=!previewOn;
  if(animate&&!REDUCED&&show.animate) show.animate([{opacity:0,filter:'blur(3px)'},{opacity:1,filter:'blur(0)'}],{duration:300,easing:'ease-out'});
}
$('#prevBtn').onclick=()=>setPreview(!previewOn);
$('#entryPrev').addEventListener('click',()=>{ if(TOUCH) openWriter(); else { setPreview(false); $('#entry').focus(); } });

function writerCount(){ const n=words(plain($('#writerTa').value)); $('#writerCount').textContent=n?n+' Wörter':'Neuer Eintrag'; }
function openWriter(){
  const ta=$('#writerTa'); ta.value=$('#entry').value; $('#writerDate').textContent=fmtDay(cur); writerCount();
  scrollMem.write=0;
  go('write',()=>{ autosize(ta); ta.focus({preventScroll:true}); ta.setSelectionRange(ta.value.length,ta.value.length); }); // Fokus im selben Tipp → iOS öffnet Tastatur
}
function closeWriter(){ if(view!=='write') return; $('#writerTa').blur(); go('entry'); }
$('#writerTa').addEventListener('input',e=>{ autosize(e.target); writerCount(); $('#entry').value=e.target.value; wordCount(); renderPrev(); touch({...entryFor(cur),text:e.target.value}); });
$('#writerDone').onclick=closeWriter;
addEventListener('scroll',()=>{ if(view==='write') $('#wBar').classList.toggle('stuck',scrollY>4); },{passive:true});

/* ═══════════════════════════════════════════════════════════
   DATUMSWÄHLER – Tage → Monate → Jahre, wischen wechselt Monat
   ═══════════════════════════════════════════════════════════ */
let dpY, dpM, dpMode='days';
function openDatePicker(){
  const d=parse(cur); dpY=d.getFullYear(); dpM=d.getMonth(); dpMode='days';
  openSheet(`<div class="sheet-head"><button class="dp-title" id="dpTitle"><span id="dpLabel"></span><svg class="ico" viewBox="0 0 24 24"><path d="m6 9 6 6 6-6"/></svg></button>
    <div class="dp-nav"><button class="icon-btn press" id="dpPrev" aria-label="Zurück"><svg class="ico" viewBox="0 0 24 24"><path d="M15 18l-6-6 6-6"/></svg></button>
    <button class="icon-btn press" id="dpNext" aria-label="Weiter"><svg class="ico" viewBox="0 0 24 24"><path d="M9 18l6-6-6-6"/></svg></button></div></div>
    <div class="dp-stage" id="dpStage"><div id="dpBody"></div></div>
    <div class="dp-foot"><button class="pill pill-accent press" id="dpToday">Heute</button><button class="pill press" style="background:var(--surface-2)" id="dpLast">Letzter Eintrag</button></div>`);
  renderDp(0);
  $('#dpTitle').onclick=()=>{ dpMode=dpMode==='days'?'months':dpMode==='months'?'years':'days'; renderDp(0,true); };
  $('#dpPrev').onclick=()=>dpShift(-1); $('#dpNext').onclick=()=>dpShift(1);
  $('#dpToday').onclick=()=>pickDay(TODAY);
  $('#dpLast').onclick=()=>{ const last=[...DATA.keys()].filter(d=>d<=TODAY).sort().pop(); if(last) pickDay(last); };
  $('#dpBody').onclick=e=>{ const b=e.target.closest('[data-pick]'); if(!b) return; const [kind,val]=b.dataset.pick.split(':');
    if(kind==='d') pickDay(val);
    if(kind==='m'){ dpM=+val; dpMode='days'; renderDp(0,true); }
    if(kind==='y'){ dpY=+val; dpMode='months'; renderDp(0,true); } };
  let x0=null; const st=$('#dpStage');
  st.onpointerdown=e=>{ x0=e.clientX; }; st.onpointerup=e=>{ if(x0===null) return; const dx=e.clientX-x0; x0=null; if(Math.abs(dx)>40) dpShift(dx<0?1:-1); };
}
function pickDay(d){ closeSheet(); setTimeout(()=>{ if(view!=='entry') go('entry'); setDay(d); }, 120); }
function dpShift(n){
  if(dpMode==='days'){ dpM+=n; if(dpM<0){dpM=11;dpY--;} if(dpM>11){dpM=0;dpY++;} }
  else if(dpMode==='months') dpY+=n; else dpY+=12*n;
  renderDp(n);
}
function renderDp(dir=0, zoom=false){
  const body=$('#dpBody');
  const draw=()=>{
    $('#dpTitle').classList.toggle('up',dpMode!=='days');
    if(dpMode==='days'){
      $('#dpLabel').textContent=`${MON[dpM]} ${dpY}`;
      const first=new Date(dpY,dpM,1), off=(first.getDay()+6)%7, n=new Date(dpY,dpM+1,0).getDate(); let h='';
      ['Mo','Di','Mi','Do','Fr','Sa','So'].forEach(w=>h+=`<div class="dp-wd">${w}</div>`);
      for(let i=0;i<off;i++) h+='<div class="dp-d out"></div>';
      for(let i=1;i<=n;i++){ const d=`${dpY}-${pad(dpM+1)}-${pad(i)}`, e=DATA.get(d);
        h+=`<button class="dp-d${d===cur?' sel':''}${d===TODAY?' today':''}${d>TODAY?' fut':''}" data-pick="d:${d}">${i}<i style="background:${e?MOOD_COL[moodKey(e.mood)]:'transparent'}"></i></button>`; }
      body.innerHTML=`<div class="dp-grid">${h}</div>`;
    } else if(dpMode==='months'){
      $('#dpLabel').textContent=String(dpY);
      body.innerHTML=`<div class="dp-cells">${MON3.map((m,i)=>{ const pre=`${dpY}-${pad(i+1)}`; let c=0; DATA.forEach((_,d)=>{ if(d.startsWith(pre)) c++; });
        const days=new Date(dpY,i+1,0).getDate(), fut=`${pre}-01`>TODAY, sel=dpY===parse(cur).getFullYear()&&i===parse(cur).getMonth();
        return `<button class="dp-c${sel?' sel':''}${fut?' fut':''}" data-pick="m:${i}">${m}<span class="bar"><b style="width:${c/days*100}%"></b></span></button>`; }).join('')}</div>`;
    } else {
      const start=Math.floor(dpY/12)*12, ty=+TODAY.slice(0,4);
      $('#dpLabel').textContent=`${start}–${start+11}`;
      body.innerHTML=`<div class="dp-cells">${Array.from({length:12},(_,i)=>{ const y=start+i; let c=0; DATA.forEach((_,d)=>{ if(d.startsWith(y+'-')) c++; });
        return `<button class="dp-c${y===parse(cur).getFullYear()?' sel':''}${y>ty?' fut':''}" data-pick="y:${y}">${y}<span class="bar"><b style="width:${Math.min(100,c/365*100)}%"></b></span></button>`; }).join('')}</div>`;
    }
  };
  if(zoom&&!REDUCED&&body.animate){ draw(); body.animate([{opacity:0,transform:'scale(.94)'},{opacity:1,transform:'none'}],{duration:420,easing:SPRING}); }
  else slideSwap(body, dir, draw, 40);
}

/* ═══════════════════════════════════════════════════════════
   DASHBOARD
   ═══════════════════════════════════════════════════════════ */
let per='month', anchor=TODAY, meterKind='sport', dashDirty=true;
function kw(d){ const t=new Date(Date.UTC(d.getFullYear(),d.getMonth(),d.getDate())); const n=t.getUTCDay()||7; t.setUTCDate(t.getUTCDate()+4-n); const y=new Date(Date.UTC(t.getUTCFullYear(),0,1)); return Math.ceil(((t-y)/864e5+1)/7); }
function range(){
  const d=parse(anchor);
  if(per==='week'){ const s=addDays(anchor,-((d.getDay()+6)%7)), e=addDays(s,6); return {from:s,to:e,label:`KW ${kw(parse(s))} · ${parse(s).getDate()}.–${parse(e).getDate()}. ${MON3[parse(e).getMonth()]}`}; }
  if(per==='month') return {from:iso(new Date(d.getFullYear(),d.getMonth(),1)),to:iso(new Date(d.getFullYear(),d.getMonth()+1,0)),label:`${MON[d.getMonth()]} ${d.getFullYear()}`};
  return {from:`${d.getFullYear()}-01-01`,to:`${d.getFullYear()}-12-31`,label:String(d.getFullYear())};
}
function entriesIn(from,to){ const out=[]; for(let d=from; d<=to&&d<=TODAY; d=addDays(d,1)){ const e=DATA.get(d); if(e) out.push(e); } return out; }
const sum=(E,k)=>E.reduce((s,e)=>s+(+e[k]||0),0);
const daysElapsed=(from,to)=>Math.max(1,Math.round((parse(to<TODAY?to:TODAY)-parse(from))/864e5)+1);
function shiftPeriod(n){ const d=parse(anchor);
  if(per==='week') d.setDate(d.getDate()+7*n); if(per==='month') d.setMonth(d.getMonth()+n,1); if(per==='year') d.setFullYear(d.getFullYear()+n,0,1);
  anchor=iso(d); renderDash(true,n); }
$('#prevPer').onclick=()=>shiftPeriod(-1); $('#nextPer').onclick=()=>shiftPeriod(1);
const setPerSeg=segInit($('#perSeg'),per,v=>{ per=v; anchor=cur; renderDash(true); });
segInit($('#meterSeg'),meterKind,v=>{ meterKind=v; renderMeter(); });

let COLS=[];
function renderDash(regrow=false,dir=0){
  dashDirty=false;
  const R=range(), E=entriesIn(R.from,R.to), n=daysElapsed(R.from,R.to);
  slideSwap($('#periodLabel'),dir,()=>$('#periodLabel').textContent=R.label);
  $('#nextPer').style.opacity=R.to>=TODAY?.35:1; $('#nextPer').disabled=R.to>=TODAY;
  const S=[['coffee','Kaffee','var(--c-coffee)'],['apples','Äpfel','var(--c-apple)'],['bananas','Bananen','var(--c-banana)'],['cycling_km','Velo km','var(--c-km)']];
  if(!$('#stats').children.length) $('#stats').innerHTML=S.map(([k,l,c])=>`<div class="stat"><div class="cl"><i class="sw" style="background:${c}"></i>${l}</div><div class="big" id="st-${k}"><span class="roll"></span></div><div class="avg" id="av-${k}"></div></div>`).join('');
  S.forEach(([k])=>{ const t=sum(E,k); roll($('#st-'+k),fmt0(t)); $('#av-'+k).textContent=`⌀ ${fmt1(t/n)} pro Tag`; });

  if(per==='year'){
    const y=R.from.slice(0,4);
    COLS=MON3.map((m,i)=>{ const f=`${y}-${pad(i+1)}-01`, Es=entriesIn(f,iso(new Date(+y,i+1,0)));
      return {key:f,label:m,title:`${MON[i]} ${y}`,coffee:sum(Es,'coffee'),apples:sum(Es,'apples'),bananas:sum(Es,'bananas'),mood:Es.length?sum(Es,'mood')/Es.length:null,future:f>TODAY}; });
    $('#chartSub').textContent='Summe pro Monat · antippen öffnet den Monat';
  } else {
    COLS=[]; for(let d=R.from; d<=R.to; d=addDays(d,1)){ const e=DATA.get(d), dt=parse(d);
      COLS.push({key:d,label:per==='week'?WD2[dt.getDay()]:String(dt.getDate()),title:`${WD[dt.getDay()]}, ${dt.getDate()}. ${MON[dt.getMonth()]}`,
        coffee:e?.coffee||0,apples:e?.apples||0,bananas:e?.bananas||0,mood:e?e.mood:null,future:d>TODAY}); }
    $('#chartSub').textContent='pro Tag · antippen öffnet den Tag';
  }
  const max=Math.max(1,...COLS.map(c=>c.coffee+c.apples+c.bananas));
  $('#chartCols').style.setProperty('--gap',(COLS.length>20?1.5:COLS.length>10?3:6)+'px');
  $('#chartCols').innerHTML=COLS.map((c,i)=>`<div class="ccol" style="opacity:${c.future?.25:1}">
      <div class="up">${[['coffee','coffee'],['apples','apple'],['bananas','banana']].map(([k,v])=>`<div class="seg-b" data-h="${c[k]/max*100}" style="background:var(--c-${v});transition-delay:${i*14}ms"></div>`).join('')}</div>
      <div class="dn">${c.mood?`<div class="seg-b" data-h="${Math.abs(c.mood)/2*100}" style="background:${c.mood>0?'var(--good)':'var(--bad)'};opacity:.85;transition-delay:${i*14+120}ms"></div>`:''}</div></div>`).join('');
  const f=COLS[0], l=COLS[COLS.length-1];
  $('#chartFoot').innerHTML=`<span>${per==='year'?f.label:f.title.split(', ')[1]}</span><span>${per==='year'?l.label:l.title.split(', ')[1]}</span>`;
  if(view==='dash') requestAnimationFrame(()=>requestAnimationFrame(growBars));

  METER_E=E; renderMeter();
  const avg=E.length?sum(E,'mood')/E.length:0;
  roll($('#moodAvg'),(avg>0?'+':avg<0?'−':'')+fmt1(Math.abs(avg))); $('#moodAvg').style.color=MOOD_COL[moodKey(avg)];
  $('#moodSub').textContent=`⌀ über ${E.length} Einträge`;
  const fd=[]; for(let d=R.from; d<=R.to; d=addDays(d,1)) fd.push(d);
  $('#field').innerHTML=fd.map(d=>{ const e=DATA.get(d), fut=d>TODAY;
    return `<i class="${e?'':'empty'}" data-d="${e?d:''}" title="${parse(d).getDate()}. ${MON3[parse(d).getMonth()]}${e?' · '+(e.mood>0?'+':'')+e.mood:''}" style="background:${e?MOOD_COL[moodKey(e.mood)]:'var(--surface-3)'};opacity:${fut?.12:e?1:.35}"></i>`; }).join('');
}
function growBars(){ document.querySelectorAll('#chartCols .seg-b').forEach(b=>b.style.height=b.dataset.h+'%'); }

(function scrub(){
  const ch=$('#chart'), ring=$('#ring'), tip=$('#tip'); let act=-1, downX=null, moved=false;
  const idxAt=x=>{ const r=ch.getBoundingClientRect(); return Math.max(0,Math.min(COLS.length-1,Math.floor((x-r.left)/r.width*COLS.length))); };
  function show(i){
    if(i===act) return; act=i; const c=COLS[i]; if(!c) return; const w=ch.clientWidth/COLS.length, rw=Math.max(14,w);
    ring.style.width=rw+'px'; ring.style.transform=`translateX(${i*w+w/2-rw/2}px)`;
    ch.querySelectorAll('.ccol').forEach((el,j)=>el.classList.toggle('act',j===i));
    const row=(col,l,v)=>`<div class="r"><i class="sw" style="background:${col}"></i>${l}<span>${v}</span></div>`;
    tip.innerHTML=`<b>${c.title}</b>${row('var(--c-coffee)','Kaffee',c.coffee)}${row('var(--c-apple)','Äpfel',c.apples)}${row('var(--c-banana)','Bananen',c.bananas)}${row(c.mood===null?'#555':MOOD_COL[moodKey(c.mood)],'Stimmung',c.mood===null?'–':(c.mood>0?'+':'')+fmt1(c.mood))}`;
    const tw=tip.offsetWidth, x=Math.max(tw/2-4,Math.min(ch.clientWidth-tw/2+4,i*w+w/2));
    if(!ch.classList.contains('dim')){ tip.style.transition='opacity .2s'; tip.style.left=x+'px'; tip.offsetWidth; tip.style.transition=''; }
    tip.style.left=x+'px'; ch.classList.add('dim');
  }
  const hide=()=>{ act=-1; ch.classList.remove('dim'); ch.querySelectorAll('.ccol.act').forEach(el=>el.classList.remove('act')); };
  ch.addEventListener('pointerdown',e=>{ downX=e.clientX; moved=false; show(idxAt(e.clientX)); });
  ch.addEventListener('pointermove',e=>{ if(downX!==null&&Math.abs(e.clientX-downX)>8) moved=true; if(e.pointerType==='mouse'||downX!==null) show(idxAt(e.clientX)); });
  ch.addEventListener('pointerleave',e=>{ if(e.pointerType==='mouse') hide(); });
  ch.addEventListener('pointercancel',()=>{ downX=null; hide(); });
  ch.addEventListener('pointerup',e=>{ const c=COLS[idxAt(e.clientX)], tap=!moved; downX=null;
    if(e.pointerType!=='mouse') setTimeout(hide,900);
    if(!tap||!c||c.future) return;
    if(per==='year'){ anchor=c.key; per='month'; setPerSeg('month'); hide(); renderDash(true); } else openDay(c.key); });
})();

let METER_E=[], meterHl=null;
const PALETTE=['#22b8cf','#4c8dff','#a06bff','#ef5da8','#2ecc71','#ffb84d'];
function renderMeter(){
  const counts={}; METER_E.forEach(e=>(e[meterKind]||[]).forEach(v=>counts[v]=(counts[v]||0)+1));
  let rows=Object.entries(counts).sort((a,b)=>b[1]-a[1]);
  if(rows.length>6){ const rest=rows.slice(5).reduce((s,r)=>s+r[1],0); rows=[...rows.slice(0,5),['Andere',rest]]; }
  const total=rows.reduce((s,r)=>s+r[1],0), bar=$('#meterBar'), leg=$('#meterLegend');
  bar.innerHTML=rows.map((r,i)=>`<i data-i="${i}" style="background:${PALETTE[i]}"></i>`).join('')||'<i style="flex-basis:100%;background:var(--surface-3)"></i>';
  leg.innerHTML=rows.map((r,i)=>`<button class="ml press" data-i="${i}"><i class="sw" style="background:${PALETTE[i]}"></i>${esc(r[0])}<span class="c">${r[1]}</span></button>`).join('')||'<span class="muted">Keine Daten in diesem Zeitraum</span>';
  requestAnimationFrame(()=>requestAnimationFrame(()=>bar.querySelectorAll('i[data-i]').forEach((el,i)=>el.style.flexBasis=`calc(${rows[i][1]/total*100}% - 3px)`)));
  const unit={sport:'Einheiten',locations:'Tage an Orten',coffeeLocations:'Kaffees zugeordnet',people:'Begegnungen'}[meterKind];
  const hl=i=>{ meterHl=i; bar.classList.toggle('dim',i!==null);
    bar.querySelectorAll('i').forEach(el=>el.classList.toggle('hl',+el.dataset.i===i)); leg.querySelectorAll('.ml').forEach(el=>el.classList.toggle('hl',+el.dataset.i===i));
    if(i===null){ roll($('#meterBig'),fmt0(total)); $('#meterOf').textContent=unit; } else { roll($('#meterBig'),fmt0(rows[i][1])); $('#meterOf').textContent=`${rows[i][0]} · ${Math.round(rows[i][1]/total*100)} %`; } };
  hl(null);
  leg.onpointerover=e=>{ const b=e.target.closest('.ml'); if(b&&FINE) hl(+b.dataset.i); };
  leg.onpointerleave=()=>FINE&&hl(null);
  leg.onclick=e=>{ const b=e.target.closest('.ml'); if(b) hl(meterHl===+b.dataset.i&&!FINE?null:+b.dataset.i); };
  bar.onpointermove=e=>{ const s=e.target.closest('i[data-i]'); if(s) hl(+s.dataset.i); };
  bar.onpointerleave=()=>hl(null);
}
$('#field').addEventListener('click',e=>{ const d=e.target.closest('i')?.dataset.d; if(d) openDay(d); });
function openDay(d){ const dir=d>cur?1:-1; cur=d; go('entry'); setTimeout(()=>{ renderEntry(dir); renderStrip(); centerStrip(false); }, REDUCED?0:170); }

/* ═══════════════════════════════════════════════════════════
   SHEET (Datum, Einstellungen) – auf Mobile nach unten ziehen
   ═══════════════════════════════════════════════════════════ */
function openSheet(html){ $('#sheetContent').innerHTML=html; $('#scrim').classList.add('open'); $('#sheet').classList.add('open'); lockScroll(true); }
function closeSheet(){ if(!$('#sheet').classList.contains('open')) return; $('#scrim').classList.remove('open'); $('#sheet').classList.remove('open'); $('#sheet').style.transform=''; lockScroll(false); }
$('#scrim').onclick=closeSheet;
(function dragSheet(){
  const g=$('#grab'), sh=$('#sheet'); let y0=null,dy=0,t0=0;
  g.addEventListener('pointerdown',e=>{ y0=e.clientY; dy=0; t0=performance.now(); g.setPointerCapture(e.pointerId); sh.classList.add('dragging'); });
  g.addEventListener('pointermove',e=>{ if(y0===null) return; dy=Math.max(0,e.clientY-y0); sh.style.transform=`translate(-50%,${dy}px)`; });
  const end=()=>{ if(y0===null) return; const v=dy/(performance.now()-t0); y0=null; sh.classList.remove('dragging'); if(dy>120||v>.6) closeSheet(); else sh.style.transform=''; };
  g.addEventListener('pointerup',end); g.addEventListener('pointercancel',end);
})();
const closeBtn=`<button class="icon-btn press close" onclick="closeSheet()" aria-label="Schliessen"><svg class="ico" viewBox="0 0 24 24"><path d="M18 6 6 18M6 6l12 12"/></svg></button>`;
function openSettings(){
  const has=!!ghConfig()?.token;
  openSheet(`<div class="sheet-head"><h2>Einstellungen</h2>${closeBtn}</div><div class="sheet-body">
    <button class="opt press" onclick="setSource('demo');closeSheet()"><i class="sw" style="width:10px;height:10px;border-radius:50%;background:${SOURCE==='demo'?'var(--good)':'var(--surface-3)'}"></i>
      <span><strong>Demo-Daten</strong><p>500 erfundene Tage zum Ausprobieren. Änderungen bleiben im Browser-Tab.</p></span></button>
    <button class="opt press" style="${has?'':'opacity:.5'}" ${has?'':'disabled'} onclick="setSource('github');closeSheet()"><i class="sw" style="width:10px;height:10px;border-radius:50%;background:${SOURCE==='github'?'var(--c-km)':'var(--surface-3)'}"></i>
      <span><strong>Meine Daten (GitHub, nur lesen)</strong><p>${has?'Liest search-index.json mit der Verbindung aus Erfassen.':'Keine Verbindung gefunden. Funktioniert, wenn diese Seite auf derselben Domain wie Erfassen liegt.'}</p></span></button>
    <p class="muted">Prototyp: Speichern ins Repo und Export kommen beim Zusammenführen aus der bestehenden Erfassen-Seite dazu.</p></div>`);
}

/* ═══════════════════════════════════════════════════════════
   SUCHE – eigene Seite. Freitext, Filter-Chips (UND), Präfixe wie bisher,
   Vorschläge passen sich den aktuellen Treffern an.
   ═══════════════════════════════════════════════════════════ */
const PREFIX={tag:['tags','Tag'],ort:['locations','Ort'],land:['countries','Land'],kaffee:['coffeeLocations','Kaffee'],sport:['sport','Sport'],place:['places','Spez. Ort'],person:['people','Person']};
const ALIAS={tags:'tag',location:'ort',country:'land',kaffeeort:'kaffee',ort2:'place',people:'person'};
let filters=[], TERMS=[], searchDirty=true, sortNew=true, shown=80, HITS=[];
const parsePrefix=q=>{ const m=q.match(/^([a-zA-Z0-9]+)[=:]\s*(.*)$/); if(!m) return null; const p=ALIAS[m[1].toLowerCase()]||m[1].toLowerCase(); return PREFIX[p]?{p,v:m[2].trim()}:null; };
const pLabel=p=>PREFIX[p]?.[1]||(p==='jahr'?'Jahr':p==='monat'?'Monat':p);
function countTerms(entries){
  const c=new Map(), add=(p,v)=>{ const k=p+'\u0000'+v; c.set(k,(c.get(k)||0)+1); };
  entries.forEach(e=>{ Object.entries(PREFIX).forEach(([p,[f]])=>new Set(e[f]||[]).forEach(v=>add(p,v))); add('jahr',e.date.slice(0,4)); add('monat',MON[+e.date.slice(5,7)-1]); });
  return [...c].map(([k,n])=>{ const [p,v]=k.split('\u0000'); return {p,v,n}; }).sort((a,b)=>b.n-a.n);
}
function openSearch(){ go('search', ()=>$('#q').focus({preventScroll:true})); }
$('#q').addEventListener('input',()=>{ shown=80; renderSearch(); });
$('#q').addEventListener('keydown',e=>{
  if(e.key==='Enter'){ const pp=parsePrefix(e.target.value); if(pp&&pp.v) addFilter(pp.p,pp.v); else e.target.blur(); }
  if(e.key==='Backspace'&&!e.target.value&&filters.length){ filters.pop(); renderSearch(); }
});
$('#qClear').onclick=e=>{ e.preventDefault(); $('#q').value=''; filters=[]; renderSearch(); $('#q').focus(); };
function addFilter(p,v){ if(!filters.some(f=>f.p===p&&f.v.toLowerCase()===v.toLowerCase())) filters.push({p,v}); $('#q').value=''; shown=80; renderSearch(); if(!TOUCH) $('#q').focus({preventScroll:true}); scrollTo({top:0,behavior:'smooth'}); }
$('#sugg').addEventListener('pointerdown',e=>{ if(document.activeElement===$('#q')) e.preventDefault(); }); // Tastatur bleibt offen
$('#sugg').addEventListener('click',e=>{ const b=e.target.closest('.sg'); if(b) addFilter(b.dataset.p,b.dataset.v); });
$('#filters').addEventListener('click',e=>{ const b=e.target.closest('[data-rm]'); if(b){ filters.splice(+b.dataset.rm,1); renderSearch(); } });
$('#hits').addEventListener('click',e=>{ const b=e.target.closest('.hit'); if(b) openDay(b.dataset.d); if(e.target.closest('.more')){ shown+=80; drawHits(); } });
segInit($('#sortSeg'),'new',v=>{ sortNew=v==='new'; drawHits(); });
let lastY=0;
addEventListener('scroll',()=>{ if(view!=='search') return;
  $('#sBar').classList.toggle('stuck',scrollY>4);
  if(TOUCH&&document.activeElement===$('#q')&&Math.abs(scrollY-lastY)>12) $('#q').blur(); // beim Scrollen Tastatur weg
  lastY=scrollY; },{passive:true});

function matchFilter(e,f){
  if(f.p==='jahr') return e.date.startsWith(f.v+'-');
  if(f.p==='monat') return +e.date.slice(5,7)===MON.indexOf(f.v)+1;
  return (e[PREFIX[f.p][0]]||[]).some(x=>x.toLowerCase()===f.v.toLowerCase());
}
const ago=t=>{ if(!t) return ''; const m=Math.round((Date.now()-new Date(t))/6e4); return m<2?'gerade eben':m<60?`vor ${m} Min.`:m<1440?`vor ${Math.round(m/60)} Std.`:`vor ${Math.round(m/1440)} Tagen`; };
let HQ='', HPP=null;
function renderSearch(){
  searchDirty=false;
  const q=$('#q').value.trim(), ql=q.toLowerCase(), pp=parsePrefix(q);
  $('#qClear').hidden=!q&&!filters.length;
  $('#filters').innerHTML=filters.map((f,i)=>`<span class="fchip"><span class="pt">${pLabel(f.p)}</span>${esc(f.v)}<button data-rm="${i}" aria-label="Filter entfernen">✕</button></span>`).join('');
  $('#indexInfo').innerHTML=`<span class="dot" style="background:${SOURCE==='demo'?'var(--good)':'var(--c-km)'}"></span>${fmt0(DATA.size)} Einträge indexiert · ${SOURCE==='demo'?'Demo-Daten':'Stand '+ago(INDEX_BUILT)}`;

  // Treffer
  const all=[...DATA.values()], base=all.filter(e=>filters.every(f=>matchFilter(e,f)));
  HITS=base.filter(e=>{
    if(pp&&pp.v) return (e[PREFIX[pp.p][0]]||[]).some(v=>v.toLowerCase().includes(pp.v.toLowerCase()));
    if(!pp&&q.length>=2) return [plain(e.text),...LIST_KEYS.flatMap(k=>e[k]||[])].join(' ').toLowerCase().includes(ql);
    return true;
  });
  HQ=pp?pp.v:(q.length>=2?q:''); HPP=pp;

  // Vorschläge: beim Tippen passende Begriffe, sonst Begriffe aus den aktuellen Treffern
  let sg=[];
  const taken=t=>filters.some(f=>f.p===t.p&&f.v===t.v);
  if(pp) sg=countTerms(all).filter(t=>t.p===pp.p&&(!pp.v||t.v.toLowerCase().includes(pp.v.toLowerCase())));
  else if(ql) sg=countTerms(all).filter(t=>t.v.toLowerCase().includes(ql));
  else if(filters.length){
    const T=countTerms(HITS).filter(t=>!taken(t)&&t.n<HITS.length);   // nur was weiter eingrenzt
    const hasY=filters.some(f=>f.p==='jahr'), hasM=filters.some(f=>f.p==='monat');
    const months=hasY&&!hasM?T.filter(t=>t.p==='monat').sort((a,b)=>MON.indexOf(a.v)-MON.indexOf(b.v)).map(t=>({...t,ctx:1})):[];
    const years=hasM&&!hasY?T.filter(t=>t.p==='jahr').sort((a,b)=>b.v-a.v).map(t=>({...t,ctx:1})):[];
    sg=[...months,...years,...T.filter(t=>t.p!=='jahr'&&t.p!=='monat').slice(0,16)];
  } else {
    const T=countTerms(all); sg=[...T.filter(t=>t.p==='jahr').sort((a,b)=>b.v-a.v), ...T.filter(t=>t.p==='tag'||t.p==='person').slice(0,12)];
  }
  sg=sg.filter(t=>!taken(t)).slice(0,28);
  const hlS=s=>{ const h=pp?pp.v:q; return h?esc(s).replace(new RegExp(reEsc(esc(h)),'ig'),m=>`<mark>${m}</mark>`):esc(s); };
  $('#sugg').innerHTML=sg.map((t,i)=>`<button class="sg press${t.ctx?' ctx':''}" style="animation-delay:${Math.min(i,12)*18}ms" data-p="${t.p}" data-v="${esc(t.v)}"><span class="pt">${pLabel(t.p)}</span>${hlS(t.v)}${t.n?`<span class="c">${t.n}</span>`:''}</button>`).join('');
  drawHits();
}
function drawHits(){
  const q=$('#q').value.trim(), idle=!filters.length&&q.length<2&&!(HPP&&HPP.v);
  $('#sMeta').style.display=idle?'none':'';
  if(idle){ $('#hits').innerHTML=`<div class="syntax">Text eingeben oder Vorschlag antippen. Filter lassen sich kombinieren, ein Jahr zeigt danach seine Monate.<br>
      <code>tag:</code> <code>ort:</code> <code>land:</code> <code>kaffee:</code> <code>sport:</code> <code>person:</code> <code>place:</code></div>`; return; }
  $('#qCount').textContent=HITS.length?`${fmt0(HITS.length)} Treffer`:'';
  const list=[...HITS].sort((a,b)=>sortNew?b.date.localeCompare(a.date):a.date.localeCompare(b.date));
  const hlH=html=>HQ?html.replace(new RegExp(`(<[^>]+>)|(${reEsc(esc(HQ))})`,'ig'),(m,tag,hit)=>tag||`<mark>${hit}</mark>`):html;
  const excerpt=t=>{ if(!t) return ''; const P=plain(t); if(!HQ||HPP) return t.length>220?renderRich(t.slice(0,220))+' …':renderRich(t);
    const i=P.toLowerCase().indexOf(HQ.toLowerCase()); if(i<0) return renderRich(t.slice(0,220));
    const a=Math.max(0,i-70), part=P.slice(a,i+150); return (a?'… ':'')+esc(part)+(i+150<P.length?' …':''); };
  const dl=s=>{ const x=parse(s); return `${WD2[x.getDay()]} ${x.getDate()}. ${MON[x.getMonth()]} ${x.getFullYear()}`; };
  $('#hits').innerHTML=list.length?list.slice(0,shown).map((e,i)=>{
    const meta=[...e.locations,...e.people,...e.tags.map(t=>'#'+t),...e.sport].join(' · ');
    return `<button class="hit" data-d="${e.date}" style="animation-delay:${Math.min(i,10)*25}ms"><div class="hd">${dl(e.date)}</div>${e.text?`<div class="ht">${hlH(excerpt(e.text))}</div>`:''}<div class="hm">${hlH(esc(meta))}</div></button>`; }).join('')
    +(list.length>shown?`<button class="more press">${fmt0(list.length-shown)} weitere anzeigen</button>`:'')
    :'<p class="muted">Keine Treffer.</p>';
}

/* ═══════════════════════════════════════════════════════════
   Start
   ═══════════════════════════════════════════════════════════ */
buildCounters();
setPreview(previewOn,false);
try{ if(localStorage.getItem('abkFold')) setFold(true); }catch{}
let startSrc='demo'; try{ startSrc=localStorage.getItem('abkSource')||'demo'; }catch{}
setSource(startSrc==='github'&&ghConfig()?.token?'github':'demo');
</script>
