<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#1a1a1a">
<meta name="robots" content="noindex">
<title>Tagebuch</title>
<style>
/* ─────────────────────────────────────────────────────────────
   Tokens – Basis DESIGN.md, Bewegung/Radien angelehnt an bencho
   ───────────────────────────────────────────────────────────── */
:root{
  --bg:#1a1a1a; --surface:#262626; --surface-2:#2f2f2f; --surface-3:#383838;
  --border:#333; --border-2:#444;
  --text:#ececec; --text-2:#a0a0a0; --text-3:#6b6b6b;
  --accent:#FD939F; --accent-bg:rgba(253,147,159,.12);
  --c-coffee:#FD939F; --c-apple:#81c784; --c-banana:#ffd54f; --c-km:#64b5f6;
  --good:#81c784; --bad:#e57373;
  --r-card:20px; --r-inner:12px;
  --font:"Inter",ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;
  --ease-out:cubic-bezier(.32,.72,0,1);
  --spring:cubic-bezier(.32,.72,0,1);
  --spring-pop:cubic-bezier(.34,1.56,.64,1);
  --dock-h:64px;
}
@supports (transition-timing-function: linear(0, 1)){
  :root{
    /* sanfte Feder, ~3 % Überschwingen */
    --spring:linear(0,.013 .6%,.05 1.2%,.2 2.6%,.4 4.3%,.6 6.4%,.75 8.4%,.87 10.9%,.95 13.6%,1.006 17.3%,1.03 21.4%,1.035 25.9%,1.025 33%,1.008 43%,.999 55%,1);
    /* verspielte Feder, ~15 % Überschwingen */
    --spring-pop:linear(0,.009,.035 2.1%,.141,.281 6.7%,.723 12.9%,.938 16.7%,1.017,1.077,1.121,1.149 24.3%,1.159,1.163,1.161,1.154 29.9%,1.129 32.8%,1.051 39.6%,1.017 43.1%,.991,.977 51%,.974 53.8%,.975 57.1%,.997 69.8%,1.003 76.9%,1);
  }
}
@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{transition-duration:.01ms!important;animation-duration:.01ms!important}
}

*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{background:var(--bg);color-scheme:dark}
body{margin:0;font:15px/1.5 var(--font);color:var(--text);background:var(--bg);
  -webkit-font-smoothing:antialiased;overscroll-behavior-y:none}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer}
input,textarea{font:inherit;color:inherit}
svg{display:block}
.ico{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.tnum{font-variant-numeric:tabular-nums}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}

/* Press-Feedback für alles Tippbare */
.press{transition:transform .35s var(--spring),background-color .2s,color .2s,opacity .2s}
.press:active{transform:scale(.94);transition-duration:.08s}

/* ─── Layout ─────────────────────────────────────────────── */
.views{position:relative}
.view{max-width:640px;margin:0 auto;
  padding:calc(env(safe-area-inset-top) + 20px) 16px calc(var(--dock-h) + env(safe-area-inset-bottom) + 48px);
  display:flex;flex-direction:column;gap:12px}
.view[hidden]{display:none}
@media (min-width:1056px){
  .view{max-width:1120px;padding-left:28px;padding-right:28px}
  .grid-2{display:grid;grid-template-columns:1fr 1fr;gap:12px;align-items:start}
  .col{display:flex;flex-direction:column;gap:12px}
}
@media (max-width:1055px){ .grid-2,.col{display:contents} }

.card{background:var(--surface);border-radius:var(--r-card);padding:18px;position:relative}
.card-head{display:flex;align-items:center;gap:10px;margin-bottom:14px;min-height:32px}
.card-title{font-size:15px;font-weight:500}
.card-sub{font-size:13px;color:var(--text-2)}
.label{font-size:12px;font-weight:500;letter-spacing:.4px;text-transform:uppercase;color:var(--text-3)}

/* Segmented control mit gleitendem Daumen */
.seg{position:relative;display:inline-flex;padding:3px;border-radius:999px;background:var(--bg);margin-left:auto;flex-shrink:0}
.seg button{position:relative;z-index:1;height:30px;padding:0 13px;border-radius:999px;font-size:13px;color:var(--text-2);transition:color .25s}
.seg button[aria-selected="true"]{color:var(--text)}
.seg .thumb{position:absolute;top:3px;bottom:3px;left:0;border-radius:999px;background:var(--surface-3);
  transition:transform .5s var(--spring),width .5s var(--spring)}

.icon-btn{width:36px;height:36px;border-radius:50%;display:grid;place-items:center;background:var(--surface);color:var(--text-2)}
.icon-btn:hover{color:var(--text);background:var(--surface-2)}
.icon-btn .ico{width:18px;height:18px}
.pill{height:30px;padding:0 13px;border-radius:999px;font-size:13px;font-weight:500;display:inline-flex;align-items:center;gap:6px}
.pill-white{background:#fff;color:#111}
.pill-accent{background:var(--accent-bg);color:var(--accent)}

/* ─── Rolling Numbers ────────────────────────────────────── */
.roll{display:inline-flex;overflow:hidden;line-height:1;height:1em;vertical-align:baseline;font-variant-numeric:tabular-nums}
.roll .d{display:inline-block;height:1em;overflow:hidden}
.roll .d>span{display:flex;flex-direction:column;transition:transform .7s var(--spring)}
.roll .d>span>i{font-style:normal;height:1em;line-height:1;display:block}
.roll .s{display:inline-block;line-height:1}

/* ─── Status-Insel ───────────────────────────────────────── */
.island{position:fixed;left:50%;top:calc(env(safe-area-inset-top) + 10px);z-index:60;
  transform:translate(-50%,-140%);display:flex;align-items:center;gap:8px;
  height:34px;padding:0 14px 0 10px;border-radius:999px;background:#000;color:var(--text);font-size:13px;
  box-shadow:0 8px 30px rgba(0,0,0,.4);transition:transform .55s var(--spring-pop),width .4s var(--spring);white-space:nowrap}
.island.show{transform:translate(-50%,0)}
.island .dot{width:8px;height:8px;border-radius:50%;background:var(--good)}

/* ─── Dock ───────────────────────────────────────────────── */
.dock-wrap{position:fixed;left:0;right:0;bottom:calc(env(safe-area-inset-bottom) + 14px);display:flex;justify-content:center;z-index:50;pointer-events:none}
.dock{pointer-events:auto;position:relative;display:flex;align-items:flex-end;gap:4px;padding:8px 10px;border-radius:24px;
  background:rgba(38,38,38,.78);backdrop-filter:blur(20px) saturate(1.4);-webkit-backdrop-filter:blur(20px) saturate(1.4);
  box-shadow:0 0 0 1px rgba(255,255,255,.06),0 12px 40px rgba(0,0,0,.45)}
.dock-item{position:relative;width:48px;height:48px;display:grid;place-items:center;color:var(--text-3);transform-origin:50% 100%;will-change:transform}
.dock-item .ico{width:22px;height:22px;transition:color .2s}
.dock-item:hover,.dock-item[aria-current="page"]{color:var(--text)}
.dock-item::after{content:"";position:absolute;bottom:2px;left:50%;width:4px;height:4px;margin-left:-2px;border-radius:50%;background:var(--text-2);
  transform:scale(0);transition:transform .45s var(--spring-pop)}
.dock-item[aria-current="page"]::after{transform:scale(1)}
.dock-sep{width:1px;align-self:stretch;margin:8px 4px;background:var(--border-2)}
.dock-tip{position:absolute;bottom:calc(100% + 10px);left:0;padding:6px 12px;border-radius:999px;background:#fff;color:#111;font-size:13px;white-space:nowrap;
  pointer-events:none;opacity:0;transform:translateY(4px);transition:opacity .2s,transform .45s var(--spring),left .45s var(--spring)}
.dock-tip.show{opacity:1}
@media (hover:none){ .dock-tip{display:none} }

/* ─── Erfassen: Tageskopf ────────────────────────────────── */
.day-head{display:flex;align-items:flex-end;gap:10px;padding:4px 4px 2px;touch-action:pan-y;user-select:none}
.day-title{flex:1;min-width:0;overflow:hidden}
.day-title-inner{will-change:transform}
.day-wd{font-size:13px;color:var(--text-2)}
.day-date{font-size:28px;font-weight:500;letter-spacing:-.4px;line-height:1.15;white-space:nowrap}
.day-nav{display:flex;gap:6px;align-items:center}
.today-pill{transition:opacity .25s,transform .45s var(--spring-pop)}
.today-pill[hidden]{display:inline-flex;opacity:0;transform:scale(.6);pointer-events:none}

/* Wochenleiste */
.strip{display:flex;gap:4px;overflow-x:auto;scroll-snap-type:x mandatory;scrollbar-width:none;margin:0 -16px;padding:6px 16px 2px;
  -webkit-mask-image:linear-gradient(90deg,transparent,#000 16px,#000 calc(100% - 16px),transparent);mask-image:linear-gradient(90deg,transparent,#000 16px,#000 calc(100% - 16px),transparent)}
.strip::-webkit-scrollbar{display:none}
.sd{flex:0 0 44px;scroll-snap-align:center;display:flex;flex-direction:column;align-items:center;gap:3px;padding:8px 0 7px;border-radius:14px;color:var(--text-2);position:relative}
.sd .w{font-size:11px;color:var(--text-3);text-transform:uppercase;letter-spacing:.4px}
.sd .n{font-size:15px;font-weight:500}
.sd .mini{display:flex;flex-direction:column-reverse;gap:1px;height:18px;width:6px;justify-content:flex-start}
.sd .mini i{display:block;width:6px;border-radius:2px}
.sd.sel{background:var(--surface);color:var(--text)}
.sd.today .n{color:var(--accent)}
.sd.future{opacity:.35}
.sd.weekstart{margin-left:8px}

/* Zähler */
.counters{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.counter{background:var(--bg);border-radius:16px;padding:12px 8px 8px;display:flex;flex-direction:column;align-items:center;gap:8px}
.counter .val{font-size:30px;font-weight:500;height:30px;display:flex;align-items:center}
.counter .ctrl{display:flex;gap:6px;width:100%}
.counter .ctrl button{flex:1;height:36px;border-radius:11px;background:var(--surface);color:var(--text-2);font-size:20px;line-height:1}
.counter .ctrl button:hover{color:var(--text);background:var(--surface-2)}
.counter .cl{display:flex;align-items:center;gap:6px}
.sw{width:8px;height:8px;border-radius:3px;flex-shrink:0}

/* Stimmungs-Slider */
.mood-top{display:flex;align-items:baseline;gap:10px;margin-bottom:14px}
.mood-val{font-size:30px;font-weight:500;transition:color .3s}
.mood-word{font-size:13px;color:var(--text-2)}
.slider{position:relative;height:44px;touch-action:none;cursor:grab;outline:none}
.slider:active{cursor:grabbing}
.slider .track{position:absolute;left:0;right:0;top:50%;height:6px;margin-top:-3px;border-radius:3px;
  background:linear-gradient(90deg,#e57373,#ffcc80 30%,#555 50%,#a5d6a7 70%,#43a047)}
.slider .tick{position:absolute;top:50%;width:2px;height:2px;margin:-1px 0 0 -1px;border-radius:50%;background:rgba(0,0,0,.5)}
.slider .knob{position:absolute;top:50%;left:0;width:26px;height:26px;margin:-13px 0 0 -13px;border-radius:50%;background:#fff;
  box-shadow:0 2px 10px rgba(0,0,0,.5);transition:transform .25s var(--spring);will-change:left}
.slider.snap .knob{transition:left .55s var(--spring),transform .25s var(--spring)}
.slider.drag .knob{transform:scale(1.18)}
.slider:focus-visible .knob{box-shadow:0 0 0 3px var(--accent),0 2px 10px rgba(0,0,0,.5)}
.ticks{display:flex;justify-content:space-between;font-size:11px;color:var(--text-3);margin-top:2px;padding:0 6px}

/* Chips */
.chip-group+.chip-group{margin-top:16px}
.chip-group .label{display:block;margin-bottom:8px}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{height:34px;padding:0 13px;border-radius:999px;background:var(--bg);color:var(--text-2);font-size:14px;display:inline-flex;align-items:center;gap:7px;
  transition:background-color .2s,color .2s,transform .4s var(--spring)}
.chip:hover{color:var(--text)}
.chip .cd{width:6px;height:6px;border-radius:50%;background:currentColor;transform:scale(0);margin-left:-13px;transition:transform .4s var(--spring-pop),margin .4s var(--spring)}
.chip.on{background:var(--accent-bg);color:var(--accent)}
.chip.on .cd{transform:scale(1);margin-left:0}
.chip:active{transform:scale(.93);transition-duration:.08s}
.chip-add{width:120px;height:34px;padding:0 13px;border-radius:999px;border:1px dashed var(--border-2);background:transparent;font-size:14px;outline:none;transition:border-color .2s,width .4s var(--spring)}
.chip-add:focus{border-style:solid;border-color:var(--accent);width:160px}
.expand{display:grid;grid-template-rows:0fr;transition:grid-template-rows .45s var(--spring),opacity .3s;opacity:0}
.expand.open{grid-template-rows:1fr;opacity:1}
.expand>div{overflow:hidden}
.km-row{display:flex;align-items:center;gap:10px;padding-top:10px}
.km-row input{width:90px;height:36px;border-radius:11px;border:0;background:var(--bg);padding:0 12px;font-size:16px;outline:none}
.km-row input:focus{box-shadow:0 0 0 1.5px var(--c-km)}

/* Eintrag */
.entry{width:100%;min-height:140px;resize:none;border:0;outline:none;background:transparent;font-size:16px;line-height:1.7;color:var(--text);padding:0;field-sizing:content}
.entry::placeholder{color:var(--text-3)}

/* ─── Dashboard ──────────────────────────────────────────── */
.dash-head{display:flex;align-items:center;gap:10px;flex-wrap:wrap;padding:4px 4px 2px}
.period{display:flex;align-items:center;gap:6px;flex:1;min-width:0}
@media (max-width:699px){.period{flex-basis:100%;margin-bottom:6px}.dash-head .seg{margin-left:auto!important}}
.period-label{font-size:28px;font-weight:500;letter-spacing:-.4px;line-height:1.15;white-space:nowrap;overflow:hidden}
.period-label-inner{display:inline-block}

.stats{display:grid;grid-template-columns:repeat(2,1fr);gap:8px}
@media (min-width:700px){.stats{grid-template-columns:repeat(4,1fr)}}
.stat{background:var(--surface);border-radius:var(--r-card);padding:16px}
.stat .cl{display:flex;align-items:center;gap:7px;font-size:13px;color:var(--text-2)}
.stat .big{font-size:32px;font-weight:500;letter-spacing:-.5px;margin:10px 0 2px;height:34px;display:flex;align-items:center}
.stat .avg{font-size:12px;color:var(--text-3)}

/* Stacked Bars */
.chart{position:relative;height:200px;touch-action:pan-y;user-select:none;-webkit-user-select:none;cursor:crosshair}
.chart-cols{position:absolute;inset:0 0 0 0;display:flex;align-items:stretch}
.ccol{flex:1;display:flex;flex-direction:column;align-items:center;min-width:0}
.ccol .up{flex:0 0 74%;display:flex;flex-direction:column-reverse;align-items:center;gap:2px;width:100%;padding:0 var(--gap,3px)}
.ccol .dn{flex:1;display:flex;align-items:flex-start;justify-content:center;width:100%;padding:3px var(--gap,3px) 0}
.seg-b{width:100%;max-width:18px;border-radius:4px;height:0;transition:height .6s var(--spring),opacity .25s}
.ccol .dn .seg-b{border-radius:3px}
.chart.dim .ccol:not(.act) .seg-b{opacity:.35}
.axis{position:absolute;left:0;right:0;top:74%;height:1px;background:var(--border)}
.ring{position:absolute;top:-6px;bottom:-6px;left:0;border-radius:10px;border:1.5px solid rgba(255,255,255,.55);opacity:0;pointer-events:none;
  transition:transform .4s var(--spring),width .4s var(--spring),opacity .2s}
.chart.dim .ring{opacity:1}
.tip{position:absolute;top:-8px;left:0;z-index:3;transform:translate(-50%,-100%);pointer-events:none;opacity:0;
  background:#fff;color:#111;border-radius:12px;padding:8px 10px;font-size:12px;line-height:1.45;min-width:120px;box-shadow:0 8px 24px rgba(0,0,0,.35);
  transition:opacity .2s,left .4s var(--spring)}
.chart.dim .tip{opacity:1}
.tip b{display:block;font-weight:600;font-size:12px;margin-bottom:2px}
.tip .r{display:flex;align-items:center;gap:6px}
.tip .r span:last-child{margin-left:auto;font-variant-numeric:tabular-nums;padding-left:10px}
.chart-foot{display:flex;justify-content:space-between;font-size:12px;color:var(--text-3);margin-top:12px}
.legend{display:flex;gap:12px;flex-wrap:wrap;font-size:12px;color:var(--text-2);margin-top:12px}
.legend span{display:inline-flex;align-items:center;gap:6px}

/* Meter (Verteilung) */
.meter-num{display:flex;align-items:baseline;gap:8px;margin-bottom:14px}
.meter-num .big{font-size:30px;font-weight:500;height:32px;display:flex;align-items:center}
.meter-num .of{font-size:13px;color:var(--text-2);transition:opacity .2s}
.meter-bar{display:flex;gap:3px;height:44px}
.meter-bar i{display:block;height:100%;border-radius:8px;flex:0 0 0;min-width:0;
  transition:flex-basis .7s var(--spring),opacity .25s,filter .25s}
.meter-bar.dim i:not(.hl){opacity:.25}
.meter-legend{display:flex;flex-wrap:wrap;gap:6px;margin-top:14px}
.ml{height:32px;padding:0 12px;border-radius:999px;background:var(--bg);font-size:13px;color:var(--text-2);display:inline-flex;align-items:center;gap:8px;transition:background-color .2s,color .2s,transform .35s var(--spring)}
.ml .c{color:var(--text-3);font-variant-numeric:tabular-nums}
.ml.hl{background:var(--surface-3);color:var(--text)}

/* Stimmungsfeld */
.field{display:grid;grid-template-columns:repeat(auto-fill,minmax(14px,1fr));gap:4px}
.field i{aspect-ratio:1;border-radius:4px;background:var(--surface-3);transition:transform .35s var(--spring-pop),opacity .3s;cursor:pointer}
.field i:hover{transform:scale(1.35)}
.field i.empty{opacity:.35;cursor:default}
.field i.empty:hover{transform:none}

/* ─── Sheet (Einstellungen, Suche) ───────────────────────── */
.scrim{position:fixed;inset:0;background:rgba(0,0,0,.5);opacity:0;pointer-events:none;transition:opacity .35s;z-index:70}
.scrim.open{opacity:1;pointer-events:auto}
.sheet{position:fixed;left:50%;bottom:0;z-index:71;width:min(560px,100%);max-height:86vh;display:flex;flex-direction:column;
  background:var(--surface);border-radius:24px 24px 0 0;padding:0 18px calc(env(safe-area-inset-bottom) + 18px);
  transform:translate(-50%,105%);visibility:hidden;transition:transform .5s var(--ease-out),visibility 0s .5s;box-shadow:0 -10px 40px rgba(0,0,0,.4)}
.sheet.open{transform:translate(-50%,0);visibility:visible;transition:transform .5s var(--ease-out),visibility 0s}
.sheet.dragging{transition:none}
@media (min-width:700px){
  .sheet{bottom:auto;top:12vh;border-radius:24px;transform:translate(-50%,8px) scale(.97);opacity:0;pointer-events:none;
    transition:transform .45s var(--spring),opacity .25s;padding-bottom:18px}
  .sheet.open{transform:translate(-50%,0) scale(1);opacity:1;pointer-events:auto}
  .grab{display:none}
}
.grab{padding:10px 0 6px;touch-action:none;cursor:grab}
.grab::before{content:"";display:block;width:40px;height:5px;margin:0 auto;border-radius:3px;background:var(--border-2)}
.sheet h2{font-size:17px;font-weight:500;margin:10px 0 14px;display:flex;align-items:center}
.sheet h2 .icon-btn{margin-left:auto;width:32px;height:32px;background:var(--surface-2)}
.sheet-body{overflow-y:auto;margin:0 -18px;padding:0 18px}
.opt{display:flex;align-items:center;gap:12px;padding:14px;border-radius:16px;background:var(--bg);margin-bottom:8px}
.opt p{margin:0;font-size:13px;color:var(--text-2)}
.opt strong{font-weight:500;display:block}
.search-in{width:100%;height:46px;border-radius:14px;border:0;background:var(--bg);padding:0 14px;font-size:16px;outline:none;margin-bottom:12px}
.search-in:focus{box-shadow:0 0 0 1.5px var(--accent)}
.hit{display:block;width:100%;text-align:left;padding:12px 14px;border-radius:14px;background:var(--bg);margin-bottom:6px}
.hit:hover{background:var(--surface-2)}
.hit .hd{font-size:12px;font-weight:600;color:var(--accent);letter-spacing:.3px}
.hit .ht{font-size:14px;color:var(--text-2);margin-top:2px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.hit mark{background:var(--accent-bg);color:var(--accent);border-radius:3px;padding:0 2px}
.muted{color:var(--text-3);font-size:13px;padding:8px 2px}
</style>
</head>
<body>

<div class="island" id="island" role="status" aria-live="polite"><span class="dot"></span><span id="islandText">Demo-Daten</span></div>

<main class="views">

  <!-- ═══════════════ ERFASSEN ═══════════════ -->
  <section class="view" id="v-entry" aria-label="Erfassen">
    <header class="day-head" id="dayHead">
      <div class="day-title"><div class="day-title-inner" id="dayTitle">
        <div class="day-wd" id="dayWd"></div><div class="day-date" id="dayDate"></div>
      </div></div>
      <div class="day-nav">
        <button class="pill pill-accent press today-pill" id="todayBtn" hidden>Heute</button>
        <button class="icon-btn press" id="prevDay" aria-label="Vorheriger Tag"><svg class="ico" viewBox="0 0 24 24"><path d="M15 18l-6-6 6-6"/></svg></button>
        <button class="icon-btn press" id="nextDay" aria-label="Nächster Tag"><svg class="ico" viewBox="0 0 24 24"><path d="M9 18l6-6-6-6"/></svg></button>
      </div>
    </header>
    <div class="strip" id="strip" aria-label="Tage"></div>

    <div class="grid-2">
      <div class="col">
        <div class="card">
          <div class="card-head"><span class="card-title">Konsum</span></div>
          <div class="counters" id="counters"></div>
        </div>
        <div class="card">
          <div class="mood-top"><span class="mood-val" id="moodVal"><span class="roll"></span></span><span class="mood-word" id="moodWord"></span>

<script>
/* ═══════════════════════════════════════════════════════════
   Hilfsfunktionen
   ═══════════════════════════════════════════════════════════ */
const $ = s => document.querySelector(s);
const pad = n => String(n).padStart(2,'0');
const iso = d => `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
const parse = s => new Date(s+'T12:00:00');
const addDays = (s,n) => { const d=parse(s); d.setDate(d.getDate()+n); return iso(d); };
const TODAY = iso(new Date());
const WD = ['Sonntag','Montag','Dienstag','Mittwoch','Donnerstag','Freitag','Samstag'];
const WD2 = ['So','Mo','Di','Mi','Do','Fr','Sa'];
const MON = ['Januar','Februar','März','April','Mai','Juni','Juli','August','September','Oktober','November','Dezember'];
const MON3 = ['Jan','Feb','Mär','Apr','Mai','Jun','Jul','Aug','Sep','Okt','Nov','Dez'];
const fmt1 = n => (Math.round(n*10)/10).toLocaleString('de-CH',{minimumFractionDigits:1,maximumFractionDigits:1});
const fmt0 = n => Math.round(n).toLocaleString('de-CH');
const esc = s => String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const SPRING = CSS.supports('transition-timing-function','linear(0, 1)') ? getComputedStyle(document.documentElement).getPropertyValue('--spring').trim() : 'cubic-bezier(.32,.72,0,1)';
const REDUCED = matchMedia('(prefers-reduced-motion: reduce)').matches;
const FINE = matchMedia('(hover:hover) and (pointer:fine)').matches;

const MOOD_COL = {'-2':'#e57373','-1.5':'#ef9a9a','-1':'#ffcc80','-0.5':'#9aa0a6','0':'#a0a0a0','0.5':'#a5d6a7','1':'#81c784','1.5':'#66bb6a','2':'#43a047'};
const MOOD_WORD = {'-2':'schwer','-1.5':'zäh','-1':'durchzogen','-0.5':'etwas flau','0':'neutral','0.5':'ok','1':'gut','1.5':'sehr gut','2':'grossartig'};
const moodKey = v => String(Math.round(v*2)/2).replace(/^-0$/,'0');

/* Rolling Number: Ziffern rollen, Sonderzeichen bleiben stehen */
function roll(el, text){
  text = String(text);
  let r = el.classList.contains('roll') ? el : el.querySelector('.roll');
  if(!r){ r = document.createElement('span'); r.className='roll'; el.appendChild(r); }
  const shape = text.replace(/\d/g,'0');
  if(r.dataset.shape !== shape){
    r.dataset.shape = shape;
    r.innerHTML = [...text].map(ch => /\d/.test(ch)
      ? `<span class="d"><span>${'0123456789'.split('').map(x=>`<i>${x}</i>`).join('')}</span></span>`
      : `<span class="s">${ch===' '?'&nbsp;':esc(ch)}</span>`).join('');
    r.offsetWidth; // Startposition 0 festhalten, damit neue Ziffern hochrollen
  }
  r.setAttribute('aria-label', text);
  const cols = r.querySelectorAll('.d>span'); let k = 0;
  [...text].forEach(ch => { if(/\d/.test(ch)){ const c = cols[k]; c.style.transitionDelay = (k*35)+'ms'; c.style.transform = `translateY(${-ch}em)`; k++; } });
}

/* Segmented Control mit gleitendem Daumen */
function segInit(seg, value, onChange){
  const thumb = seg.querySelector('.thumb');
  const place = (animate=true) => {
    const b = seg.querySelector('[aria-selected="true"]'); if(!b) return;
    if(!animate) thumb.style.transition='none';
    thumb.style.width = b.offsetWidth+'px';
    thumb.style.transform = `translateX(${b.offsetLeft}px)`;
    if(!animate){ thumb.offsetWidth; thumb.style.transition=''; }
  };
  const set = (v, animate=true) => { seg.querySelectorAll('button').forEach(b=>b.setAttribute('aria-selected', b.dataset.v===v)); place(animate); };
  seg.addEventListener('click', e => { const b=e.target.closest('button'); if(!b) return; set(b.dataset.v); onChange(b.dataset.v); });
  set(value,false);
  new ResizeObserver(()=>place(false)).observe(seg);
  return set;
}

/* Kleine Gleit-Animation für Titelwechsel (Richtung -1/1) */
function slideSwap(el, dir, update){
  if(REDUCED || !el.animate){ update(); return; }
  const out = el.animate([{transform:'translateX(0)',opacity:1},{transform:`translateX(${-dir*28}px)`,opacity:0}],{duration:140,easing:'ease-in',fill:'forwards'});
  out.onfinish = () => { update(); out.cancel();
    el.animate([{transform:`translateX(${dir*28}px)`,opacity:0},{transform:'translateX(0)',opacity:1}],{duration:520,easing:SPRING}); };
}

/* Status-Insel */
let islandT;
function island(text, color='var(--good)', ms=1800){
  $('#islandText').textContent = text; $('#island .dot').style.background = color;
  $('#island').classList.add('show'); clearTimeout(islandT);
  if(ms) islandT = setTimeout(()=>$('#island').classList.remove('show'), ms);
}

/* ═══════════════════════════════════════════════════════════
   Daten: Demo oder GitHub (search-index.json, nur lesen)
   ═══════════════════════════════════════════════════════════ */
const TOP = {
  locations:['Zurich','Berlin','Basel','Milano','Naples','London','Luzern','Bern'],
  sport:['Velo','Schwimmen','Fitness','Laufen','Yoga','Pilates','Stangen'],
  people:['Nath','Frank','Paul','Mutter','Peter','Barbara'],
};
let DATA = new Map();   // date -> entry
let SOURCE = 'demo';

function rng(seed){ return () => (seed = (seed*16807) % 2147483647) / 2147483647; }
function demoData(){
  const r = rng(42), m = new Map(); let d = addDays(TODAY,-500);
  const pick = (arr,p) => arr.filter(()=>r()<p);
  const texts = ['Früh raus, Kaffee im Bonheur, dann lange an den Horizonte-Seiten gesessen.','Velo über den Albis, Wind von vorne, trotzdem schön.','Ruhiger Tag. Viel gelesen, abends mit Nath gekocht.','Studio, Abstimmung mit dem ETH-Team, danach Schwimmen.','Regen. Skizzen für die Webseite, nichts davon gut.','Langer Spaziergang am See, Kopf frei bekommen.','Zug nach Basel, Ausstellung angeschaut, spät zurück.'];
  while(d <= TODAY){
    const wd = parse(d).getDay(), we = wd===0||wd===6;
    if(r() < .9){
      const sport = pick(TOP.sport.slice(0,4), we ? .35 : .18);
      const velo = sport.includes('Velo');
      const loc = r()<.85 ? ['Zurich'] : [TOP.locations[1+Math.floor(r()*6)]];
      m.set(d,{date:d,
        coffee: Math.max(0,Math.round(2 + (we?-.5:.6) + (r()-.5)*3)),
        apples: Math.round(r()*2.4), bananas: Math.round(r()*1.6),
        mood: Math.max(-2,Math.min(2,Math.round(((r()-.38)*3.2 + (we?.4:0))*2)/2)),
        cycling_km: velo ? Math.round(20+r()*90) : 0,
        sport, locations: loc, people: pick(TOP.people, .14),
        text: r()<.7 ? texts[Math.floor(r()*texts.length)] : ''});
    }
    d = addDays(d,1);
  }
  return m;
}
function fromIndex(idx){
  const m = new Map(), L = s => (s||'').split(' ').filter(Boolean);
  idx.forEach(e => m.set(e.date,{date:e.date, coffee:+e.coffee||0, apples:+e.apples||0, bananas:+e.bananas||0, mood:+e.mood||0,
    cycling_km:+e.cycling_km||0, sport:L(e.sport), locations:L(e.locations), people:L(e.people), text:e.text||''}));
  return m;
}
function ghConfig(){ try{ return JSON.parse(localStorage.getItem('ghConfig')||'null'); }catch{ return null; } }
async function loadGithub(){
  const c = ghConfig(); if(!c?.token || !c?.privateRepo) throw new Error('Keine GitHub-Konfiguration auf dieser Domain gefunden');
  const res = await fetch(`https://api.github.com/repos/${c.privateRepo}/contents/search-index.json?ref=${c.branch||'main'}&_=${Date.now()}`,
    {headers:{Authorization:`token ${c.token}`,Accept:'application/vnd.github.v3+json'},cache:'no-store'});
  if(!res.ok) throw new Error('GitHub '+res.status);
  const j = await res.json();
  return JSON.parse(decodeURIComponent(escape(atob(j.content.replace(/\n/g,''))))).index;
}
async function setSource(src){
  try{
    if(src==='github'){ island('Lade Index …','var(--c-km)',0); DATA = fromIndex(await loadGithub()); island('GitHub · nur lesen','var(--c-km)'); }
    else { DATA = demoData(); island('Demo-Daten'); }
    SOURCE = src; try{ localStorage.setItem('abkSource',src); }catch{}
  }catch(e){ DATA = demoData(); SOURCE='demo'; island(e.message,'var(--bad)',3200); }
  renderEntry(0, true); renderStrip(true); renderDash(true);
}
const entryFor = d => DATA.get(d) || {date:d,coffee:0,apples:0,bananas:0,mood:0,cycling_km:0,sport:[],locations:['Zurich'],people:[],text:''};
function touch(e){ DATA.set(e.date,e); renderStrip(); dashDirty = true; saved(); }
let saveT; function saved(){ clearTimeout(saveT); saveT = setTimeout(()=>island(SOURCE==='demo'?'Gespeichert (lokal)':'Nur Vorschau, nicht gespeichert', SOURCE==='demo'?'var(--good)':'var(--banana,#ffd54f)'),700); }

/* ═══════════════════════════════════════════════════════════
   Ansichten + Dock
   ═══════════════════════════════════════════════════════════ */
let view = 'entry';
const scrollMem = {entry:0, dash:0};
function go(v){
  if(v===view) { window.scrollTo({top:0,behavior:'smooth'}); return; }
  const from = $('#v-'+view), to = $('#v-'+v), dir = v==='dash' ? 1 : -1;
  scrollMem[view] = scrollY; view = v;
  document.querySelectorAll('[data-go]').forEach(b => b.dataset.go===v ? b.setAttribute('aria-current','page') : b.removeAttribute('aria-current'));
  if(v==='dash' && dashDirty) renderDash(true);
  const swap = () => { from.hidden = true; to.hidden = false; window.scrollTo(0, scrollMem[v]); if(v==='dash') requestAnimationFrame(()=>growBars()); };
  if(REDUCED || !to.animate){ swap(); return; }
  from.animate([{opacity:1,transform:'none',filter:'blur(0)'},{opacity:0,transform:`translateX(${-dir*40}px)`,filter:'blur(4px)'}],{duration:160,easing:'ease-in'})
    .onfinish = () => { swap();
      to.animate([{opacity:0,transform:`translateX(${dir*60}px)`,filter:'blur(4px)'},{opacity:1,transform:'none',filter:'blur(0)'}],{duration:620,easing:SPRING}); };
}

/* Dock: Vergrösserung zum Zeiger hin, mit Lerp für Weichheit */
(function dock(){
  const dockEl = $('#dock'), items = [...dockEl.querySelectorAll('.dock-item')], tip = $('#dockTip');
  const MAG = 1.32, LIFT = 8, REACH = 2;
  let mx = null, cur = items.map(()=>1), raf = null;
  function frame(){
    let moving = false;
    items.forEach((it,i)=>{
      let target = 1;
      if(mx!==null){ const r = it.getBoundingClientRect(), c = r.left + r.width/2;
        const d = Math.abs(mx - c)/r.width; target = 1 + (MAG-1)*Math.max(0, 1 - d/REACH) ** 1.6; }
      cur[i] += (target - cur[i]) * .22;
      if(Math.abs(target-cur[i])>.001) moving = true;
      const lift = (cur[i]-1)/(MAG-1)*LIFT;
      it.style.transform = `translateY(${-lift}px) scale(${cur[i].toFixed(4)})`;
    });
    raf = moving ? requestAnimationFrame(frame) : null;
  }
  const kick = () => { if(!raf) raf = requestAnimationFrame(frame); };
  if(FINE && !REDUCED){
    dockEl.addEventListener('pointermove', e => { mx = e.clientX; kick(); });
    dockEl.addEventListener('pointerleave', () => { mx = null; kick(); tip.classList.remove('show'); });
  }
  items.forEach(it => {
    it.addEventListener('pointerenter', () => { if(!FINE) return;
      tip.textContent = it.dataset.tip;
      const left = it.offsetLeft + it.offsetWidth/2 - tip.offsetWidth/2;
      if(!tip.classList.contains('show')){ tip.style.transition='none'; tip.style.left = left+'px'; tip.offsetWidth; tip.style.transition=''; }
      tip.style.left = left+'px'; tip.classList.add('show'); });
    it.addEventListener('click', () => {
      if(it.dataset.go) go(it.dataset.go);
      if(it.dataset.act==='search') openSearch();
      if(it.dataset.act==='settings') openSettings();
      it.animate && !REDUCED && it.animate([{translate:'0 0'},{translate:'0 -6px'},{translate:'0 0'}],{duration:420,easing:'cubic-bezier(.3,1.6,.5,1)'});
    });
  });
  document.querySelector('[data-go="entry"]').setAttribute('aria-current','page');
})();

/* ═══════════════════════════════════════════════════════════
   ERFASSEN
   ═══════════════════════════════════════════════════════════ */
let cur = TODAY;
const COUNTERS = [['coffee','Kaffee','var(--c-coffee)'],['apples','Äpfel','var(--c-apple)'],['bananas','Bananen','var(--c-banana)']];

function renderEntry(dir=0, first=false){
  const e = entryFor(cur), d = parse(cur);
  const head = () => {
    const rel = cur===TODAY ? 'Heute · ' : cur===addDays(TODAY,-1) ? 'Gestern · ' : '';
    $('#dayWd').textContent = `${rel}${WD[d.getDay()]} · ${d.getFullYear()}`;
    $('#dayDate').textContent = `${d.getDate()}. ${MON[d.getMonth()]}`;
  };
  dir && !first ? slideSwap($('#dayTitle'), dir, head) : head();
  $('#todayBtn').hidden = cur===TODAY;
  $('#nextDay').disabled = false;

  COUNTERS.forEach(([k]) => roll($('#cnt-'+k), e[k]));
  setMood(e.mood, false);
  renderChips(e);
  const ta = $('#entry'); ta.value = e.text || ''; autosize(ta); wordCount();
}

function buildCounters(){
  $('#counters').innerHTML = COUNTERS.map(([k,l,c]) => `
    <div class="counter">
      <span class="cl label"><i class="sw" style="background:${c}"></i>${l}</span>
      <span class="val" id="cnt-${k}"><span class="roll"></span></span>
      <div class="ctrl"><button class="press" data-k="${k}" data-d="-1" aria-label="${l} weniger">−</button><button class="press" data-k="${k}" data-d="1" aria-label="${l} mehr">+</button></div>
    </div>`).join('');
  $('#counters').addEventListener('click', ev => {
    const b = ev.target.closest('button[data-k]'); if(!b) return;
    const e = {...entryFor(cur)}; e[b.dataset.k] = Math.max(0, (e[b.dataset.k]||0) + +b.dataset.d);
    roll($('#cnt-'+b.dataset.k), e[b.dataset.k]); touch(e);
  });
}

function setDay(d){
  if(d===cur) return;
  const dir = d > cur ? 1 : -1; cur = d; renderEntry(dir); renderStrip(); centerStrip();
}
$('#prevDay').onclick = () => setDay(addDays(cur,-1));
$('#nextDay').onclick = () => setDay(addDays(cur,1));
$('#todayBtn').onclick = () => setDay(TODAY);
addEventListener('keydown', e => {
  if(view!=='entry' || e.target.closest('input,textarea,[role=slider]')) return;
  if(e.key==='ArrowLeft') setDay(addDays(cur,-1));
  if(e.key==='ArrowRight') setDay(addDays(cur,1));
});

/* Wischen über den Tageskopf wechselt den Tag, der Titel folgt dem Finger */
(function swipeDay(){
  const h = $('#dayHead'), t = $('#dayTitle'); let x0=null, y0=0, dx=0, lock=null;
  h.addEventListener('pointerdown', e => { if(e.target.closest('button')) return; x0=e.clientX; y0=e.clientY; dx=0; lock=null; });
  h.addEventListener('pointermove', e => { if(x0===null) return;
    dx = e.clientX-x0; const dy = e.clientY-y0;
    if(lock===null && Math.hypot(dx,dy)>6) lock = Math.abs(dx)>Math.abs(dy) ? 'x' : 'y';
    if(lock==='x'){ h.setPointerCapture(e.pointerId); t.style.transition='none'; t.style.transform=`translateX(${dx*.6}px)`; t.style.opacity = 1-Math.min(.6,Math.abs(dx)/300); } });
  const end = () => { if(x0===null) return; x0=null;
    t.style.transition='transform .5s var(--spring), opacity .3s'; t.style.transform=''; t.style.opacity='';
    if(lock==='x' && Math.abs(dx)>50){ setTimeout(()=>setDay(addDays(cur, dx<0?1:-1)), 0); } };
  h.addEventListener('pointerup', end); h.addEventListener('pointercancel', end);
})();

/* Leiste mit 8 Wochen, Mini-Balken je Tag */
function renderStrip(rebuild=false){
  const s = $('#strip');
  const start = (()=>{ const d=parse(addDays(cur,-42)); const off=(d.getDay()+6)%7; d.setDate(d.getDate()-off); return iso(d); })();
  if(rebuild || s.dataset.start!==start){
    s.dataset.start = start; let html='';
    for(let i=0;i<70;i++){ const d=addDays(start,i), dt=parse(d);
      html += `<button class="sd press${dt.getDay()===1&&i?' weekstart':''}" data-d="${d}"><span class="w">${WD2[dt.getDay()]}</span><span class="n">${dt.getDate()}</span><span class="mini"></span></button>`; }
    s.innerHTML = html; requestAnimationFrame(()=>centerStrip(false));
  }
  s.querySelectorAll('.sd').forEach(b => { const d=b.dataset.d, e=DATA.get(d);
    b.classList.toggle('sel', d===cur); b.classList.toggle('today', d===TODAY); b.classList.toggle('future', d>TODAY);
    const mini = b.querySelector('.mini');
    mini.innerHTML = e ? [['coffee','--c-coffee'],['apples','--c-apple'],['bananas','--c-banana']].map(([k,c])=>e[k]?`<i style="height:${Math.min(8,e[k]*2)}px;background:var(${c})"></i>`:'').join('') : '';
  });
}
function centerStrip(smooth=true){
  const s=$('#strip'), b=s.querySelector('.sd.sel'); if(!b) return;
  s.scrollTo({left:b.offsetLeft - s.clientWidth/2 + b.offsetWidth/2, behavior: smooth&&!REDUCED ? 'smooth':'auto'});
}
$('#strip').addEventListener('click', e => { const b=e.target.closest('.sd'); if(b) setDay(b.dataset.d); });

/* Stimmungs-Slider: folgt dem Finger frei, rastet federnd ein */
const STEPS = [-2,-1.5,-1,-.5,0,.5,1,1.5,2];
let moodV = 0;
function setMood(v, commit=true){
  moodV = v; const k = moodKey(v), sl = $('#mood');
  roll($('#moodVal'), (v>0?'+':v<0?'−':'')+String(Math.abs(v)).replace('.',','));
  $('#moodVal').style.color = MOOD_COL[k]; $('#moodWord').textContent = MOOD_WORD[k];
  sl.setAttribute('aria-valuenow', v); sl.setAttribute('aria-valuetext', MOOD_WORD[k]);
  if(!sl.classList.contains('drag')){ sl.classList.add('snap'); sl.querySelector('.knob').style.left = ((v+2)/4*100)+'%'; }
  if(commit){ const e={...entryFor(cur), mood:v}; touch(e); }
}
(function slider(){
  const sl=$('#mood'), knob=sl.querySelector('.knob');
  sl.querySelector('.track').innerHTML = STEPS.map((_,i)=>`<span class="tick" style="left:${i/8*100}%"></span>`).join('');
  const valAt = x => { const r=sl.getBoundingClientRect(); return Math.max(0,Math.min(1,(x-r.left)/r.width)); };
  let down=false;
  sl.addEventListener('pointerdown', e => { down=true; sl.setPointerCapture(e.pointerId); sl.classList.remove('snap'); sl.classList.add('drag'); move(e); });
  const move = e => { if(!down) return; const p=valAt(e.clientX); knob.style.left=(p*100)+'%';
    const v = Math.round(p*8)/2-2; if(v!==moodV){ moodV=v; setMood(v,false); if(navigator.vibrate) navigator.vibrate(4); } };
  sl.addEventListener('pointermove', move);
  const up = () => { if(!down) return; down=false; sl.classList.remove('drag'); setMood(moodV); };
  sl.addEventListener('pointerup', up); sl.addEventListener('pointercancel', up);
  sl.addEventListener('keydown', e => { const i=STEPS.indexOf(moodV);
    if(['ArrowRight','ArrowUp'].includes(e.key)){ e.preventDefault(); setMood(STEPS[Math.min(8,i+1)]); }
    if(['ArrowLeft','ArrowDown'].includes(e.key)){ e.preventDefault(); setMood(STEPS[Math.max(0,i-1)]); } });
})();

/* Chips: Orte, Sport, Personen */
const CHIP_GROUPS = [['locations','Ort'],['sport','Sport'],['people','Personen']];
function renderChips(e){
  const card = $('#chipCard');
  card.innerHTML = CHIP_GROUPS.map(([k,l]) => {
    const opts = [...new Set([...e[k], ...TOP[k]])];
    return `<div class="chip-group"><span class="label">${l}</span><div class="chips" data-k="${k}">
      ${opts.map(o=>`<button class="chip${e[k].includes(o)?' on':''}" data-v="${esc(o)}"><span class="cd"></span>${esc(o)}</button>`).join('')}
      <input class="chip-add" data-k="${k}" placeholder="+ Neu" enterkeyhint="done"></div>
      ${k==='sport'?`<div class="expand${e.sport.includes('Velo')?' open':''}" id="kmWrap"><div><div class="km-row"><span class="label">Velo</span>
        <input id="km" type="number" inputmode="numeric" min="0" placeholder="km" value="${e.cycling_km||''}"><span class="card-sub">km</span></div></div></div>`:''}
    </div>`; }).join('');
}
$('#chipCard').addEventListener('click', ev => {
  const b = ev.target.closest('.chip'); if(!b) return;
  const k = b.parentElement.dataset.k, v = b.dataset.v, e = {...entryFor(cur)};
  e[k] = e[k].includes(v) ? e[k].filter(x=>x!==v) : [...e[k], v];
  b.classList.toggle('on');
  if(k==='sport'){ $('#kmWrap').classList.toggle('open', e.sport.includes('Velo')); if(!e.sport.includes('Velo')) e.cycling_km=0; }
  touch(e);
});
$('#chipCard').addEventListener('keydown', ev => {
  const inp = ev.target.closest('.chip-add'); if(!inp || ev.key!=='Enter') return;
  const v = inp.value.trim().replace(/\s+/g,'_'); if(!v) return;
  const k = inp.dataset.k, e = {...entryFor(cur)}; if(!e[k].includes(v)) e[k]=[...e[k],v];
  if(!TOP[k].includes(v)) TOP[k].push(v);
  touch(e); renderChips(e); $(`.chip-add[data-k="${k}"]`).focus();
});
$('#chipCard').addEventListener('input', ev => { if(ev.target.id==='km'){ touch({...entryFor(cur), cycling_km:+ev.target.value||0}); } });

/* Eintrag */
function autosize(t){ if(CSS.supports('field-sizing','content')) return; t.style.height='auto'; t.style.height=t.scrollHeight+'px'; }
function wordCount(){ const n=($('#entry').value.trim().match(/\S+/g)||[]).length; $('#wordCount').textContent = n ? n+' Wörter' : ''; }
$('#entry').addEventListener('input', e => { autosize(e.target); wordCount(); touch({...entryFor(cur), text:e.target.value}); });

/* ═══════════════════════════════════════════════════════════
   DASHBOARD
   ═══════════════════════════════════════════════════════════ */
let per = 'month', anchor = TODAY, meterKind = 'sport', dashDirty = true;

function range(){
  const d = parse(anchor);
  if(per==='week'){ const off=(d.getDay()+6)%7; const s=addDays(anchor,-off); return {from:s, to:addDays(s,6),
    label:`KW ${kw(parse(s))} · ${parse(s).getDate()}.–${parse(addDays(s,6)).getDate()}. ${MON3[parse(addDays(s,6)).getMonth()]}`}; }
  if(per==='month'){ const s=iso(new Date(d.getFullYear(),d.getMonth(),1)), e=iso(new Date(d.getFullYear(),d.getMonth()+1,0)); return {from:s,to:e,label:`${MON[d.getMonth()]} ${d.getFullYear()}`}; }
  return {from:`${d.getFullYear()}-01-01`, to:`${d.getFullYear()}-12-31`, label:String(d.getFullYear())};
}
function kw(d){ const t=new Date(Date.UTC(d.getFullYear(),d.getMonth(),d.getDate())); const n=t.getUTCDay()||7; t.setUTCDate(t.getUTCDate()+4-n); const y=new Date(Date.UTC(t.getUTCFullYear(),0,1)); return Math.ceil(((t-y)/864e5+1)/7); }
function entriesIn(from,to){ const out=[]; for(let d=from; d<=to && d<=TODAY; d=addDays(d,1)){ const e=DATA.get(d); if(e) out.push(e); } return out; }
const sum = (E,k) => E.reduce((s,e)=>s+(+e[k]||0),0);
function daysElapsed(from,to){ const end = to<TODAY?to:TODAY; return Math.max(1, Math.round((parse(end)-parse(from))/864e5)+1); }

function shiftPeriod(n){
  const d = parse(anchor);
  if(per==='week') d.setDate(d.getDate()+7*n);
  if(per==='month') d.setMonth(d.getMonth()+n, 1);
  if(per==='year') d.setFullYear(d.getFullYear()+n, 0, 1);
  anchor = iso(d); renderDash(true, n);
}
$('#prevPer').onclick = () => shiftPeriod(-1);
$('#nextPer').onclick = () => shiftPeriod(1);
const setPerSeg = segInit($('#perSeg'), per, v => { per=v; anchor = cur; renderDash(true); });
segInit($('#meterSeg'), meterKind, v => { meterKind=v; renderMeter(); });

let COLS = [];
function renderDash(regrow=false, dir=0){
  dashDirty = false;
  const R = range(), E = entriesIn(R.from, R.to), n = daysElapsed(R.from, R.to);
  dir ? slideSwap($('#periodLabel'), dir, ()=>$('#periodLabel').textContent=R.label) : ($('#periodLabel').textContent=R.label);
  $('#nextPer').disabled = R.to >= TODAY; $('#nextPer').style.opacity = R.to>=TODAY ? .35 : 1;

  /* Kennzahlen */
  const S = [['coffee','Kaffee','var(--c-coffee)'],['apples','Äpfel','var(--c-apple)'],['bananas','Bananen','var(--c-banana)'],['cycling_km','Velo km','var(--c-km)']];
  if(!$('#stats').children.length) $('#stats').innerHTML = S.map(([k,l,c])=>`<div class="stat"><div class="cl"><i class="sw" style="background:${c}"></i>${l}</div><div class="big" id="st-${k}"><span class="roll"></span></div><div class="avg" id="av-${k}"></div></div>`).join('');
  S.forEach(([k]) => { const t=sum(E,k); roll($('#st-'+k), fmt0(t)); $('#av-'+k).textContent = `⌀ ${fmt1(t/n)} pro Tag`; });

  /* Spalten: Tage (Woche/Monat) oder Monate (Jahr) */
  if(per==='year'){
    const y = R.from.slice(0,4);
    COLS = MON3.map((m,i)=>{ const f=`${y}-${pad(i+1)}-01`, t=iso(new Date(+y,i+1,0)); const Es=entriesIn(f,t);
      return {key:f, label:m, title:`${MON[i]} ${y}`, coffee:sum(Es,'coffee'), apples:sum(Es,'apples'), bananas:sum(Es,'bananas'),
        mood: Es.length ? sum(Es,'mood')/Es.length : null, future: f>TODAY, n:Es.length}; });
    $('#chartSub').textContent = 'Summe pro Monat';
  } else {
    COLS = []; for(let d=R.from; d<=R.to; d=addDays(d,1)){ const e=DATA.get(d), dt=parse(d);
      COLS.push({key:d, label: per==='week' ? WD2[dt.getDay()] : String(dt.getDate()), title:`${WD[dt.getDay()]}, ${dt.getDate()}. ${MON[dt.getMonth()]}`,
        coffee:e?.coffee||0, apples:e?.apples||0, bananas:e?.bananas||0, mood: e ? e.mood : null, future:d>TODAY, n:e?1:0}); }
    $('#chartSub').textContent = per==='week' ? 'pro Tag' : 'pro Tag · antippen öffnet den Tag';
  }
  const max = Math.max(1, ...COLS.map(c=>c.coffee+c.apples+c.bananas));
  const gap = COLS.length>20 ? 1.5 : COLS.length>10 ? 3 : 6;
  $('#chartCols').style.setProperty('--gap', gap+'px');
  $('#chartCols').innerHTML = COLS.map((c,i)=>`<div class="ccol" data-i="${i}" style="opacity:${c.future?.25:1}">
      <div class="up">${['coffee','apples','bananas'].map(k=>`<div class="seg-b" data-h="${c[k]/max*100}" style="background:var(--c-${k==='coffee'?'coffee':k==='apples'?'apple':'banana'});transition-delay:${i*14}ms"></div>`).join('')}</div>
      <div class="dn">${c.mood!==null&&c.mood!==0?`<div class="seg-b" data-h="${Math.abs(c.mood)/2*100}" style="background:${c.mood>0?'var(--good)':'var(--bad)'};opacity:.85;transition-delay:${i*14+120}ms"></div>`:''}</div>
    </div>`).join('');
  const first=COLS[0], last=COLS[COLS.length-1];
  $('#chartFoot').innerHTML = `<span>${per==='year'?first.label:first.title.split(', ')[1]}</span><span>${per==='year'?last.label:last.title.split(', ')[1]}</span>`;
  if(view==='dash') requestAnimationFrame(()=>requestAnimationFrame(growBars));

  /* Meter + Stimmungsfeld */
  METER_E = E; renderMeter();
  const withMood = E.filter(e=>e.mood!==undefined), avg = withMood.length ? sum(withMood,'mood')/withMood.length : 0;
  roll($('#moodAvg'), (avg>0?'+':avg<0?'−':'')+fmt1(Math.abs(avg))); $('#moodAvg').style.color = MOOD_COL[moodKey(avg)];
  $('#moodSub').textContent = `⌀ über ${E.length} Einträge`;
  const fd = []; for(let d=R.from; d<=R.to; d=addDays(d,1)) fd.push(d);
  $('#field').innerHTML = fd.map((d,i)=>{ const e=DATA.get(d); const fut=d>TODAY;
    return `<i class="${e?'':'empty'}" data-d="${e?d:''}" title="${parse(d).getDate()}. ${MON3[parse(d).getMonth()]}${e?' · '+(e.mood>0?'+':'')+e.mood:''}"
      style="background:${e?MOOD_COL[moodKey(e.mood)]:'var(--surface-3)'};opacity:${fut?.12:e?1:.35};transition-delay:${Math.min(i,120)*4}ms"></i>`; }).join('');
}
function growBars(){ document.querySelectorAll('#chartCols .seg-b').forEach(b=>b.style.height=b.dataset.h+'%'); }

/* Scrubben über die Balken: Ring + Tooltip gleiten mit, Tippen öffnet den Tag */
(function scrub(){
  const ch=$('#chart'), ring=$('#ring'), tip=$('#tip'); let act=-1, downX=null, moved=false;
  const idxAt = x => { const r=ch.getBoundingClientRect(); return Math.max(0,Math.min(COLS.length-1, Math.floor((x-r.left)/r.width*COLS.length))); };
  function show(i){
    if(i===act) return; act=i; const c=COLS[i]; if(!c) return;
    const w = ch.clientWidth/COLS.length;
    ring.style.width = Math.max(14,w)+'px'; ring.style.transform = `translateX(${i*w + w/2 - Math.max(14,w)/2}px)`;
    ch.querySelectorAll('.ccol').forEach((el,j)=>el.classList.toggle('act', j===i));
    const mood = c.mood===null ? '–' : (c.mood>0?'+':'')+fmt1(c.mood);
    tip.innerHTML = `<b>${c.title}</b>
      <div class="r"><i class="sw" style="background:var(--c-coffee)"></i>Kaffee<span>${c.coffee}</span></div>
      <div class="r"><i class="sw" style="background:var(--c-apple)"></i>Äpfel<span>${c.apples}</span></div>
      <div class="r"><i class="sw" style="background:var(--c-banana)"></i>Bananen<span>${c.bananas}</span></div>
      <div class="r"><i class="sw" style="background:${c.mood===null?'#555':MOOD_COL[moodKey(c.mood)]}"></i>Stimmung<span>${mood}</span></div>`;
    const tw = tip.offsetWidth, x = Math.max(tw/2-4, Math.min(ch.clientWidth-tw/2+4, i*w+w/2));
    if(!ch.classList.contains('dim')){ tip.style.transition='opacity .2s'; tip.style.left=x+'px'; tip.offsetWidth; tip.style.transition=''; }
    tip.style.left = x+'px'; ch.classList.add('dim');
  }
  const hide = () => { act=-1; ch.classList.remove('dim'); ch.querySelectorAll('.ccol.act').forEach(el=>el.classList.remove('act')); };
  ch.addEventListener('pointerdown', e => { downX=e.clientX; moved=false; show(idxAt(e.clientX)); });
  ch.addEventListener('pointermove', e => { if(downX!==null && Math.abs(e.clientX-downX)>8) moved=true; if(e.pointerType==='mouse'||downX!==null) show(idxAt(e.clientX)); });
  ch.addEventListener('pointerleave', e => { if(e.pointerType==='mouse') hide(); });
  ch.addEventListener('pointercancel', () => { downX=null; hide(); });
  ch.addEventListener('pointerup', e => {
    const i = idxAt(e.clientX), c = COLS[i]; const tap = !moved; downX=null;
    if(e.pointerType!=='mouse') setTimeout(hide, 900);
    if(!tap || !c || c.future) return;
    if(per==='year'){ anchor=c.key; per='month'; setPerSeg('month'); hide(); renderDash(true); }
    else { openDay(c.key); }
  });
})();

/* Meter im Stil eines Kontext-Balkens */
let METER_E = [], meterHl = null;
const PALETTE = ['#22b8cf','#4c8dff','#a06bff','#ef5da8','#2ecc71','#ffb84d'];
function renderMeter(){
  const counts = {}; METER_E.forEach(e => (e[meterKind]||[]).forEach(v=>counts[v]=(counts[v]||0)+1));
  let rows = Object.entries(counts).sort((a,b)=>b[1]-a[1]);
  if(rows.length>6){ const rest=rows.slice(5).reduce((s,r)=>s+r[1],0); rows = [...rows.slice(0,5), ['Andere',rest]]; }
  const total = rows.reduce((s,r)=>s+r[1],0);
  const bar = $('#meterBar'), leg = $('#meterLegend');
  bar.innerHTML = rows.map((r,i)=>`<i data-i="${i}" style="background:${PALETTE[i]}"></i>`).join('') || '<i style="flex-basis:100%;background:var(--surface-3)"></i>';
  leg.innerHTML = rows.map((r,i)=>`<button class="ml press" data-i="${i}"><i class="sw" style="background:${PALETTE[i]}"></i>${esc(r[0])}<span class="c">${r[1]}</span></button>`).join('') || '<span class="muted">Keine Daten in diesem Zeitraum</span>';
  requestAnimationFrame(()=>requestAnimationFrame(()=>bar.querySelectorAll('i[data-i]').forEach((el,i)=>el.style.flexBasis = `calc(${rows[i][1]/total*100}% - 3px)`)));
  const unit = {sport:'Einheiten',locations:'Tage mit Ort',people:'Begegnungen'}[meterKind];
  const hl = i => { meterHl=i;
    bar.classList.toggle('dim', i!==null); bar.querySelectorAll('i').forEach(el=>el.classList.toggle('hl', +el.dataset.i===i));
    leg.querySelectorAll('.ml').forEach(el=>el.classList.toggle('hl', +el.dataset.i===i));
    if(i===null){ roll($('#meterBig'), fmt0(total)); $('#meterOf').textContent = unit; }
    else { roll($('#meterBig'), fmt0(rows[i][1])); $('#meterOf').textContent = `${rows[i][0]} · ${Math.round(rows[i][1]/total*100)} %`; } };
  hl(null);
  leg.onpointerover = e => { const b=e.target.closest('.ml'); if(b && FINE) hl(+b.dataset.i); };
  leg.onpointerleave = () => FINE && hl(null);
  leg.onclick = e => { const b=e.target.closest('.ml'); if(!b) return; hl(meterHl===+b.dataset.i && !FINE ? null : +b.dataset.i); };
  bar.onpointermove = e => { const s=e.target.closest('i[data-i]'); if(s) hl(+s.dataset.i); };
  bar.onpointerleave = () => hl(null);
}
$('#field').addEventListener('click', e => { const d=e.target.closest('i')?.dataset.d; if(d) openDay(d); });

function openDay(d){ const dir = d>cur?1:-1; cur=d; go('entry'); setTimeout(()=>{ renderEntry(dir); renderStrip(); centerStrip(false); }, REDUCED?0:170); }

/* ═══════════════════════════════════════════════════════════
   Sheet (Einstellungen, Suche) – auf Mobile zum Schliessen ziehen
   ═══════════════════════════════════════════════════════════ */
function openSheet(html, onOpen){
  $('#sheetContent').innerHTML = html; $('#scrim').classList.add('open'); $('#sheet').classList.add('open');
  onOpen && setTimeout(onOpen, 60);
}
function closeSheet(){ $('#scrim').classList.remove('open'); $('#sheet').classList.remove('open'); $('#sheet').style.transform=''; }
$('#scrim').onclick = closeSheet;
addEventListener('keydown', e => { if(e.key==='Escape') closeSheet(); if((e.metaKey||e.ctrlKey) && e.key==='k'){ e.preventDefault(); openSearch(); } });
(function dragSheet(){
  const g=$('#grab'), sh=$('#sheet'); let y0=null, dy=0, t0=0;
  g.addEventListener('pointerdown', e => { y0=e.clientY; dy=0; t0=performance.now(); g.setPointerCapture(e.pointerId); sh.classList.add('dragging'); });
  g.addEventListener('pointermove', e => { if(y0===null) return; dy=Math.max(0,e.clientY-y0); sh.style.transform=`translate(-50%,${dy}px)`; });
  const end = () => { if(y0===null) return; const v = dy/(performance.now()-t0); y0=null; sh.classList.remove('dragging');
    if(dy>120 || v>.6) closeSheet(); else sh.style.transform=''; };
  g.addEventListener('pointerup', end); g.addEventListener('pointercancel', end);
})();
const closeBtn = `<button class="icon-btn press" onclick="closeSheet()" aria-label="Schliessen"><svg class="ico" viewBox="0 0 24 24"><path d="M18 6 6 18M6 6l12 12"/></svg></button>`;

function openSettings(){
  const has = !!ghConfig()?.token;
  openSheet(`<h2>Einstellungen ${closeBtn}</h2><div class="sheet-body">
    <button class="opt press" style="width:100%;text-align:left" onclick="setSource('demo');closeSheet()">
      <i class="sw" style="width:10px;height:10px;border-radius:50%;background:${SOURCE==='demo'?'var(--good)':'var(--surface-3)'}"></i>
      <span><strong>Demo-Daten</strong><p>500 erfundene Tage zum Ausprobieren. Änderungen bleiben im Browser-Tab.</p></span></button>
    <button class="opt press" style="width:100%;text-align:left;${has?'':'opacity:.5'}" ${has?'':'disabled'} onclick="setSource('github');closeSheet()">
      <i class="sw" style="width:10px;height:10px;border-radius:50%;background:${SOURCE==='github'?'var(--c-km)':'var(--surface-3)'}"></i>
      <span><strong>Meine Daten (GitHub, nur lesen)</strong><p>${has?'Liest search-index.json mit der Verbindung aus Erfassen.':'Keine Verbindung gefunden. Funktioniert, wenn diese Seite auf derselben Domain wie Erfassen liegt.'}</p></span></button>
    <p class="muted">Prototyp: Speichern ins Repo, Export und Spracheingabe kommen beim Zusammenführen aus der bestehenden Erfassen-Seite dazu.</p>
  </div>`);
}

function openSearch(){
  openSheet(`<h2>Suche ${closeBtn}</h2><input class="search-in" id="q" placeholder="Text, Ort, Person …" autocomplete="off"><div class="sheet-body" id="hits"></div>`,
    () => { const q=$('#q'); q.focus(); q.oninput = () => runSearch(q.value); runSearch(''); });
}
function runSearch(q){
  q = q.trim().toLowerCase(); const out=[];
  if(q.length<2){ $('#hits').innerHTML = '<p class="muted">Mindestens zwei Zeichen eingeben.</p>'; return; }
  for(const e of [...DATA.values()].reverse()){
    const hay = [e.text, ...e.locations, ...e.people, ...e.sport].join(' ').toLowerCase();
    if(hay.includes(q)) out.push(e); if(out.length>=40) break;
  }
  const re = new RegExp(q.replace(/[.*+?^${}()|[\]\\]/g,'\\$&'),'ig');
  const d = s => { const x=parse(s); return `${WD2[x.getDay()]} ${x.getDate()}. ${MON[x.getMonth()]} ${x.getFullYear()}`; };
  $('#hits').innerHTML = out.length ? out.map(e=>`<button class="hit press" data-d="${e.date}"><div class="hd">${d(e.date)}</div>
    <div class="ht">${esc(e.text || [...e.locations,...e.people,...e.sport].join(' · ')).replace(re,m=>`<mark>${m}</mark>`)}</div></button>`).join('')
    : '<p class="muted">Nichts gefunden.</p>';
  $('#hits').onclick = ev => { const b=ev.target.closest('.hit'); if(b){ closeSheet(); openDay(b.dataset.d); } };
}

buildCounters();
let startSrc = 'demo'; try{ startSrc = localStorage.getItem('abkSource') || 'demo'; }catch{}
setSource(startSrc==='github' && ghConfig()?.token ? 'github' : 'demo');
