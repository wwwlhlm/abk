<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="format-detection" content="telephone=no">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
  <title>Dashboard</title>
  <style>
    :root {
      --bg:        #1a1a1a;
      --surface:   #262626;
      --surface-2: #2f2f2f;
      --border:    #383838;
      --border-2:  #444444;
      --text:      #ececec;
      --text-2:    #a0a0a0;
      --text-3:    #666666;
      --accent:    #FD939F;
      --accent-bg: rgba(253,147,159,.12);
      --error:     #e57373;
      --good:      #81c784;
      --radius:    11px;
      --c-apple:   #81c784;
      --c-banana:  #ffd54f;
      --c-coffee:  #FD939F;
      --c-km:      #64b5f6;
    }
    * { margin:0; padding:0; box-sizing:border-box; }
    body {
      font-family: ui-sans-serif, system-ui, -apple-system, sans-serif;
      font-size: 15px; line-height: 1.5;
      background: var(--bg); color: var(--text);
      min-height: 100vh; -webkit-font-smoothing: antialiased;
    }

    /* ── Header ─────────────────────────────────────────────── */
    .header-wrap {
      position: sticky; top: 0; z-index: 50;
      background: var(--bg); border-bottom: 1px solid var(--border);
    }
    .header-inner {
      display: flex; align-items: center; justify-content: space-between;
      padding: 11px 18px; position: relative;
    }
    .header-left, .header-right { display: flex; align-items: center; gap: 4px; }
    /* Absolute-centered like capture.html date nav */
    .header-center {
      position: absolute; left: 50%; transform: translateX(-50%);
      display: flex; align-items: center; gap: 6px;
    }

    /* Borderless icon button (35×35, icon 18×18, stroke 1.8) */
    .hdr-icon {
      width: 35px; height: 35px; border: none; background: transparent;
      color: var(--text-3); display: flex; align-items: center;
      justify-content: center; cursor: pointer; transition: color .15s;
      flex-shrink: 0; position: relative; padding: 0;
    }
    .hdr-icon:hover { color: var(--text); }
    .hdr-icon svg { width: 18px; height: 18px; stroke: currentColor; fill: none; stroke-width: 1.8; }
    .gh-dot {
      position: absolute; top: 5px; right: 4px;
      width: 7px; height: 7px; border-radius: 50%;
      background: var(--error); border: 1.5px solid var(--bg); transition: background .2s;
    }
    .hdr-icon.ok .gh-dot { background: #60a5fa; }

    /* ── Period picker (adapted from capture.html datepicker) ── */
    .pp-overlay { position:fixed;inset:0;z-index:200;display:none; }
    .pp-overlay.open { display:block; }
    .pp-backdrop { position:fixed;inset:0; }
    .pp-panel {
      position:absolute;top:64px;left:50%;transform:translateX(-50%);
      background:var(--surface);border:1px solid var(--border-2);
      border-radius:13px;box-shadow:0 13px 44px rgba(0,0,0,.6);
      padding:18px;width:308px;user-select:none;z-index:201;
    }
    .pp-head { display:flex;align-items:center;justify-content:space-between;margin-bottom:15px; }
    .pp-title { font-size:15px;font-weight:600;color:var(--text);cursor:pointer;transition:color .15s; }
    .pp-title:hover { color:var(--accent); }
    .pp-nav {
      width:31px;height:31px;border-radius:7px;border:1px solid var(--border);
      background:transparent;color:var(--text-3);display:flex;align-items:center;
      justify-content:center;cursor:pointer;transition:all .15s;flex-shrink:0;
    }
    .pp-nav:hover { background:var(--surface-2);color:var(--text);border-color:var(--border-2); }
    .pp-nav svg { width:14px;height:14px;stroke:currentColor;fill:none;stroke-width:2.5; }
    /* Year grid: 3 columns like capture.html */
    .pp-years { display:grid;grid-template-columns:repeat(3,1fr);gap:7px; }
    .pp-year-btn {
      padding:9px 4px;border-radius:8px;border:1px solid var(--border);background:transparent;
      font-size:14px;color:var(--text-2);cursor:pointer;transition:all .15s;text-align:center;font-family:inherit;
    }
    .pp-year-btn:hover { background:var(--surface-2);color:var(--text);border-color:var(--border-2); }
    .pp-year-btn.selected { background:var(--accent-bg);color:var(--accent);border-color:rgba(253,147,159,.4); }
    .pp-year-btn.all { color:var(--text-3);border-style:dashed; }
    .pp-year-btn.all.selected { color:var(--accent);border-style:solid; }
    /* Month grid: 3 columns */
    .pp-months { display:grid;grid-template-columns:repeat(3,1fr);gap:7px; }
    .pp-month-btn {
      padding:9px 4px;border-radius:8px;border:1px solid var(--border);background:transparent;
      font-size:14px;color:var(--text-2);cursor:pointer;transition:all .15s;text-align:center;font-family:inherit;
    }
    .pp-month-btn:hover { background:var(--surface-2);color:var(--text);border-color:var(--border-2); }
    .pp-month-btn.selected { background:var(--accent-bg);color:var(--accent);border-color:rgba(253,147,159,.4); }
    .pp-month-btn.all { color:var(--text-3);border-style:dashed;grid-column:1/-1;margin-top:4px; }
    .pp-month-btn.all.selected { color:var(--accent);border-style:solid; }
    .pp-month-btn.empty { visibility:hidden;pointer-events:none; }
    /* Single period button in header */
    .period-btn {
      height:37px;padding:0 13px;border-radius:9px;
      border:1px solid var(--border);background:var(--surface);
      font-size:14px;color:var(--text-2);cursor:pointer;
      display:inline-flex;align-items:center;gap:7px;
      transition:all .15s;font-family:inherit;white-space:nowrap;
    }
    .period-btn:hover { background:var(--surface-2);color:var(--text);border-color:var(--border-2); }
    .period-btn.active { background:var(--accent-bg);color:var(--accent);border-color:rgba(253,147,159,.4); }

    /* ── Layout ─────────────────────────────────────────────── */
    /* Single column up to 580px; two-col for lower cards 580+;
       wider page from 1056px (like capture.html) */
    .page {
      padding: 22px 18px 110px;
      display: flex; flex-direction: column; gap: 13px;
      max-width: 638px; margin: 0 auto;
    }
    @media (min-width: 1056px) {
      .page { max-width: 1210px; padding: 22px 26px 110px; }
    }
    .cols { display: flex; flex-direction: column; gap: 13px; }
    .col  { display: flex; flex-direction: column; gap: 13px; }
    @media (min-width: 580px) {
      .cols { display: grid; grid-template-columns: 1fr 1fr; column-gap: 13px; }
    }
    @media (min-width: 1056px) {
      .cols { column-gap: 22px; }
    }

    /* ── Cards ──────────────────────────────────────────────── */
    .card { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); overflow: hidden; }
    .card-head {
      height: 40px; display: flex; align-items: center; gap: 9px;
      padding: 0 15px; border-bottom: 1px solid var(--border); flex-shrink: 0;
    }
    .card-head svg { width: 14px; height: 14px; stroke: var(--text-3); fill: none; stroke-width: 2; flex-shrink: 0; }
    .card-title { font-size: 12px; font-weight: 600; text-transform: uppercase; letter-spacing: .7px; color: var(--text-3); }
    .card-body { padding: 15px; }

    /* ── Overview strip ─────────────────────────────────────── */
    .ov-strip { display: grid; grid-template-columns: repeat(4,1fr); }
    .ov-item { display: flex; flex-direction: column; gap: 2px; padding: 13px 15px; border-right: 1px solid var(--border); }
    .ov-item:last-child { border-right: none; }
    @media (max-width: 440px) {
      .ov-strip { grid-template-columns: 1fr 1fr; }
      .ov-item { border-bottom: 1px solid var(--border); }
      .ov-item:nth-child(2) { border-right: none; }
      .ov-item:nth-child(3) { border-right: 1px solid var(--border); }
      .ov-item:nth-child(3),.ov-item:nth-child(4) { border-bottom: none; }
    }
    .ov-val   { font-size: 24px; font-weight: 600; line-height: 1.1; font-variant-numeric: tabular-nums; }
    .ov-label { font-size: 12px; font-weight: 500; color: var(--text-3); text-transform: uppercase; letter-spacing: .4px; margin-top: 3px; }
    .ov-avg   { font-size: 12px; color: var(--text-3); margin-top: 1px; }
    .ov-footer { padding: 9px 15px; border-top: 1px solid var(--border); font-size: 12px; color: var(--text-3); display: flex; gap: 16px; flex-wrap: wrap; }
    .ov-footer strong { color: var(--text-2); }

    /* ── Trend legend ───────────────────────────────────────── */
    .trend-legend { display: flex; gap: 13px; margin-bottom: 12px; }
    .legend-item  { display: flex; align-items: center; gap: 5px; font-size: 12px; color: var(--text-3); }
    .legend-dot   { width: 7px; height: 7px; border-radius: 50%; flex-shrink: 0; }

    /* ── Grouped vertical bar chart ─────────────────────────── */
    .bc-chart { display: flex; align-items: flex-end; height: 96px; }
    /* Gap between groups injected inline per mode */
    .bc-col {
      flex: 1; display: flex; flex-direction: column; align-items: center;
      gap: 4px; height: 100%; cursor: pointer; min-width: 0;
    }
    .bc-col:hover .bc-bar { opacity: 1 !important; }
    .bc-bar-wrap { flex: 1; width: 100%; display: flex; align-items: flex-end; gap: 2px; }
    .bc-bar { flex: 1; border-radius: 2px 2px 0 0; min-height: 0; }
    .bc-lbl { font-size: 9px; color: var(--text-3); white-space: nowrap; }

    /* ── Horizontal bar charts (consistent 7px height) ──────── */
    .bar-list  { display: flex; flex-direction: column; gap: 9px; }
    .bar-row   { display: flex; align-items: center; gap: 9px; min-height: 20px; }
    .bar-name  { font-size: 13px; color: var(--text-2); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; flex-shrink: 0; width: 84px; }
    .bar-track { flex: 1; height: 7px; background: var(--surface-2); border-radius: 4px; overflow: hidden; }
    .bar-fill  { height: 100%; border-radius: 4px; }
    .bar-count { min-width: 28px; text-align: right; font-size: 12px; color: var(--text-3); font-variant-numeric: tabular-nums; flex-shrink: 0; }

    /* ── Mood stacked bar ───────────────────────────────────── */
    .mood-labels-row { display: flex; height: 16px; position: relative; }
    .mood-bar-row    { display: flex; gap: 2px; height: 40px; }
    .mood-seg        { border-radius: 3px; transition: opacity .15s; }
    .mood-seg:hover  { opacity: .8; }
    .mood-below-row  { display: flex; height: 30px; position: relative; }
    .mood-below-cell { text-align: center; position: relative; overflow: visible; }
    .mood-below-val  { font-size: 12px; color: var(--text-2); font-variant-numeric: tabular-nums; white-space: nowrap; position: absolute; left: 50%; transform: translateX(-50%); }
    .mood-below-pct  { font-size: 10px; color: var(--text-3); white-space: nowrap; position: absolute; left: 50%; transform: translateX(-50%); top: 16px; }
    .mood-above-cell { text-align: center; position: relative; overflow: visible; }
    .mood-above-lbl  { font-size: 11px; color: var(--text-2); white-space: nowrap; position: absolute; left: 50%; transform: translateX(-50%); bottom: 0; }
    /* Mood toggle */
    .mood-toggle { display:flex; gap:0; margin-left:auto; background:var(--surface); border-radius:999px; padding:2px; border:1px solid var(--border); }
    .mood-toggle-btn {
      height:20px; padding:0 9px; border-radius:999px;
      border:none; background:transparent;
      font-size:10px; font-weight:600; text-transform:uppercase; letter-spacing:.4px;
      color:var(--text-3); cursor:pointer; transition:all .15s; font-family:inherit;
    }
    .mood-toggle-btn:hover { color:var(--text); }
    .mood-toggle-btn.active { background:var(--surface-2); color:var(--text); }

    /* ── Weekday ────────────────────────────────────────────── */
    .wd-chart   { display: flex; align-items: flex-end; gap: 5px; height: 72px; }
    .wd-col     { flex: 1; display: flex; flex-direction: column; align-items: center; gap: 3px; height: 100%; }
    .wd-bar-wrap{ flex: 1; width: 100%; display: flex; align-items: flex-end; }
    .wd-bar     { width: 100%; border-radius: 2px 2px 0 0; }
    .wd-lbl     { font-size: 11px; color: var(--text-3); }
    .wd-val     { font-size: 11px; color: var(--text-2); font-variant-numeric: tabular-nums; }

    /* ── People chips ───────────────────────────────────────── */
    .people-chips { display: flex; flex-wrap: wrap; gap: 6px; }
    .person-chip {
      height: 31px; padding: 0 11px; border-radius: 15px;
      border: 1px solid var(--border); background: transparent;
      font-size: 14px; color: var(--text-2); display: inline-flex; align-items: center; gap: 6px; transition: all .15s;
    }
    .person-chip:hover { border-color: var(--border-2); color: var(--text); }
    .person-chip-count { font-size: 11px; color: var(--text-3); }

    /* ── States ─────────────────────────────────────────────── */
    .spinner-wrap { display: flex; align-items: center; justify-content: center; padding: 80px; }
    .spinner { width: 31px; height: 31px; border: 2.6px solid var(--border-2); border-top-color: var(--accent); border-radius: 50%; animation: spin .7s linear infinite; }
    @keyframes spin { to { transform: rotate(360deg); } }
    .not-connected { margin: 32px 18px; padding: 28px 22px; background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); text-align: center; max-width: 420px; margin-left: auto; margin-right: auto; }
    .not-connected h2 { font-size: 16px; font-weight: 500; margin-bottom: 9px; }
    .not-connected p  { font-size: 14px; color: var(--text-2); line-height: 1.6; }
    .not-connected a  { color: var(--accent); text-decoration: none; }
    .empty-card { padding: 22px; text-align: center; font-size: 14px; color: var(--text-3); }
    .hidden { display: none !important; }

    /* ── Settings overlay ───────────────────────────────────── */
    .settings-overlay { position: fixed; inset: 0; z-index: 300; display: flex; align-items: flex-end; justify-content: center; }
    .settings-overlay.hidden { display: none !important; }
    .settings-backdrop { position: absolute; inset: 0; background: rgba(0,0,0,.45); }
    .settings-panel { position: relative; width: min(528px,100vw); background: var(--surface); border-radius: 15px 15px 0 0; border: 1px solid var(--border-2); box-shadow: 0 26px 66px rgba(0,0,0,.35); padding-bottom: calc(22px + env(safe-area-inset-bottom)); }
    .settings-head { display: flex; align-items: center; gap: 9px; padding: 12px 15px 11px; border-bottom: 1px solid var(--border); }
    .settings-head svg { width: 14px; height: 14px; stroke: var(--text-3); fill: none; stroke-width: 2; flex-shrink: 0; }
    .settings-head-title { font-size: 12px; font-weight: 600; text-transform: uppercase; letter-spacing: .7px; color: var(--text-3); }
    .settings-close { margin-left: auto; border: none; background: transparent; color: var(--text-3); cursor: pointer; font-size: 15px; padding: 4px; transition: color .15s; line-height: 1; }
    .settings-close:hover { color: var(--text); }
    .settings-body { display: flex; flex-direction: column; gap: 14px; padding: 16px 15px; }
    .settings-field { display: flex; flex-direction: column; gap: 5px; }
    .settings-label { font-size: 12px; font-weight: 500; color: var(--text-3); text-transform: uppercase; letter-spacing: .4px; }
    .settings-input { width: 100%; background: var(--surface-2); border: 1px solid var(--border); border-radius: 8px; padding: 8px 11px; font-size: 14px; color: var(--text); outline: none; transition: border-color .15s; font-family: inherit; }
    .settings-input:focus { border-color: var(--accent); }
    .settings-input::placeholder { color: var(--text-3); }
    .settings-hint { font-size: 12px; color: var(--text-3); }
    .settings-hint a { color: var(--accent); text-decoration: none; }
    .settings-status { font-size: 12px; color: var(--text-3); min-height: 16px; }
    .settings-status.ok  { color: var(--good); }
    .settings-status.err { color: var(--error); }
    .settings-actions { display: flex; gap: 9px; justify-content: flex-end; padding: 0 15px 2px; }
    .btn-primary { height: 37px; padding: 0 18px; border-radius: 9px; border: 1px solid rgba(253,147,159,.4); background: var(--accent-bg); font-size: 14px; font-weight: 500; color: var(--accent); cursor: pointer; transition: all .15s; font-family: inherit; }
    .btn-primary:hover { background: rgba(253,147,159,.2); }
    .btn-secondary { height: 37px; padding: 0 15px; border-radius: 9px; border: 1px solid var(--border); background: transparent; font-size: 14px; color: var(--text-3); cursor: pointer; transition: all .15s; font-family: inherit; }
    .btn-secondary:hover { background: var(--surface-2); color: var(--text); border-color: var(--border-2); }
    .hdr-icon.refreshing svg { animation: spin .7s linear infinite; }
    /* nav-btn: identical to capture.html */
    .nav-btn { width:31px;height:31px;border-radius:7px;border:1px solid var(--border);background:transparent;color:var(--text-3);display:flex;align-items:center;justify-content:center;cursor:pointer;transition:all .15s;flex-shrink:0; }
    .nav-btn:hover { background:var(--surface-2);color:var(--text);border-color:var(--border-2); }
    .nav-btn svg { width:14px;height:14px;stroke:currentColor;fill:none;stroke-width:2.5; }
    .nav-btn:disabled { opacity:.25;pointer-events:none; }
  </style>
</head>
<body>

<div class="header-wrap">
  <div class="header-inner">
    <div class="header-left"><!-- reserved --></div>

    <!-- Period picker overlay (adapted from capture.html datepicker) -->
    <div class="pp-overlay" id="ppOverlay">
      <div class="pp-backdrop" onclick="closePicker()"></div>
      <div class="pp-panel" id="ppPanel">
        <div class="pp-head">
          <button class="pp-nav" onclick="ppShift(-1)">
            <svg viewBox="0 0 24 24"><polyline points="15 18 9 12 15 6"/></svg>
          </button>
          <span class="pp-title" id="ppTitle" onclick="ppToggleMode()"></span>
          <button class="pp-nav" onclick="ppShift(1)">
            <svg viewBox="0 0 24 24"><polyline points="9 18 15 12 9 6"/></svg>
          </button>
        </div>
        <div id="ppBody"></div>
      </div>
    </div>

    <div class="header-center">
      <button class="nav-btn" id="navPrev" onclick="navigatePeriod(-1)" title="Zurück">
        <svg viewBox="0 0 24 24"><polyline points="15 18 9 12 15 6"/></svg>
      </button>
      <button class="period-btn" id="periodBtn" onclick="togglePicker()">
        <span id="periodLabel">Jahr wählen</span>
      </button>
      <button class="nav-btn" id="navNext" onclick="navigatePeriod(1)" title="Vor">
        <svg viewBox="0 0 24 24"><polyline points="9 18 15 12 9 6"/></svg>
      </button>
    </div>

    <div class="header-right">
      <button class="hdr-icon" id="refreshBtn" onclick="refreshIndex()" title="Index neu laden">
        <svg viewBox="0 0 24 24"><polyline points="23 4 23 10 17 10"/><polyline points="1 20 1 14 7 14"/><path d="M3.51 9a9 9 0 0 1 14.85-3.36L23 10M1 14l4.64 4.36A9 9 0 0 0 20.49 15"/></svg>
      </button>
      <button class="hdr-icon" id="connectBtn" onclick="openSettings()" title="Verbindung">
        <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M19.07 4.93a10 10 0 0 1 0 14.14M4.93 4.93a10 10 0 0 0 0 14.14"/></svg>
        <span class="gh-dot" id="connDot"></span>
      </button>
    </div>
  </div>
</div>

<!-- Settings -->
<div class="settings-overlay hidden" id="settingsOverlay">
  <div class="settings-backdrop" onclick="closeSettings()"></div>
  <div class="settings-panel">
    <div class="settings-head">
      <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M19.07 4.93a10 10 0 0 1 0 14.14M4.93 4.93a10 10 0 0 0 0 14.14"/></svg>
      <span class="settings-head-title">GitHub-Verbindung</span>
      <button class="settings-close" onclick="closeSettings()">✕</button>
    </div>
    <div class="settings-body">
      <div class="settings-field">
        <label class="settings-label">Personal Access Token</label>
        <input class="settings-input" type="password" id="cfgToken" placeholder="ghp_…" autocomplete="off">
        <p class="settings-hint">Token mit <code>repo</code>-Berechtigung. <a href="https://github.com/settings/tokens/new" target="_blank">Erstellen →</a></p>
      </div>
      <div class="settings-field">
        <label class="settings-label">Privates Repo</label>
        <input class="settings-input" type="text" id="cfgRepo" placeholder="username/diary-private" autocomplete="off">
      </div>
      <div class="settings-field">
        <label class="settings-label">Branch</label>
        <input class="settings-input" type="text" id="cfgBranch" placeholder="main" autocomplete="off">
      </div>
      <div class="settings-status" id="settingsStatus"></div>
    </div>
    <div class="settings-actions">
      <button class="btn-secondary" onclick="closeSettings()">Abbrechen</button>
      <button class="btn-primary" onclick="saveSettings()">Verbinden</button>
    </div>
  </div>
</div>

<div id="spinnerWrap" class="spinner-wrap"><div class="spinner"></div></div>
<div id="notConnected" class="not-connected hidden"></div>

<div class="page hidden" id="dashboard">
  <div class="card" id="cardOverview"></div>
  <div class="card" id="cardTrend"></div>
  <div class="cols">
    <div class="col">
      <div class="card" id="cardMood"></div>
      <div class="card" id="cardCoffee"></div>
    </div>
    <div class="col">
      <div class="card" id="cardSport"></div>
      <div class="card" id="cardLocations"></div>
      <div class="card" id="cardPeople"></div>
    </div>
  </div>
</div>

<script>
const MONTHS_SHORT = ['Jan','Feb','Mär','Apr','Mai','Jun','Jul','Aug','Sep','Okt','Nov','Dez'];
const MONTHS_FULL  = ['Januar','Februar','März','April','Mai','Juni','Juli','August','September','Oktober','November','Dezember'];
const WD_ORDER     = [1,2,3,4,5,6,0];
const WD_LABELS    = ['Mo','Di','Mi','Do','Fr','Sa','So'];
const MOOD_VALUES  = [-2,-1.5,-1,-0.5,0,0.5,1,1.5,2];
const MOOD_COLORS  = {'-2':'#e57373','-1.5':'#ef9a9a','-1':'#ffcc80','-0.5':'#9aa0a6','0':'#a0a0a0','0.5':'#a5d6a7','1':'#81c784','1.5':'#66bb6a','2':'#43a047'};
const METRICS = [
  { key:'coffee',  hex:'#FD939F', label:'Kaffee'  },
  { key:'apples',  hex:'#81c784', label:'Äpfel'   },
  { key:'bananas', hex:'#ffd54f', label:'Bananen' },
];

let INDEX = [], selYear = null, selMonth = null, moodView = 'dist', coffeeView = 'orte';
let ghCfg = { token:'', privateRepo:'', branch:'main' };
let mode  = 'local';

// ── Config — same localStorage keys as capture.html ──────────
// Both files share window.localStorage when served from the same origin
// → connecting once in capture.html is enough for dashboard.html too.
function loadCfg() {
  const s = JSON.parse(localStorage.getItem('ghConfig') || 'null');
  if (s) ghCfg = { ...ghCfg, ...s };
  mode = localStorage.getItem('connectionMode') || 'local';
}
function saveCfg(t, r, b) {
  ghCfg = { ...ghCfg, token:t, privateRepo:r, branch:b||'main' };
  mode  = 'github';
  localStorage.setItem('ghConfig', JSON.stringify(ghCfg));
  localStorage.setItem('connectionMode', 'github');
}

// ── Settings overlay ──────────────────────────────────────────
function openSettings() {
  loadCfg();
  document.getElementById('cfgToken').value  = ghCfg.token || '';
  document.getElementById('cfgRepo').value   = ghCfg.privateRepo || '';
  document.getElementById('cfgBranch').value = ghCfg.branch || 'main';
  document.getElementById('settingsStatus').textContent = '';
  document.getElementById('settingsStatus').className = 'settings-status';
  document.getElementById('settingsOverlay').classList.remove('hidden');
}
function closeSettings() { document.getElementById('settingsOverlay').classList.add('hidden'); }
async function saveSettings() {
  const token=document.getElementById('cfgToken').value.trim();
  const repo =document.getElementById('cfgRepo').value.trim();
  const branch=document.getElementById('cfgBranch').value.trim()||'main';
  const status=document.getElementById('settingsStatus');
  if (!token||!repo) { status.textContent='Token und Repo erforderlich.'; status.className='settings-status err'; return; }
  status.textContent='Wird geprüft…'; status.className='settings-status';
  try {
    const res = await fetch(`https://api.github.com/repos/${repo}`,{headers:{Authorization:`token ${token}`,Accept:'application/vnd.github.v3+json'}});
    if (!res.ok) throw new Error(`Repo nicht erreichbar (${res.status})`);
    saveCfg(token,repo,branch);
    status.textContent='Verbunden ✓'; status.className='settings-status ok';
    setTimeout(()=>{ closeSettings(); startLoad(); },600);
  } catch(e) { status.textContent=e.message; status.className='settings-status err'; }
}

// ── Period picker (adapted from capture.html datepicker) ─────
let ppMode = 'year'; // 'year' | 'month'
let ppViewYear = new Date().getFullYear();

function togglePicker() {
  const ov = document.getElementById('ppOverlay');
  if (ov.classList.contains('open')) { closePicker(); return; }
  // Open: default to year mode, scroll to current selYear if set
  ppMode = selYear ? 'month' : 'year';
  ppViewYear = selYear || new Date().getFullYear();
  renderPicker();
  ov.classList.add('open');
  document.getElementById('periodBtn').classList.add('open');
}
function closePicker() {
  document.getElementById('ppOverlay').classList.remove('open');
  document.getElementById('periodBtn').classList.remove('open');
}
function ppToggleMode() {
  ppMode = ppMode === 'year' ? 'month' : 'year';
  renderPicker();
}
function ppShift(delta) {
  if (ppMode === 'year') {
    // Shift visible year range (same as capture.html: ±9 years)
    ppViewYear += delta * 9;
  } else {
    // In month mode, shift year
    ppViewYear += delta;
  }
  renderPicker();
}

function renderPicker() {
  const title = document.getElementById('ppTitle');
  const body  = document.getElementById('ppBody');
  const years = getYears();

  if (ppMode === 'year') {
    title.textContent = 'Jahr wählen';
    // Show all available years + "Alle Jahre"
    const allSel = selYear === null;
    let html = '<div class="pp-years">';
    years.forEach(y => {
      const sel = y === selYear ? ' selected' : '';
      html += `<button class="pp-year-btn${sel}" onclick="ppPickYear(${y})">${y}</button>`;
    });
    html += '</div>';
    // "Alle Jahre" below the grid
    html += `<button class="pp-year-btn all${allSel?' selected':''}" style="width:100%;margin-top:11px" onclick="ppPickYear(null)">Alle Jahre</button>`;
    body.innerHTML = html;
  } else {
    // Month mode
    title.textContent = String(ppViewYear);
    const monthsShort = ['Jan','Feb','Mär','Apr','Mai','Jun','Jul','Aug','Sep','Okt','Nov','Dez'];
    const available = new Set(getMonthsInYear(ppViewYear));
    let html = '<div class="pp-months">';
    monthsShort.forEach((lbl, i) => {
      const m   = i + 1;
      const sel = (selYear === ppViewYear && selMonth === m) ? ' selected' : '';
      const dim = available.size > 0 && !available.has(m) ? 'opacity:.3;pointer-events:none' : '';
      html += `<button class="pp-month-btn${sel}" style="${dim}" onclick="ppPickMonth(${m})">${lbl}</button>`;
    });
    html += '</div>';
    // "Ganzes Jahr" — full width, same gap below grid
    const yearSel = selYear === ppViewYear && selMonth === null;
    html += `<div style="margin-top:7px"><button class="pp-month-btn all${yearSel?' selected':''}" style="width:100%" onclick="ppPickYear(${ppViewYear})">Ganzes Jahr</button></div>`;
    body.innerHTML = html;
  }
}

function ppPickYear(y) {
  if (y === null) {
    selYear = null; selMonth = null;
    closePicker(); renderAll(); return;
  }
  // Select the year immediately and re-render dashboard
  selYear = y; selMonth = null;
  renderAll();
  // Then show month picker for this year
  ppViewYear = y; ppMode = 'month';
  renderPicker();
}
function ppPickMonth(m) {
  if (m === 0) { selMonth = null; closePicker(); renderAll(); return; }
  selYear  = ppViewYear;
  selMonth = (selMonth === m && selYear === ppViewYear) ? null : m;
  closePicker(); renderAll();
}

function renderDropdowns() {
  // Update the single period button label
  const btn = document.getElementById('periodBtn');
  let label = 'Alle Jahre';
  let active = false;
  if (selYear) {
    active = true;
    label  = selMonth ? `${MONTHS_FULL[selMonth-1]} ${selYear}` : String(selYear);
  }
  document.getElementById('periodLabel').textContent = label;
  btn.classList.toggle('active', active);

  // Disable nav arrows at the edges
  const years = getYears();
  const firstYear = years[0], lastYear = years[years.length-1];
  const prevBtn = document.getElementById('navPrev');
  const nextBtn = document.getElementById('navNext');
  if (!prevBtn) return;
  if (!selYear) {
    prevBtn.disabled = true; nextBtn.disabled = true;
  } else if (selMonth) {
    // At first month of first year → disable prev
    prevBtn.disabled = (selYear === firstYear && selMonth === getMonthsInYear(firstYear)[0]);
    const lastMonths = getMonthsInYear(lastYear);
    nextBtn.disabled = (selYear === lastYear && selMonth === lastMonths[lastMonths.length-1]);
  } else {
    prevBtn.disabled = (selYear === firstYear);
    nextBtn.disabled = (selYear === lastYear);
  }
}

// Navigate prev/next period (year or month)
function navigatePeriod(delta) {
  const years = getYears();
  if (!selYear) return;

  if (selMonth) {
    // Move month, wrap across years
    const months = getMonthsInYear(selYear);
    const idx    = months.indexOf(selMonth);
    const newIdx = idx + delta;
    if (newIdx >= 0 && newIdx < months.length) {
      selMonth = months[newIdx];
    } else if (delta < 0) {
      // Go to prev year, last available month
      const prevYear = years[years.indexOf(selYear) - 1];
      if (prevYear) { selYear = prevYear; selMonth = getMonthsInYear(prevYear).at(-1); }
    } else {
      // Go to next year, first available month
      const nextYear = years[years.indexOf(selYear) + 1];
      if (nextYear) { selYear = nextYear; selMonth = getMonthsInYear(nextYear)[0]; }
    }
  } else {
    // Move year
    const newYear = years[years.indexOf(selYear) + delta];
    if (newYear) selYear = newYear;
  }
  renderAll();
}

// Arrow key navigation (only when picker is closed and no input is focused)
document.addEventListener('keydown', e => {
  if (e.key !== 'ArrowLeft' && e.key !== 'ArrowRight') return;
  if (document.activeElement && ['INPUT','TEXTAREA'].includes(document.activeElement.tagName)) return;
  if (document.getElementById('ppOverlay').classList.contains('open')) return;
  e.preventDefault();
  navigatePeriod(e.key === 'ArrowLeft' ? -1 : 1);
});

// ── GitHub ───────────────────────────────────────────────────
async function ghGet(path) {
  const {token,privateRepo,branch}=ghCfg;
  const res=await fetch(`https://api.github.com/repos/${privateRepo}/contents/${path}?ref=${branch}`,
    {headers:{Authorization:`token ${token}`,Accept:'application/vnd.github.v3+json'},cache:'no-store'});
  if(res.status===404) return null;
  if(!res.ok) throw new Error(`GitHub ${res.status}: ${path}`);
  return res.json();
}
let indexBuiltAt = null; // ISO string from search-index.json

async function fetchIndex() {
  if(mode!=='github'||!ghCfg.token||!ghCfg.privateRepo) return null;
  // Cache-bust with timestamp so GitHub CDN can't serve a stale response
  const bust = Date.now();
  const {token,privateRepo,branch}=ghCfg;
  const res=await fetch(
    `https://api.github.com/repos/${privateRepo}/contents/search-index.json?ref=${branch}&_=${bust}`,
    {headers:{Authorization:`token ${token}`,Accept:'application/vnd.github.v3+json'},cache:'no-store'}
  );
  if(res.status===404) return null;
  if(!res.ok) throw new Error(`GitHub ${res.status}: search-index.json`);
  const data=await res.json();
  const parsed=JSON.parse(decodeURIComponent(escape(atob(data.content.replace(/\n/g,'')))));
  indexBuiltAt = parsed.built || null;
  return parsed;
}

// ── Data helpers ─────────────────────────────────────────────
function getFiltered() {
  const todayStr  = new Date().toISOString().slice(0,10);
  const thisYear  = new Date().getFullYear();
  const thisMonth = new Date().getMonth() + 1;
  return INDEX.filter(e=>{
    if(selYear  && e.date.slice(0,4)!==String(selYear))    return false;
    if(selMonth && parseInt(e.date.slice(5,7))!==selMonth) return false;
    if(selYear===thisYear && !selMonth               && e.date > todayStr) return false;
    if(selYear===thisYear && selMonth===thisMonth    && e.date > todayStr) return false;
    return true;
  });
}
function sum(arr,f) { return arr.reduce((s,e)=>s+(parseFloat(e[f])||0),0); }
function parseList(str) { return (str||'').split(' ').filter(Boolean); }
function countList(entries,field) {
  const c={};
  entries.forEach(e=>parseList(e[field]).forEach(v=>{c[v]=(c[v]||0)+1;}));
  return Object.entries(c).sort((a,b)=>b[1]-a[1]);
}
function moodDist(entries) {
  const d={}; MOOD_VALUES.forEach(v=>{d[v]=0;});
  entries.forEach(e=>{const v=parseFloat(e.mood); if(!isNaN(v)&&d[v]!==undefined) d[v]++;});
  return d;
}
function weekdayAvgs(entries,field) {
  const sums=Array(7).fill(0),counts=Array(7).fill(0);
  entries.forEach(e=>{const wi=e.weekday_index!==undefined?parseInt(e.weekday_index):-1; if(wi>=0){sums[wi]+=(parseFloat(e[field])||0);counts[wi]++;}});
  return sums.map((s,i)=>counts[i]>0?+(s/counts[i]).toFixed(2):0);
}
function monthlyTotals(entries,field) {
  const t=Array(12).fill(0);
  entries.forEach(e=>{t[parseInt(e.date.slice(5,7))-1]+=(parseFloat(e[field])||0);});
  return t;
}
function getYears() { return [...new Set(INDEX.map(e=>parseInt(e.date.slice(0,4))))].sort((a,b)=>a-b); }
function getMonthsInYear(y) { return [...new Set(INDEX.filter(e=>e.date.slice(0,4)===String(y)).map(e=>parseInt(e.date.slice(5,7))))].sort((a,b)=>a-b); }
function getAvgDivisor(E) {
  const today=new Date(), ty=today.getFullYear(), tm=today.getMonth()+1;
  if (selYear===ty && !selMonth)
    return Math.floor((today-new Date(ty,0,1))/86400000)+1;
  if (selYear===ty && selMonth===tm)
    return today.getDate();
  return E.length||1;
}
const fmt=n=>Math.round(n).toLocaleString('de-CH');
const fmtD=n=>n.toFixed(1);

// ── Animation: bars start at 0, animate to data-w / data-h ──
// Works even on full re-render because we trigger after DOM paint.
function animateCharts() {
  requestAnimationFrame(()=>{
    document.querySelectorAll('[data-w]').forEach(el=>{
      el.style.transition='width .45s cubic-bezier(.4,0,.2,1)';
      el.style.width=el.dataset.w+'%';
    });
    document.querySelectorAll('[data-h]').forEach(el=>{
      el.style.transition='height .45s cubic-bezier(.4,0,.2,1)';
      el.style.height=el.dataset.h+'%';
    });
  });
}

// Helper: horizontal bar (animatable)
function hBar(pct, color, extra='') {
  return `<div class="bar-fill" data-w="${pct}" style="width:0%;background:${color};transition:none${extra}"></div>`;
}

// ── Trend card: grouped vertical bars with larger gaps ────────
function renderTrend(E) {
  const legend=METRICS.map(m=>`<div class="legend-item"><div class="legend-dot" style="background:${m.hex}"></div>${m.label}</div>`).join('');

  let cols='', gap='', title='Konsum · Trend';

  if (!selYear) {
    // All years: shared max so coffee > apples > bananas visible
    const years=getYears();
    const data=METRICS.map(m=>years.map(y=>sum(INDEX.filter(e=>e.date.slice(0,4)===String(y)),m.key)));
    const sharedMax=Math.max(...data.flatMap(v=>v),1);
    gap='14px';
    cols=years.map((y,i)=>`
      <div class="bc-col" onclick="ppPickYear(${y})" title="${y}">
        <div class="bc-bar-wrap">
          ${METRICS.map((m,mi)=>{
            const h=data[mi][i]/sharedMax*100;
            return `<div class="bc-bar" data-h="${h}" style="height:0%;background:${m.hex};opacity:.7;transition:none"></div>`;
          }).join('')}
        </div>
        <div class="bc-lbl">${y}</div>
      </div>`).join('');
  } else {
    // Year view: always use full year regardless of selMonth,
    // and shared max so relative sizes between metrics are correct
    const yearEntries=INDEX.filter(e=>e.date.slice(0,4)===String(selYear));
    const data=METRICS.map(m=>monthlyTotals(yearEntries,m.key));
    const sharedMax=Math.max(...data.flatMap(v=>v),1);
    gap='8px';
    cols=Array.from({length:12},(_,i)=>{
      const active=selMonth===i+1;
      return `
      <div class="bc-col" onclick="ppPickMonth(${active?0:i+1})" title="${MONTHS_FULL[i]}">
        <div class="bc-bar-wrap">
          ${METRICS.map((m,mi)=>{
            const h=data[mi][i]/sharedMax*100;
            return `<div class="bc-bar" data-h="${h}" style="height:0%;background:${m.hex};opacity:${active?1:.6};transition:none${active?';outline:1px solid '+m.hex+'55':''}"></div>`;
          }).join('')}
        </div>
        <div class="bc-lbl" style="${active?'color:var(--accent)':''}">${MONTHS_SHORT[i]}</div>
      </div>`;
    }).join('');
  }

  document.getElementById('cardTrend').innerHTML=`
    <div class="card-head">
      <svg viewBox="0 0 24 24"><polyline points="23 6 13.5 15.5 8.5 10.5 1 18"/><polyline points="17 6 23 6 23 12"/></svg>
      <span class="card-title">${title}</span>
    </div>
    <div class="card-body">
      <div class="trend-legend">${legend}</div>
      <div class="bc-chart" style="gap:${gap}">${cols}</div>

}

function toggleCoffeeView(v) { coffeeView = v; renderCoffee(getFiltered()); animateCharts(); }

// SVG mood line chart — HTML labels (CSS font-size reliable on all browsers/iOS)
function buildMoodLine(points, xLabels) {
  const VW=500, VH=140, PL=3, PR=3, PT=8, PB=4;
  const CW=VW-PL-PR, CH=VH-PT-PB;
  const N = points.length;
  const xOf = i => PL + (N<=1 ? CW/2 : i/(N-1)*CW);
  const yOf = v => PT + (1-(v+2)/4)*CH;
  const STACK_COLORS = {'-2':'#c91d1d','-1.5':'#ec3f3c','-1':'#e66060','-0.5':'#f08f98','0':'#e6e6e6','0.5':'#b3eab5','1':'#69c96e','1.5':'#43a047','2':'#25742b'};
  const lbl_css = 'font-size:9px;color:#666;line-height:1;white-space:nowrap;font-family:ui-sans-serif,system-ui,-apple-system,sans-serif';

  // Y-labels: absolutely positioned at % of SVG height
  const yLbls = [{v:2,lbl:'+2'},{v:0,lbl:'0'},{v:-2,lbl:'-2'}];
  const yLabelsHtml = yLbls.map(({v,lbl}) => {
    const pct = (yOf(v)/VH*100).toFixed(1);
    return `<div style="position:absolute;top:${pct}%;right:4px;transform:translateY(-50%);${lbl_css}">${lbl}</div>`;
  }).join('');

  // X-labels: absolutely positioned below SVG
  const showLabel = i => N<=12 ? true : i===0||i===N-1||(i+1)%5===0;
  const xLabelsHtml = xLabels.map((lbl,i) => {
    if (!showLabel(i)) return '';
    const lp = (xOf(i)/VW*100).toFixed(2);
    const xform = i===0 ? '' : i===N-1 ? 'transform:translateX(-100%)' : 'transform:translateX(-50%)';
    return `<div style="position:absolute;left:${lp}%;${xform};${lbl_css}">${lbl}</div>`;
  }).join('');

  // SVG: visual elements only, no text
  let svg = `<svg viewBox="0 0 ${VW} ${VH}" width="100%" style="display:block;overflow:visible" xmlns="http://www.w3.org/2000/svg">`;

  const y0=yOf(0), yTop=yOf(2), yBot=yOf(-2);
  svg += `<rect x="${PL}" y="${yTop}" width="${CW}" height="${y0-yTop}" fill="#25742b" opacity=".05"/>`;
  svg += `<rect x="${PL}" y="${y0}"   width="${CW}" height="${yBot-y0}" fill="#c91d1d" opacity=".05"/>`;

  [-2,-1,0,1,2].forEach(v => {
    const y=yOf(v);
    svg += `<line x1="${PL}" y1="${y}" x2="${VW-PR}" y2="${y}" stroke="#444444" stroke-width="1"/>`;
  });

  xLabels.forEach((_,i) => {
    if (!showLabel(i)) return;
    svg += `<line x1="${xOf(i)}" y1="${yBot}" x2="${xOf(i)}" y2="${yBot+4}" stroke="#444" stroke-width=".5"/>`;
  });

  let seg=[];
  const flush=()=>{
    if(seg.length>1) svg+=`<polyline points="${seg.map(p=>`${xOf(p.i)},${yOf(p.y)}`).join(' ')}" fill="none" stroke="#888" stroke-width="5" stroke-linejoin="round" stroke-linecap="round"/>`;
    seg=[];
  };
  points.forEach((p,i)=>{ p.y===null?flush():seg.push({i,y:p.y}); });
  flush();

  points.forEach((p,i)=>{
    if(p.y===null) return;
    const nearest=MOOD_VALUES.reduce((a,b)=>Math.abs(b-p.y)<Math.abs(a-p.y)?b:a,MOOD_VALUES[0]);
    svg+=`<circle cx="${xOf(i)}" cy="${yOf(p.y)}" r="3.5" fill="${STACK_COLORS[String(nearest)]||'#888'}" stroke="#262626" stroke-width="1.5"/>`;
  });
  svg += '</svg>';

  return `<div style="display:grid;grid-template-columns:34px 1fr;grid-template-rows:auto auto">
    <div style="grid-column:1;grid-row:1;position:relative">${yLabelsHtml}</div>
    <div style="grid-column:2;grid-row:1">${svg}</div>
    <div style="grid-column:2;grid-row:2;position:relative;height:18px;margin-top:3px;overflow:visible">${xLabelsHtml}</div>
  </div>`;
}

function renderMood(E) {
  const STACK_COLORS = {
    '-2':'#c91d1d','-1.5':'#ec3f3c','-1':'#e66060','-0.5':'#f08f98',
    '0':'#e6e6e6',
    '0.5':'#b3eab5','1':'#69c96e','1.5':'#43a047','2':'#25742b'
  };
  const INTEGERS = new Set([-2,-1,0,1,2]);

  const toggle = `
    <div class="mood-toggle">
      <button class="mood-toggle-btn ${moodView==='dist'?'active':''}" onclick="toggleMoodView('dist')">Verteilung</button>
      <button class="mood-toggle-btn ${moodView==='trend'?'active':''}" onclick="toggleMoodView('trend')">Verlauf</button>
    </div>`;
  const head = `<div class="card-head"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"/><path d="M8 14s1.5 2 4 2 4-2 4-2"/><line x1="9" y1="9" x2="9.01" y2="9"/><line x1="15" y1="9" x2="15.01" y2="9"/></svg><span class="card-title">Stimmung</span>${toggle}</div>`;

  if (!E.length) {
    document.getElementById('cardMood').innerHTML=`${head}<div class="card-body"><div class="empty-card">Keine Daten</div></div>`;
    return;
  }

  if (moodView === 'trend') {
    // ── Verlauf: line chart ───────────────────────────────────
    let points, xLabels;

    if (!selMonth) {
      // Year view: monthly averages
      points = MONTHS_SHORT.map((lbl, i) => {
        const me = E.filter(e => parseInt(e.date.slice(5,7)) === i+1);
        const y  = me.length ? +(me.reduce((s,e)=>s+(parseFloat(e.mood)||0),0)/me.length).toFixed(2) : null;
        return { y };
      });
      xLabels = MONTHS_SHORT;
    } else {
      // Month view: daily values
      const daysInMonth = new Date(selYear, selMonth, 0).getDate();
      points = Array.from({length: daysInMonth}, (_, i) => {
        const day  = String(i+1).padStart(2,'0');
        const mon  = String(selMonth).padStart(2,'0');
        const date = `${selYear}-${mon}-${day}`;
        const entry = E.find(e => e.date === date);
        return { y: entry ? (parseFloat(entry.mood)||0) : null };
      });
      xLabels = Array.from({length: daysInMonth}, (_, i) => String(i+1));
    }

    const chart = buildMoodLine(points, xLabels);
    document.getElementById('cardMood').innerHTML=`${head}<div class="card-body">${chart}</div>`;
    return;
  }

  // ── Verteilung: stacked bar ───────────────────────────────
  const dist  = moodDist(E);
  const total = Object.values(dist).reduce((s,v)=>s+v,0) || 1;
  const segs  = MOOD_VALUES
    .map(v => ({ v, c: dist[v]||0, pct: (dist[v]||0)/total*100 }))
    .filter(s => s.c > 0);

  if (!segs.length) {
    document.getElementById('cardMood').innerHTML=`${head}<div class="card-body"><div class="empty-card">Keine Einträge</div></div>`;
    return;
  }

  const labelsAbove = segs.map(s => {
    const isInt = INTEGERS.has(s.v);
    const lbl   = s.v > 0 ? `+${s.v}` : String(s.v);
    return `<div class="mood-above-cell" style="flex:${s.pct}"><span class="mood-above-lbl">${isInt ? lbl : ''}</span></div>`;
  }).join('');

  const barSegs = segs.map(s => {
    const col = STACK_COLORS[String(s.v)] || '#888';
    return `<div class="mood-seg" style="flex:${s.pct};background:${col}" title="${s.v>0?'+'+s.v:s.v}: ${s.c}×"></div>`;
  }).join('');

  const labelsBelow = segs.map(s => {
    const pct = Math.round(s.pct);
    return `<div class="mood-below-cell" style="flex:${s.pct}">
      <span class="mood-below-val">${s.c}</span>
      <span class="mood-below-pct">${pct}%</span>
    </div>`;
  }).join('');

  document.getElementById('cardMood').innerHTML=`
    ${head}
    <div class="card-body">
      <div class="mood-stack-wrap">
        <div class="mood-labels-row">${labelsAbove}</div>
        <div class="mood-bar-row">${barSegs}</div>
        <div class="mood-below-row">${labelsBelow}</div>
      </div>
    </div>`;
}

// ── Weekday ───────────────────────────────────────────────────
function renderWeekday(E) {
  const avgs=weekdayAvgs(E,'coffee'), vals=WD_ORDER.map(i=>avgs[i]);
  const maxV=Math.max(...vals,0.01);
  const cols=vals.map((v,i)=>`
    <div class="wd-col">
      <div class="wd-bar-wrap"><div class="wd-bar" data-h="${v/maxV*100}" style="height:0%;background:var(--c-coffee);opacity:${.35+v/maxV*.65};min-height:${v>0?'0':'0'};border-radius:2px 2px 0 0;transition:none"></div></div>
      <div class="wd-lbl">${WD_LABELS[i]}</div>
      <div class="wd-val">${v>0?fmtD(v):'–'}</div>
    </div>`).join('');
  document.getElementById('cardWeekday').innerHTML=`
    <div class="card-head"><svg viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="18" rx="2"/><line x1="16" y1="2" x2="16" y2="6"/><line x1="8" y1="2" x2="8" y2="6"/><line x1="3" y1="10" x2="21" y2="10"/></svg><span class="card-title">Wochentag · ⌀ Kaffee</span></div>
    <div class="card-body"><div class="wd-chart">${cols}</div></div>`;
}

// ── Coffee locations ──────────────────────────────────────────
function renderCoffee(E) {
  const coffeeIcon = `<svg viewBox="0 0 24 24"><path d="M17 8h1a4 4 0 0 1 0 8h-1"/><path d="M3 8h14v9a4 4 0 0 1-4 4H7a4 4 0 0 1-4-4V8z"/><line x1="6" y1="1" x2="6" y2="4"/><line x1="10" y1="1" x2="10" y2="4"/><line x1="14" y1="1" x2="14" y2="4"/></svg>`;
  const toggle = `
    <div class="mood-toggle">
      <button class="mood-toggle-btn ${coffeeView==='orte'?'active':''}" onclick="toggleCoffeeView('orte')">Orte</button>
      <button class="mood-toggle-btn ${coffeeView==='tage'?'active':''}" onclick="toggleCoffeeView('tage')">Tage</button>
    </div>`;
  const head = `<div class="card-head">${coffeeIcon}<span class="card-title">Kaffee</span>${toggle}</div>`;

  let body;

  if (coffeeView === 'orte') {
    const locs = countList(E,'coffeeLocations').slice(0,10);
    const maxC = locs[0]?.[1] || 1;
    const rows = locs.map(([name,c]) => `
      <div class="bar-row">
        <div class="bar-name" title="${name}">${name}</div>
        <div class="bar-track">${hBar(c/maxC*100,'var(--c-coffee)')}</div>
        <div class="bar-count">${c}</div>
      </div>`).join('');
    body = rows ? `<div class="bar-list">${rows}</div>` : '<div class="empty-card">Keine Daten</div>';

  } else {
    // Tage: weekday averages, fixed scale 0–5
    const avgs = weekdayAvgs(E, 'coffee');
    const rows = WD_ORDER.map((wi, i) => {
      const v = avgs[wi];
      const pct = Math.min(v / 5 * 100, 100);
      return `
      <div class="bar-row">
        <div class="bar-name">${WD_LABELS[i]}</div>
        <div class="bar-track">${hBar(pct, 'var(--c-coffee)')}</div>
        <div class="bar-count">${v > 0 ? fmtD(v) : '–'}</div>
      </div>`;
    }).join('');
    body = `<div class="bar-list">${rows}</div>`;
  }

  document.getElementById('cardCoffee').innerHTML = `${head}<div class="card-body">${body}</div>`;
}

// ── Locations ─────────────────────────────────────────────────
// locations field: space-separated "Zurich:CH Milan:IT" tokens
function renderLocations(E) {
  const counts = {}; // key: "Zurich:CH"
  E.forEach(e => {
    (e.locations || '').split(' ').filter(Boolean).forEach(token => {
      counts[token] = (counts[token] || 0) + 1;
    });
  });
  const locs = Object.entries(counts).sort((a,b) => b[1]-a[1]).slice(0, 10);
  const maxC = locs[0]?.[1] || 1;

  const rows = locs.map(([token, c]) => {
    const [city, country] = token.split(':');
    const label  = city || token;
    const suffix = country ? ` <span style="opacity:.45">(${country})</span>` : '';
    return `
    <div class="bar-row">
      <div class="bar-name" title="${label}${country?' ('+country+')':''}">${label}${suffix}</div>
      <div class="bar-track">${hBar(c/maxC*100,'var(--good)')}</div>
      <div class="bar-count">${c}</div>
    </div>`;
  }).join('');

  document.getElementById('cardLocations').innerHTML=`
    <div class="card-head"><svg viewBox="0 0 24 24"><path d="M21 10c0 7-9 13-9 13s-9-6-9-13a9 9 0 0 1 18 0z"/><circle cx="12" cy="10" r="3"/></svg><span class="card-title">Orte</span></div>
    <div class="card-body">${rows?`<div class="bar-list">${rows}</div>`:'<div class="empty-card">Keine Ortsdaten</div>'}</div>`;
}

// ── Sport ─────────────────────────────────────────────────────
function renderSport(E) {
  const sports=countList(E,'sport').slice(0,8), maxC=sports[0]?.[1]||1;
  const rows=sports.map(([name,c])=>`
    <div class="bar-row">
      <div class="bar-name" title="${name}">${name}</div>
      <div class="bar-track">${hBar(c/maxC*100,'var(--c-km)')}</div>
      <div class="bar-count">${c}</div>
    </div>`).join('');
  document.getElementById('cardSport').innerHTML=`
    <div class="card-head"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"/><path d="M12 8v4l3 3"/></svg><span class="card-title">Sport</span></div>
    <div class="card-body">${rows?`<div class="bar-list">${rows}</div>`:'<div class="empty-card">Keine Daten</div>'}</div>`;
}

// ── People ────────────────────────────────────────────────────
function renderPeople(E) {
  const people=countList(E,'people').slice(0,20);
  const chips=people.map(([n,c])=>`<span class="person-chip">${n}<span class="person-chip-count">${c}</span></span>`).join('');
  document.getElementById('cardPeople').innerHTML=`
    <div class="card-head"><svg viewBox="0 0 24 24"><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M23 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/></svg><span class="card-title">Personen</span></div>
    <div class="card-body">${chips?`<div class="people-chips">${chips}</div>`:'<div class="empty-card">Keine Personendaten</div>'}</div>`;
}

// ── Render all ────────────────────────────────────────────────
function renderAll() {
  const E=getFiltered();
  renderDropdowns();
  renderOverview(E);
  renderTrend(E);
  renderMood(E);
  renderCoffee(E);
  renderLocations(E);
  renderSport(E);
  renderPeople(E);
  animateCharts(); // fire after all DOM updates
}

// ── Init ──────────────────────────────────────────────────────
function updateConnectBtn() {
  const btn=document.getElementById('connectBtn');
  if(mode==='github'&&ghCfg.token&&ghCfg.privateRepo) btn.classList.add('ok');
  else btn.classList.remove('ok');
}

async function refreshIndex() {
  const btn=document.getElementById('refreshBtn');
  btn.classList.add('refreshing');
  try {
    const result=await fetchIndex();
    if(result?.index?.length) {
      // Remember current selection
      const prevYear=selYear, prevMonth=selMonth;
      INDEX=result.index;
      // Restore selection if still valid, otherwise keep as-is
      selYear=prevYear; selMonth=prevMonth;
      renderAll();
    }
  } catch(e) { console.warn('Refresh failed:', e.message); }
  btn.classList.remove('refreshing');
}

async function startLoad() {
  const spinner=document.getElementById('spinnerWrap');
  const notConn=document.getElementById('notConnected');
  const dash=document.getElementById('dashboard');
  notConn.classList.add('hidden'); dash.classList.add('hidden'); spinner.classList.remove('hidden');
  loadCfg(); updateConnectBtn();
  if(mode!=='github'||!ghCfg.token||!ghCfg.privateRepo) {
    spinner.classList.add('hidden');
    notConn.innerHTML=`<h2>Keine Verbindung</h2><p>Verbindung im Erfassen-Tool einrichten — das Dashboard nutzt dieselbe Konfiguration. Oder hier oben rechts neu verbinden.</p>`;
    notConn.classList.remove('hidden'); return;
  }
  try {
    const result=await fetchIndex();
    if(!result?.index?.length) {
      spinner.classList.add('hidden');
      notConn.innerHTML=`<h2>Index nicht gefunden</h2><p>Öffne das <a href="index.html">Erfassen-Tool</a> und klicke auf Suchen — der Index wird automatisch aufgebaut.</p>`;
      notConn.classList.remove('hidden'); return;
    }
    INDEX=result.index;
    selYear=getYears().at(-1)??null;
    renderAll();
    spinner.classList.add('hidden'); dash.classList.remove('hidden');
  } catch(err) {
    spinner.classList.add('hidden');
    notConn.innerHTML=`<h2>Fehler</h2><p>${err.message}</p>`;
    notConn.classList.remove('hidden');
  }
}

startLoad();
</script>
